'use strict';

/* ==========================================================================
   LA CONFESIÓN — Mateo y Rossy
   Juego pixel art 100% canvas, sin librerías, sin assets externos.
   --------------------------------------------------------------------------
   SINOPSIS
   Mateo lleva meses queriendo confesarle algo a Rossy, la chica que le gusta.
   Hoy es el día. Pero el Colegio San Esteban no es lo que parece. A medida
   que las horas avanzan los pasillos cambian, los compañeros susurran y la
   realidad se desmorona. ¿Logrará Mateo confesarse... antes de que el
   colegio devore lo que queda de él?
   --------------------------------------------------------------------------
   ARQUITECTURA
   1. Constantes y paletas
   2. Audio sintetizado (WebAudio)
   3. Input (teclado + touch)
   4. Sprites pixel art (arrays 16x16)
   5. Tiles del mundo (procedurales)
   6. Mapas por escena
   7. Diálogos por acto/personaje
   8. Entidades (Player, NPC)
   9. Gestor de escenas
   10. Sistema de diálogo con typewriter
   11. Estado de juego (acto, flags)
   12. Render con efectos de horror
   13. Bucle principal
   ========================================================================== */


/* ==========================================================================
   1. CONSTANTES Y PALETAS
   ========================================================================== */

/* ==========================================================================
   2. AUDIO SINTETIZADO
   ========================================================================== */
const Audio = {
  ctx:null, muted:false, ambient:null,
  init(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } },
  tone(freq, dur, type='square', vol=0.08, slide=0){
    if(!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq+slide), t+dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t+dur);
  },
  blip(){ this.tone(700, 0.04, 'square', 0.04); },
  step(){ this.tone(120 + Math.random()*40, 0.03, 'square', 0.025); },
  open(){ this.tone(440, 0.08, 'triangle', 0.07); setTimeout(()=>this.tone(660, 0.08, 'triangle', 0.07), 60); },
  ok(){ this.tone(523, 0.07, 'square', 0.08); setTimeout(()=>this.tone(784, 0.10, 'square', 0.08), 70); },
  bad(){ this.tone(220, 0.18, 'sawtooth', 0.10, -120); },
  scare(){ this.tone(80, 0.35, 'sawtooth', 0.16, -40); setTimeout(()=>this.tone(60, 0.5, 'sawtooth', 0.12, -20), 50); },
  glitch(){
    if(!this.ctx || this.muted) return;
    for(let i=0;i<6;i++) setTimeout(()=>this.tone(100 + Math.random()*900, 0.04, 'sawtooth', 0.06), i*40);
  },
  toggle(){ this.muted = !this.muted; },
};


/* ==========================================================================
   3. INPUT
   ========================================================================== */
const Input = {
  up:false, down:false, left:false, right:false,
  actionHeld:false, _actionEdge:false, actionPressed:false,
  init(){
    addEventListener('keydown', e => {
      if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Space'].includes(e.key)) e.preventDefault();
      if(e.repeat) return;
      const k = e.key.toLowerCase();
      if(k==='arrowup'||k==='w') this.up = true;
      if(k==='arrowdown'||k==='s') this.down = true;
      if(k==='arrowleft'||k==='a') this.left = true;
      if(k==='arrowright'||k==='d') this.right = true;
      if(k===' '||e.code==='Space'||k==='e'||k==='enter'){ if(!this.actionHeld) this._actionEdge = true; this.actionHeld = true; }
      if(k==='m') Audio.toggle();
      Audio.init();
    });
    addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      if(k==='arrowup'||k==='w') this.up = false;
      if(k==='arrowdown'||k==='s') this.down = false;
      if(k==='arrowleft'||k==='a') this.left = false;
      if(k==='arrowright'||k==='d') this.right = false;
      if(k===' '||e.code==='Space'||k==='e'||k==='enter') this.actionHeld = false;
    });

    const setup = (id, on, off) => {
      const el = document.getElementById(id); if(!el) return;
      const start = e => { e.preventDefault(); on(); Audio.init(); };
      const end = e => { e.preventDefault(); off(); };
      el.addEventListener('touchstart', start, {passive:false});
      el.addEventListener('touchend', end, {passive:false});
      el.addEventListener('touchcancel', end, {passive:false});
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
      el.addEventListener('mouseleave', end);
    };
    setup('dU', ()=>this.up=true, ()=>this.up=false);
    setup('dD', ()=>this.down=true, ()=>this.down=false);
    setup('dL', ()=>this.left=true, ()=>this.left=false);
    setup('dR', ()=>this.right=true, ()=>this.right=false);
    setup('bA',
      ()=>{ if(!this.actionHeld) this._actionEdge = true; this.actionHeld = true; },
      ()=>this.actionHeld = false );

    const cv = document.getElementById('game');
    cv.addEventListener('touchstart', e => { Audio.init(); }, {passive:true});
    cv.addEventListener('mousedown', e => { Audio.init(); });

    if('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');
  },
  poll(){ this.actionPressed = this._actionEdge; this._actionEdge = false; },
};

/* ==========================================================================

   Indices: 0=outline/ojos, 1=piel, 2=pelo, 3=camisa, 4=pantalón/falda, 5=zapato

const PAL_MATEO  = ['#000', '#f0c8a0', '#5a3a20', '#e0e0e0', '#3050a0', '#1a1a1a'];
const PAL_ROSSY  = ['#000', '#f8d8b0', '#c83060', '#f070a0', '#a02050', '#1a1a1a']; // pelo magenta, falda rosa

const PAL_DIEGO  = ['#000', '#d89860', '#a82020', '#c02020', '#1a1a1a', '#1a1a1a'];
const PAL_PROF   = ['#000', '#e8b888', '#000',    '#603020', '#1a1a1a', '#1a1a1a'];

// Paleta blood (manchas en horror)
const BLOOD_RED = '#a01818';
const BLOOD_DK  = '#5a0808';


/* ==========================================================================
   Utilidad: dibujar un sprite (16x16) en un canvas off-screen
   con una paleta dada. Cachea por (sprite + paleta + flip).
   ========================================================================== */
const SPRITE_CACHE = new Map();
function getSprite(spriteData, palette, flip = false){
  const key = palette.join('') + '|' + spriteData[0].length + '|' + spriteData.length + '|' + (flip?1:0) + '|' + spriteData[1] + spriteData[5];
  if(SPRITE_CACHE.has(key)) return SPRITE_CACHE.get(key);
  const c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  const cx = c.getContext('2d');
  for(let y = 0; y < 16; y++){
    const row = spriteData[y];
    for(let x = 0; x < 16; x++){
      const ch = row[x];
      if(ch === '.' || ch === ' ') continue;
      const idx = parseInt(ch, 10);
      if(isNaN(idx)) continue;
      const col = palette[idx % palette.length];
      if(!col) continue;
      cx.fillStyle = col;
      const px = flip ? (15 - x) : x;
      cx.fillRect(px, y, 1, 1);
    }
  }
  SPRITE_CACHE.set(key, c);
  return c;
}


/* ==========================================================================
   5. TILES — dibujados proceduralmente sobre canvas off-screen
   y cacheados por (tipo + paleta de horror).
   ========================================================================== */
const TILE_CACHE = new Map();
function getTile(type, horror){
  const key = type + '|' + horror;
  if(TILE_CACHE.has(key)) return TILE_CACHE.get(key);
  const c = document.createElement('canvas');
  c.width = TILE; c.height = TILE;
  const cx = c.getContext('2d');
  const P = WORLD_PAL[horror];
  drawTile(cx, type, P, horror);
  TILE_CACHE.set(key, c);
  return c;
}

function drawTile(cx, type, P, horror){
  // Helper para "mancha" de sangre aleatoria pero estable por tipo
  function bloodSplat(seed){
    if(horror < HORROR.BROKEN) return;
    // PRNG simple basado en seed
    let s = seed;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const drops = horror === HORROR.FINAL ? 5 : 3;
    for(let i = 0; i < drops; i++){
      cx.fillStyle = i % 2 === 0 ? BLOOD_RED : BLOOD_DK;
      const x = Math.floor(rnd() * 14);
      const y = Math.floor(rnd() * 14);
      cx.fillRect(x, y, 2, 1);
      cx.fillRect(x + 1, y + 1, 1, 2);
    }
  }

  switch(type){
    case 'floor': {
      cx.fillStyle = P.floor;
      cx.fillRect(0, 0, TILE, TILE);
      cx.fillStyle = P.floorDk;
      cx.fillRect(0, 0, TILE, 1);
      cx.fillRect(0, 0, 1, TILE);
      // patrón sutil
      cx.fillRect(7, 4, 1, 1);
      cx.fillRect(11, 11, 1, 1);
      bloodSplat(101);
      break;
    }
    case 'wall': {
      cx.fillStyle = P.wall;
      cx.fillRect(0, 0, TILE, TILE);
      cx.fillStyle = P.wallDk;
      cx.fillRect(0, 0, TILE, 2);
      cx.fillRect(0, TILE - 2, TILE, 2);
      // ladrillos
      cx.fillStyle = P.wallDk;
      cx.fillRect(0, 7, TILE, 1);
      cx.fillRect(8, 0, 1, 7);
      cx.fillRect(4, 8, 1, 8);
      cx.fillRect(12, 8, 1, 8);
      bloodSplat(202);
      break;
    }
    case 'locker': {
      cx.fillStyle = P.locker;
      cx.fillRect(0, 0, TILE, TILE);
      cx.fillStyle = P.lockerDk;
      cx.fillRect(0, 0, TILE, 1);
      cx.fillRect(0, TILE - 1, TILE, 1);
      cx.fillRect(7, 0, 1, TILE);
      cx.fillStyle = P.lockerLine;
      cx.fillRect(2, 5, 4, 1);
      cx.fillRect(10, 5, 4, 1);
      // candados
      cx.fillStyle = P.lockerDk;
      cx.fillRect(3, 9, 2, 2);
      cx.fillRect(11, 9, 2, 2);
      bloodSplat(303);
      break;
    }
    case 'desk': {
      cx.fillStyle = P.floor;
      cx.fillRect(0, 0, TILE, TILE);
      cx.fillStyle = P.desk;
      cx.fillRect(1, 4, 14, 9);
      cx.fillStyle = P.deskDk;
      cx.fillRect(1, 4, 14, 1);
      cx.fillRect(1, 12, 14, 1);
      cx.fillRect(2, 13, 2, 3);
      cx.fillRect(12, 13, 2, 3);
      bloodSplat(404);
      break;
    }
    case 'board': {
      cx.fillStyle = P.boardFr;
      cx.fillRect(0, 0, TILE, TILE);
      cx.fillStyle = P.board;

      cx.fillRect(0, 0, TILE, TILE);

      cx.fillRect(2, 1, 12, 15);
      cx.fillStyle = P.wallDk;

      cx.fillRect(0, 0, TILE, TILE);

      cx.fillRect(2, 3, 1, 2);
      cx.fillRect(8, 6, 1, 2);
      cx.fillRect(12, 11, 1, 2);

      bloodSplat(707);

      cx.fillStyle = P.tree;
      cx.fillRect(2, 0, 12, 11);
      cx.fillRect(1, 2, 14, 7);
      cx.fillStyle = P.trunk;
      cx.fillRect(7, 11, 2, 5);
      bloodSplat(808);
      break;
    }
    case 'bench': {
      cx.fillStyle = P.grass;
      cx.fillRect(0, 0, TILE, TILE);
      cx.fillStyle = P.bench;
      cx.fillRect(1, 6, 14, 4);

    case 'window': {
      cx.fillStyle = P.wall;
      cx.fillRect(0, 0, TILE, TILE);
      cx.fillStyle = P.sky;
      cx.fillRect(2, 2, 12, 12);
      cx.fillStyle = P.wallDk;
      cx.fillRect(7, 2, 2, 12);
      cx.fillRect(2, 7, 12, 2);
      bloodSplat(1010);

    }
    case 'exit': {
      // Marca visual de salida
      cx.fillStyle = P.floor;
      cx.fillRect(0, 0, TILE, TILE);
      cx.fillStyle = horror >= HORROR.BROKEN ? BLOOD_RED : '#fff';
      cx.fillRect(2, 7, 4, 2);
      cx.fillRect(10, 7, 4, 2);
      cx.fillRect(7, 2, 2, 4);
      cx.fillRect(7, 10, 2, 4);
      break;
    }
    case 'water': {
      // Charco de "algo" en el suelo (acto 3+)
      cx.fillStyle = P.floor;
      cx.fillRect(0, 0, TILE, TILE);
      cx.fillStyle = horror >= HORROR.BROKEN ? BLOOD_RED : '#3070a0';
      cx.fillRect(3, 5, 10, 6);
      cx.fillStyle = horror >= HORROR.BROKEN ? BLOOD_DK : '#1a4070';
      cx.fillRect(3, 5, 10, 1);
      cx.fillRect(3, 10, 10, 1);
      cx.fillRect(2, 6, 1, 4);
      cx.fillRect(13, 6, 1, 4);
      break;
    }
    default: {
      cx.fillStyle = '#f0f';
      cx.fillRect(0, 0, TILE, TILE);
    }
  }
}

// Tile -> sólido (bloquea movimiento)
function isSolid(ch){
  return ch === '#' || ch === 'L' || ch === 'D' || ch === 'B' ||
         ch === 'T' || ch === 'N' || ch === 'W';
}
// Tile -> es salida (no sólido pero dispara transición)
function isExitMark(ch){ return ch === 'O'; }
// Tile -> renderiza decoración con offset (ej. mesa más grande)
function tileTypeFor(ch){
  switch(ch){
    case '#': return 'wall';
    case 'L': return 'locker';
    case 'D': return 'desk';
    case 'B': return 'board';
    case 'O': return 'door';
    case 'T': return 'tree';
    case 'N': return 'bench';
    case 'W': return 'window';
    case 'g': return 'grass';
    case 'w': return 'water';
    case 'X': return 'exit';
    default:  return 'floor';
  }
}

/* ==========================================================================
   9. ENTIDADES (Player, NPC)
   ========================================================================== */

class Entity {
  constructor(x, y, sprite, palette, name){
    this.x = x; this.y = y;             // posición en píxeles
    this.w = 16; this.h = 16;
    this.sprite = sprite;               // SP_BODY_DOWN, SP_BODY_SIDE...
    this.palette = palette;
    this.name = name || '';
    this.dir = 'down';                  // down/up/left/right
    this.moving = false;
    this.bobTimer = 0;
  }
  get cx(){ return this.x + this.w/2; }
  get cy(){ return this.y + this.h/2; }
  rect(){ return { x:this.x + 2, y:this.y + 8, w:this.w - 4, h:this.h - 8 }; }
  render(ctx, time){
    let sp, flip = false;
    if(this.dir === 'up')         sp = (this.spUp || SP_BODY_UP);
    else if(this.dir === 'left')  { sp = (this.spSide || SP_BODY_SIDE); flip = true; }
    else if(this.dir === 'right') sp = (this.spSide || SP_BODY_SIDE);
    else                          sp = (this.spDown || SP_BODY_DOWN);
    const cv = getSprite(sp, this.palette, flip);
    // pequeño bob al caminar
    let bob = 0;
    if(this.moving) bob = Math.floor(time * 0.012) % 2 === 0 ? 0 : -1;
    ctx.drawImage(cv, Math.round(this.x), Math.round(this.y) + bob);
  }
}

class Player extends Entity {
  constructor(x, y){
    super(x, y, SP_BODY_DOWN, PAL_MATEO, 'Mateo');
    this.spDown = SP_BODY_DOWN;
    this.spUp   = SP_BODY_UP;
    this.spSide = SP_BODY_SIDE;
    this.speed = 70;       // px/seg
    this.stepTimer = 0;
  }
  update(dt, game){
    let dx = 0, dy = 0;
    if(Input.up)    dy -= 1;
    if(Input.down)  dy += 1;
    if(Input.left)  dx -= 1;
    if(Input.right) dx += 1;
    // diagonal normalizada
    if(dx && dy){ dx *= 0.7071; dy *= 0.7071; }
    this.moving = (dx !== 0 || dy !== 0);
    if(dy < 0) this.dir = 'up';
    else if(dy > 0) this.dir = 'down';
    else if(dx < 0) this.dir = 'left';
    else if(dx > 0) this.dir = 'right';

    const nx = this.x + dx * this.speed * dt;
    const ny = this.y + dy * this.speed * dt;

    // Resolver colisión por ejes con el mapa
    if(!game.collidesAt(nx, this.y, this.rectOff())) this.x = nx;
    if(!game.collidesAt(this.x, ny, this.rectOff())) this.y = ny;

    // Pasos
    if(this.moving){
      this.stepTimer += dt;
      if(this.stepTimer > 0.28){ this.stepTimer = 0; Audio.step(); }
    } else this.stepTimer = 0;

    // Mantener dentro del canvas (zona jugable)
    if(this.x < 0) this.x = 0;
    if(this.y < 0) this.y = 0;
    if(this.x + this.w > COLS * TILE) this.x = COLS * TILE - this.w;
    if(this.y + this.h > ROWS * TILE) this.y = ROWS * TILE - this.h;
  }
  rectOff(){
    return { ox:2, oy:8, w:this.w - 4, h:this.h - 8 };
  }
}

class NPC extends Entity {
  constructor(x, y, palette, dialogId, name, sprite){
    const sp = sprite || SP_BODY_DOWN;
    super(x, y, sp, palette, name);
    this.spDown = sp;
    this.spUp   = sp === SP_BODY_DOWN ? SP_BODY_UP : sp;
    this.spSide = sp === SP_BODY_DOWN ? SP_BODY_SIDE : sp;
    this.dialogId = dialogId;       // clave en DIALOGS
    this.dir = 'down';
    this.wander = false;            // no patrulla por ahora
    this.bobOffset = Math.random() * Math.PI * 2;
  }
  update(dt, game){
    this.bobOffset += dt;
  }
  render(ctx, time){
    super.render(ctx, time);
    // En horror, parpadea ligeramente
    if(game.horror >= HORROR.UNEASY && Math.random() < 0.005){
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(this.x, this.y, 16, 16);
    }
  }
}


/* ==========================================================================
   10. SISTEMA DE DIÁLOGO
   ========================================================================== */
const DialogBox = {
  active:false,
  lines:[], idx:0,
  shown:'', target:'',
  charT:0, charSpd:0.025,    // segundos por carácter
  speakerName:'',
  done:false,
  callbackOnEnd:null,
  glitch:false,

  start(npcId, actNum, onEnd){
    const block = DIALOGS[npcId] && DIALOGS[npcId][actNum];
    if(!block){ if(onEnd) onEnd(); return; }
    this.active = true;
    this.lines = block.slice();
    this.idx = 0;
    this.callbackOnEnd = onEnd || null;
    this._setLine(this.lines[0]);
  },

  _setLine(line){
    this.glitch = false;
    if(line.startsWith('!')){
      // formato: !event|texto (texto puede estar vacío)
      const sep = line.indexOf('|');
      const ev = line.slice(1, sep);
      const txt = line.slice(sep + 1);
      // Disparar evento (game lo intercepta)
      Game.fireEvent(ev);
      if(!txt){ this._next(); return; }
      this.target = txt;
      if(ev === 'glitch' || ev === 'scare') this.glitch = true;
    } else {
      this.target = line;
    }
    this.shown = '';
    this.charT = 0;
    this.done = false;
  },

  update(dt){
    if(!this.active) return;
    if(this.done) return;
    this.charT += dt;
    while(this.charT >= this.charSpd && this.shown.length < this.target.length){
      this.shown += this.target.charAt(this.shown.length);
      this.charT -= this.charSpd;
      if(Math.random() < 0.4) Audio.blip();
    }
    if(this.shown.length >= this.target.length) this.done = true;

    if(Input.actionPressed){
      if(!this.done){
        this.shown = this.target; this.done = true;
      } else {
        this._next();
      }
    }
  },

  _next(){
    this.idx++;
    if(this.idx >= this.lines.length){
      this.active = false;
      if(this.callbackOnEnd){ const cb = this.callbackOnEnd; this.callbackOnEnd = null; cb(); }
      return;
    }
    this._setLine(this.lines[this.idx]);
  },

  render(ctx, P){
    if(!this.active) return;
    const x = 4, y = HUD_Y + 2, w = W - 8, h = HUD_H - 4;
    // marco
    ctx.fillStyle = 'rgba(0,0,0,0.92)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = this.glitch ? '#a00000' : P.text;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

    // Texto
    ctx.fillStyle = this.glitch ? '#ff4040' : '#fff';
    ctx.font = '10px "Courier New", monospace';
    ctx.textBaseline = 'top';
    let txt = this.shown;
    if(this.glitch){
      // Reemplazar caracteres aleatorios por glitch
      let g = '';
      for(let i = 0; i < txt.length; i++){
        if(Math.random() < 0.06) g += String.fromCharCode(33 + Math.floor(Math.random() * 90));
        else g += txt.charAt(i);
      }
      txt = g;
    }
    // Wrap simple
    const maxChars = Math.floor((w - 12) / 6);
    const wrapped = wrapText(txt, maxChars);
    for(let i = 0; i < wrapped.length && i < 3; i++){
      ctx.fillText(wrapped[i], x + 6, y + 6 + i * 12);
    }

    // indicador "siguiente"
    if(this.done){
      const blink = (Math.floor(performance.now() / 300) % 2) === 0;
      if(blink){
        ctx.fillStyle = '#fff';
        ctx.fillText('>', x + w - 10, y + h - 12);
      }
    }
  },
};

function wrapText(text, maxChars){
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for(const w of words){
    if((cur + ' ' + w).trim().length > maxChars){
      if(cur) lines.push(cur);
      cur = w;
    } else {
      cur = cur ? cur + ' ' + w : w;
    }
  }
  if(cur) lines.push(cur);
  return lines;
}

  introTimer:0,
  endingType:null,
  endTimer:0,
  scareTimer:0,         // efecto de "scare" (chasco visual)
  glitchTimer:0,        // efecto de glitch general
  shakeT:0, shakeAmp:0,

  init(){
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    Input.init();
    this.player = new Player(2 * TILE, 7 * TILE);
    this.flags = { metPablo:false, metSofia:false, metRossyClass:false,
                   metRossyYard:false, sawShadow:false, finalReached:false };
    this.screen = SCREEN.TITLE;
  },

  /* ---- Construcción de NPCs por escena+acto ---- */
  spawnNPCs(){
    this.npcs = [];
    const id = this.sceneId, act = this.act;

    if(id === 'hallway'){
      if(act === 1){
        this.npcs.push(new NPC(7  * TILE, 6 * TILE,  PAL_PABLO, 'pablo', 'Pablo'));
        this.npcs.push(new NPC(15 * TILE, 6 * TILE,  PAL_SOFIA, 'sofia', 'Sofía'));
        this.npcs.push(new NPC(22 * TILE, 7 * TILE,  PAL_DIEGO, 'diego', 'Diego'));
      } else if(act === 2){
        this.npcs.push(new NPC(7  * TILE, 6 * TILE,  PAL_PABLO, 'pablo', 'Pablo'));
        this.npcs.push(new NPC(15 * TILE, 6 * TILE,  PAL_SOFIA, 'sofia', 'Sofía'));
        // sombra parpadeante
        const sh = new NPC(25 * TILE, 4 * TILE, PAL_SHADOW, 'shadow', '???', SP_SHADOW);
        sh.spDown = sh.spUp = sh.spSide = SP_SHADOW;
        this.npcs.push(sh);
      }
    } else if(id === 'classroom'){
      if(act === 1){
        // Profesor en la pizarra
        const prof = new NPC(14 * TILE, 3 * TILE, PAL_PROF, 'prof', 'Prof. Ramírez', SP_PROF);
        prof.spDown = SP_PROF; prof.spUp = SP_PROF; prof.spSide = SP_PROF;
        this.npcs.push(prof);
        // Rossy en su asiento
        const rossy = new NPC(10 * TILE, 7 * TILE, PAL_ROSSY, 'rossy_class', 'Rossy', SP_ROSSY_DOWN);
        rossy.spDown = SP_ROSSY_DOWN;
        rossy.spUp = SP_BODY_UP;
        rossy.spSide = SP_ROSSY_SIDE;
        this.npcs.push(rossy);
      }
    } else if(id === 'courtyard'){
      if(act === 2){
        const rossy = new NPC(14 * TILE, 6 * TILE, PAL_ROSSY, 'rossy_yard', 'Rossy', SP_ROSSY_DOWN);
        rossy.spDown = SP_ROSSY_DOWN;
        rossy.spUp = SP_BODY_UP;
        rossy.spSide = SP_ROSSY_SIDE;
        this.npcs.push(rossy);
        // Diego al fondo, no interactuable hasta que se dispare 'cut_diego'
        const diego = new NPC(22 * TILE, 4 * TILE, PAL_DIEGO, 'diego', 'Diego');
        this.npcs.push(diego);
      }
    } else if(id === 'hallway_broken'){
      if(act === 3){
        // Profesor monstruoso bloqueando casi
        const prof = new NPC(15 * TILE, 6 * TILE, PAL_PROF_M, 'prof', 'Prof. Ramírez', SP_PROF_MON);
        prof.spDown = SP_PROF_MON; prof.spUp = SP_PROF_MON; prof.spSide = SP_PROF_MON;
        this.npcs.push(prof);
        // Pablo sentado, deformado
        const pablo = new NPC(7 * TILE, 7 * TILE, PAL_PABLO, 'pablo_broken', 'Pablo');
        this.npcs.push(pablo);
        // Sombra
        const sh = new NPC(22 * TILE, 4 * TILE, PAL_SHADOW, 'shadow', '???', SP_SHADOW);
        sh.spDown = sh.spUp = sh.spSide = SP_SHADOW;
        this.npcs.push(sh);
      }
    } else if(id === 'final_room'){
      if(act === 4){
        const rossy = new NPC(14 * TILE, 5 * TILE, PAL_ROSSY, 'rossy_final', 'Rossy', SP_ROSSY_DOWN);
        rossy.spDown = SP_ROSSY_DOWN;
        rossy.spUp = SP_BODY_UP;
        rossy.spSide = SP_ROSSY_SIDE;
        this.npcs.push(rossy);
      }
    }
  },

  /* ---- Cambio de escena con fundido ---- */
  goToScene(id, sx, sy){
    this.pendingScene = id;
    this.pendingSpawn = { x: sx * TILE, y: sy * TILE };
    this.screen = SCREEN.TRANS;
    this.transTimer = 0;
  },

  _applyScene(){
    this.sceneId = this.pendingScene;
    this.scene = SCENES[this.sceneId];
    this.player.x = this.pendingSpawn.x;
    this.player.y = this.pendingSpawn.y;
    this.player.dir = 'up';
    this.spawnNPCs();
    Audio.open();
  },

  /* ---- Avanzar a un nuevo acto ---- */
  advanceAct(newAct){
    this.act = newAct;
    if(newAct === 1) this.horror = HORROR.NORMAL;
    else if(newAct === 2) this.horror = HORROR.UNEASY;
    else if(newAct === 3) this.horror = HORROR.BROKEN;
    else if(newAct === 4) this.horror = HORROR.FINAL;
    // Limpiar caché de tiles para forzar redibujado con paleta nueva
    TILE_CACHE.clear();
    this.glitchTimer = 0.8;
    Audio.glitch();
  },

  /* ---- Eventos disparados por el sistema de diálogo ---- */
  fireEvent(ev){
    switch(ev){
      case 'flag_rossy_meet':
        // Tras hablar con Rossy en el aula (acto 1), avanzar a acto 2
        this.flags.metRossyClass = true;
        // Programar avance al volver a moverse
        setTimeout(() => {
          this.advanceAct(2);
          // Volver al pasillo, no a la clase
          this.goToScene('hallway', 6, 11);
        }, 100);
        break;
      case 'cut_diego':
        // Mostrar a Diego acercándose / sangre apareciendo
        this.shake(2, 0.4);
        this.glitchTimer = 0.6;
        Audio.scare();
        break;
      case 'flag_yard_done':
        // Al final del diálogo del patio, saltar a acto 3
        this.flags.metRossyYard = true;
        setTimeout(() => {
          this.advanceAct(3);
          this.goToScene('hallway_broken', 2, 7);
        }, 100);
        break;
      case 'glitch':
        this.glitchTimer = 0.6;
        Audio.glitch();
        break;
      case 'scare':
        this.shake(3, 0.5);
        this.glitchTimer = 0.7;
        Audio.scare();
        break;
      case 'reveal':
        this.shake(1.5, 0.7);
        Audio.scare();
        break;
      case 'ending':
        // Final
        this.endingType = 'reunion';
        this.screen = SCREEN.END;
        this.endTimer = 0;
        break;
    }
  },

  shake(amp, dur){ this.shakeAmp = amp; this.shakeT = dur; },

  /* ---- Colisión con mapa (rect del player relativo) ---- */
  collidesAt(px, py, off){
    const r = { x:px + off.ox, y:py + off.oy, w:off.w, h:off.h };
    const m = this.scene.map;
    const x0 = Math.floor(r.x / TILE);
    const y0 = Math.floor(r.y / TILE);
    const x1 = Math.floor((r.x + r.w - 1) / TILE);
    const y1 = Math.floor((r.y + r.h - 1) / TILE);
    for(let ty = y0; ty <= y1; ty++){
      if(ty < 0 || ty >= ROWS) return true;
      const row = m[ty];
      for(let tx = x0; tx <= x1; tx++){
        if(tx < 0 || tx >= COLS) return true;
        if(isSolid(row.charAt(tx))) return true;
      }
    }
    // Colisión con NPCs (bloqueo suave, los traspasas si te pegas: para evitar lock,
    // permitimos overlap pero no caminar a través centrado)
    for(const n of this.npcs){
      const nr = { x:n.x + 2, y:n.y + 8, w:12, h:8 };
      if(r.x < nr.x + nr.w && r.x + r.w > nr.x && r.y < nr.y + nr.h && r.y + r.h > nr.y) return true;
    }
    return false;
  },

  /* ---- Comprobar interacción ---- */
  tryInteract(){
    // 1. Salidas: ¿pisamos un tile 'O' (door)?
    const px = this.player.cx, py = this.player.cy;
    const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
    for(const ex of (this.scene.exits || [])){
      if(Math.abs(ex.tx - tx) <= 1 && Math.abs(ex.ty - ty) <= 1){
        this.goToScene(ex.to, ex.sx, ex.sy);
        return true;
      }
    }
    // 2. NPC delante del jugador
    const dirOff = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] }[this.player.dir];
    const tx2 = Math.floor((px + dirOff[0] * 14) / TILE);
    const ty2 = Math.floor((py + dirOff[1] * 14) / TILE);
    for(const n of this.npcs){
      const nx = Math.floor(n.cx / TILE), ny = Math.floor(n.cy / TILE);
      const dist = Math.abs(nx - tx) + Math.abs(ny - ty);
      if(dist <= 1 || (nx === tx2 && ny === ty2)){
        // Hacerlo mirar al jugador
        if(this.player.x < n.x) n.dir = 'left';
        else if(this.player.x > n.x) n.dir = 'right';
        else if(this.player.y < n.y) n.dir = 'up';
        else n.dir = 'down';
        this.startDialog(n.dialogId);
        return true;
      }
    }
    return false;
  },

  startDialog(npcId){
    Audio.ok();
    this.screen = SCREEN.DIALOG;
    DialogBox.start(npcId, this.act, () => {
      // Solo restauramos a PLAY si el evento del diálogo no
      // ha cambiado ya la pantalla (p.ej. !ending va a SCREEN.END,
      // o flag_* dispara una transición). Sin esta guarda, el
      // final del juego se sobreescribe inmediatamente.
      if(this.screen === SCREEN.DIALOG) this.screen = SCREEN.PLAY;
    });
  },

  /* ---- Lógica de progresión (avanzar acto cuando corresponde) ---- */
  checkProgression(){
    // Si en el aula (acto 1) hablaste con Rossy y volviste al pasillo,
    // ya está marcado el flag. Eso lo gestiona fireEvent('flag_rossy_meet').
    // Nada que hacer aquí.
  },

  /* ---- Bucle de update general ---- */
  update(dt){
    this.time += dt * 1000;
    Input.poll();
    if(this.glitchTimer > 0) this.glitchTimer -= dt;
    if(this.shakeT > 0) this.shakeT -= dt;
    if(this.scareTimer > 0) this.scareTimer -= dt;

    if(this.screen === SCREEN.TITLE){
      if(Input.actionPressed){ this.startIntro(); }
      return;
    }
    if(this.screen === SCREEN.INTRO){
      this.introTimer += dt;
      if(Input.actionPressed && this.introTimer > 0.3){
        this.introIdx++;
        this.introTimer = 0;
        if(this.introIdx >= this.introLines.length){
          this.beginGame();
        }
      }
      return;
    }
    if(this.screen === SCREEN.TRANS){
      this.transTimer += dt;
      if(this.transTimer >= this.transDur / 2 && this.pendingScene){
        this._applyScene();
        this.pendingScene = null; this.pendingSpawn = null;
      }
      if(this.transTimer >= this.transDur){
        this.screen = SCREEN.PLAY;
      }
      return;
    }
    if(this.screen === SCREEN.DIALOG){
      DialogBox.update(dt);
      return;
    }
    if(this.screen === SCREEN.END){
      this.endTimer += dt;
      if(Input.actionPressed && this.endTimer > 2.5){
        // Reiniciar
        location.reload();
      }
      return;
    }

    // SCREEN.PLAY
    this.player.update(dt, this);
    for(const n of this.npcs) n.update(dt, this);

    if(Input.actionPressed){ this.tryInteract(); }
  },

  /* ---- Render ---- */
  render(){
    const ctx = this.ctx;
    if(this.screen === SCREEN.TITLE){ this.renderTitle(ctx); return; }
    if(this.screen === SCREEN.INTRO){ this.renderIntro(ctx); return; }
    if(this.screen === SCREEN.END){   this.renderEnd(ctx);   return; }

    // Render world
    const P = WORLD_PAL[this.horror];
    ctx.fillStyle = P.bg;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    // Shake
    if(this.shakeT > 0){
      const a = this.shakeAmp;
      ctx.translate(Math.round((Math.random() * 2 - 1) * a), Math.round((Math.random() * 2 - 1) * a));
    }

    // Tiles (suelo + decoración)
    const m = this.scene.map;
    for(let ty = 0; ty < ROWS; ty++){
      const row = m[ty];
      for(let tx = 0; tx < COLS; tx++){
        const ch = row.charAt(tx);
        // primer pase: suelo / hierba siempre
        const baseType = (this.sceneId === 'courtyard' || this.sceneId === 'final_room' && false) ? 'grass' : 'floor';
        // En patio: hierba como base. En el resto: suelo.
        const grassScene = this.sceneId === 'courtyard';
        const baseTile = grassScene && ch !== '#' && ch !== 'W' ? 'grass' : 'floor';
        if(ch !== '#' && ch !== 'W'){
          ctx.drawImage(getTile(baseTile, this.horror), tx * TILE, ty * TILE);
        }
        const t = tileTypeFor(ch);
        if(t === 'floor' || t === 'grass') continue; // ya pintado
        ctx.drawImage(getTile(t, this.horror), tx * TILE, ty * TILE);
      }
    }

    // En horror, manchas extra y "caras" en pared
    if(this.horror >= HORROR.BROKEN){
      this.renderHorrorOverlay(ctx);
    }

    // Entidades (orden por Y para profundidad)
    const ents = [this.player, ...this.npcs];
    ents.sort((a, b) => (a.y + a.h) - (b.y + b.h));
    for(const e of ents) e.render(ctx, this.time);

    ctx.restore();

    // HUD
    this.renderHUD(ctx, P);

    // Dialog
    if(this.screen === SCREEN.DIALOG) DialogBox.render(ctx, P);

    // Glitch global
    if(this.glitchTimer > 0) this.renderGlitch(ctx);

    // Transición (fundido a negro)
    if(this.screen === SCREEN.TRANS){
      const t = this.transTimer / this.transDur;
      const a = t < 0.5 ? t * 2 : (1 - t) * 2;
      ctx.fillStyle = 'rgba(0,0,0,' + a + ')';
      ctx.fillRect(0, 0, W, H);
    }

    // Vignette en horror
    if(this.horror >= HORROR.UNEASY) this.renderVignette(ctx);
  },

  renderHorrorOverlay(ctx){
    // "Caras" en las paredes en posiciones fijas
    const P = WORLD_PAL[this.horror];
    const positions = [
      [3, 1], [12, 1], [22, 1],
      [5, 12], [18, 12], [27, 12],
    ];
    const sp = getSprite(SP_FACE_WALL, ['#000','#1a0000','#2a0000','#000','#000','#000']);
    // parpadea
    if(Math.floor(this.time / 600) % 3 === 0){
      for(const [tx, ty] of positions){
        if(this.scene.map[ty] && (this.scene.map[ty].charAt(tx) === '#' || this.scene.map[ty].charAt(tx) === 'W')){
          ctx.drawImage(sp, tx * TILE, ty * TILE);
        }
      }
    }
  },

  renderVignette(ctx){
    const grad = ctx.createRadialGradient(W/2, H/2, W * 0.25, W/2, H/2, W * 0.7);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    const a = this.horror === HORROR.UNEASY ? 0.35 : (this.horror === HORROR.BROKEN ? 0.55 : 0.75);
    grad.addColorStop(1, 'rgba(0,0,0,' + a + ')');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  },

  renderGlitch(ctx){
    // Líneas horizontales aleatorias rojas y desplazamiento
    const lines = 6;
    for(let i = 0; i < lines; i++){
      const y = Math.floor(Math.random() * HUD_Y);
      const h = 1 + Math.floor(Math.random() * 3);
      const dx = Math.floor(Math.random() * 12) - 6;
      // Capturar slice y redibujar desplazado
      try {
        const img = ctx.getImageData(0, y, W, h);
        ctx.putImageData(img, dx, y);
      } catch(e){}
      if(Math.random() < 0.4){
        ctx.fillStyle = 'rgba(160,0,0,' + (Math.random() * 0.5) + ')';
        ctx.fillRect(0, y, W, h);
      }
    }
  },

  renderHUD(ctx, P){
    // Barra superior con título de la escena
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, 12);
    ctx.fillStyle = P.text;
    ctx.font = '8px "Courier New", monospace';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    let title = this.scene.title;
    if(this.horror >= HORROR.BROKEN) title = corrupt(title);
    ctx.fillText(title, 4, 2);
    ctx.textAlign = 'right';
    const actLabel = ['','I — La carta','II — El recreo','III — Lo que se rompió','IV — La confesión'][this.act] || '';
    ctx.fillText(actLabel, W - 4, 2);
  },

  /* ---- Title ---- */
  renderTitle(ctx){
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Fondo: silueta de colegio
    ctx.fillStyle = '#0a0a18';
    ctx.fillRect(0, H - 100, W, 100);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(60, H - 130, 360, 30);
    // ventanas amarillas
    ctx.fillStyle = '#a08020';
    for(let i = 0; i < 8; i++){
      ctx.fillRect(80 + i * 40, H - 122, 8, 6);
    }
    // luna roja
    ctx.fillStyle = '#a01818';
    ctx.beginPath();
    ctx.arc(W - 80, 50, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(W - 70, 45, 20, 0, Math.PI * 2);
    ctx.fill();

    // Goteo de sangre
    ctx.fillStyle = '#a01818';
    for(let i = 0; i < 12; i++){
      const x = 20 + i * 38;
      const len = 8 + ((i * 7919) % 16);
      ctx.fillRect(x, 0, 2, len);
      ctx.fillRect(x - 1, len - 2, 4, 2);
    }

    // Título
    ctx.font = 'bold 28px "Courier New", monospace';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('LA CONFESIÓN', W/2, 80);
    ctx.fillStyle = '#a01818';
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillText('— mateo y rossy —', W/2, 100);

    // Press to start
    if(Math.floor(performance.now() / 600) % 2 === 0){
      ctx.fillStyle = '#fff';
      ctx.font = '10px "Courier New", monospace';
      ctx.fillText('PULSA ESPACIO O TOCA PARA EMPEZAR', W/2, H - 20);
    }
  },

  startIntro(){
    Audio.init();
    Audio.ok();
    this.screen = SCREEN.INTRO;
    this.introIdx = 0;
    this.introTimer = 0;
    this.introLines = [
      'Colegio San Esteban. 8:00 AM.',
      'Llevo seis meses queriendo decírselo.',
      'Hoy. Tiene que ser hoy.',
      'Mi nombre es Mateo.',
      'Y ella se llama Rossy.',
      '',
      'Algo no encaja en este colegio.',
      'Pero no recuerdo qué.',
      '',
      '— pulsa para empezar —',
    ];
  },

  renderIntro(ctx){
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.font = '11px "Courier New", monospace';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for(let i = 0; i <= this.introIdx && i < this.introLines.length; i++){
      const a = i === this.introIdx ? Math.min(1, this.introTimer * 1.6) : 1;
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fillText(this.introLines[i], W/2, 60 + i * 18);
    }
    if(this.introIdx >= this.introLines.length - 1 && this.introTimer > 0.6){
      if(Math.floor(performance.now() / 500) % 2 === 0){
        ctx.fillStyle = '#a8a8a8';
        ctx.fillText('▼', W/2, H - 28);
      }
    }
  },

  beginGame(){
    this.screen = SCREEN.PLAY;
    this.act = 1;
    this.horror = HORROR.NORMAL;
    this.sceneId = 'hallway';
    this.scene = SCENES.hallway;
    this.player.x = SCENES.hallway.spawn.x * TILE;
    this.player.y = SCENES.hallway.spawn.y * TILE;
    this.player.dir = 'right';
    this.spawnNPCs();
    Audio.open();
  },

  renderEnd(ctx){
    this.endTimer += 0;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Goteo de sangre desde arriba
    ctx.fillStyle = '#a01818';
    for(let i = 0; i < 16; i++){
      const x = 12 + i * 28;
      const len = 20 + ((i * 7919) % 60);
      ctx.fillRect(x, 0, 2, len);
      ctx.fillRect(x - 1, len - 2, 4, 2);
    }

    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lines = [
      'Tres años atrás, en este mismo recreo,',
      'Diego empujó a Rossy.',
      'Mateo agarró una piedra.',
      'Y nunca, nunca llegó a confesarse.',
      '',
      'Pero el colegio recuerda.',
      'El colegio guarda.',
      'Y ella lo esperó.',
      '',
      '— FIN —',
    ];
    for(let i = 0; i < lines.length; i++){
      const t = this.endTimer - i * 0.5;
      const a = Math.min(1, Math.max(0, t * 1.2));
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      if(i === lines.length - 1) ctx.fillStyle = `rgba(255,80,80,${a})`;
      ctx.fillText(lines[i], W/2, 50 + i * 18);
    }
    if(this.endTimer > 2.5 && Math.floor(performance.now() / 600) % 2 === 0){
      ctx.fillStyle = '#888';
      ctx.font = '9px "Courier New", monospace';
      ctx.fillText('pulsa para volver al inicio', W/2, H - 16);
    }
  },
};

function corrupt(s){
  let r = '';
  for(let i = 0; i < s.length; i++){
    if(Math.random() < 0.07) r += String.fromCharCode(33 + Math.floor(Math.random() * 90));
    else r += s.charAt(i);
  }
  return r;
}


/* ==========================================================================
   12. BUCLE PRINCIPAL
   ========================================================================== */
let lastT = 0;
function loop(t){
  if(!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if(dt > 0.05) dt = 0.05;
  Game.update(dt);
  Game.render();
  requestAnimationFrame(loop);
}

Game.init();
requestAnimationFrame(loop);

</script>
