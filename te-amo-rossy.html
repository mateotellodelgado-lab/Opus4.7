<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0014">
<title>Para ti, Rossysita ♥</title>
<style>
  /* ================================================================
     RESET + BASE
     ================================================================ */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#000;color:#fff;
    font-family:'Georgia','Times New Roman',serif;
    user-select:none;-webkit-user-select:none;
    cursor:default;
  }

  /* ================================================================
     CANVAS DE FONDO
     ================================================================ */
  #stage{
    position:fixed;inset:0;
    width:100%;height:100%;
    display:block;
  }

  /* ================================================================
     CAPA DE TEXTO (DOM, GPU-accelerated)
     ================================================================ */
  #ui{
    position:fixed;inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:10;
  }

  .line{
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    width:92%;max-width:920px;
    opacity:0;
    will-change:opacity,transform,filter;
    transition:opacity 1.4s ease, transform 1.6s ease, filter 1.4s ease;
    text-shadow:
      0 0 14px rgba(255,180,220,.8),
      0 0 28px rgba(255,120,180,.5),
      0 0 56px rgba(200,80,160,.3);
  }
  .line.show{opacity:1}
  .line.in{filter:blur(0)}
  .line.out{filter:blur(10px);opacity:0}

  /* tamaños */
  .small{font-size:clamp(15px,2.3vw,24px);font-style:italic;color:#ffd6ec;letter-spacing:.08em;line-height:1.6}
  .med  {font-size:clamp(20px,3.4vw,38px);font-style:italic;color:#ffe4f1;line-height:1.5}
  .big  {
    font-size:clamp(40px,8vw,110px);font-weight:bold;
    font-family:'Brush Script MT','Lucida Handwriting',cursive;
    background:linear-gradient(45deg,#ff9ec7 0%,#ffc8e8 25%,#fff5fa 50%,#ffc8e8 75%,#ff9ec7 100%);
    background-size:200% 200%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:shine 4s ease-in-out infinite;
    filter:drop-shadow(0 0 30px rgba(255,150,200,.9))
           drop-shadow(0 0 60px rgba(255,100,180,.6));
  }
  @keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

  /* corazón pulsante */
  .heart{
    display:inline-block;color:#ff5599;
    animation:beat 1.1s ease-in-out infinite;
    text-shadow:0 0 20px #ff77aa,0 0 40px #ff5599;
  }
  @keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.18)}40%{transform:scale(1)}60%{transform:scale(1.12)}80%{transform:scale(1)}}

  /* tono cálido / awkward */
  .warm{
    color:#ffd6a8 !important;
    text-shadow:0 0 12px rgba(255,200,140,.7),0 0 28px rgba(255,160,90,.4) !important;
  }
  .wobble{display:inline-block;animation:wobble 2.2s ease-in-out infinite}
  @keyframes wobble{
    0%,100%{transform:translate(0,0) rotate(0)}
    25%{transform:translate(2px,-1px) rotate(.6deg)}
    50%{transform:translate(-1px,1px) rotate(-.5deg)}
    75%{transform:translate(1px,-1px) rotate(.4deg)}
  }

  /* tono tímido */
  .shy{color:#cdb6ff !important;letter-spacing:.18em !important}

  /* posiciones alternativas */
  .pos-up   {transform:translate(-50%,-150%) !important}
  .pos-down {transform:translate(-50%, 50%)  !important}

  /* ===== Frase final "Muuuakk" ===== */
  .muak-text{
    font-size:clamp(60px,13vw,180px);
    font-family:'Brush Script MT','Lucida Handwriting',cursive;
    font-weight:bold;
    background:linear-gradient(45deg,#ff5e8a 0%,#ff9ec7 30%,#ffd6ec 50%,#ff9ec7 70%,#ff5e8a 100%);
    background-size:220% 220%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:shine 3s ease-in-out infinite, kissPulse 1.4s ease-in-out infinite;
    filter:drop-shadow(0 0 36px rgba(255,120,170,.95))
           drop-shadow(0 0 72px rgba(255,80,160,.6));
    transform-origin:center;
  }
  @keyframes kissPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.05)}
  }

  /* ===== Cumplido orbitando la galaxia ===== */
  .compliment{
    position:absolute;left:50%;top:50%;
    font-size:clamp(13px,1.8vw,20px);
    font-style:italic;color:#fff;white-space:nowrap;
    opacity:0;transform:translate(-50%,-50%);
    will-change:opacity,transform;
    transition:opacity 1.6s ease;
    text-shadow:0 0 8px rgba(255,200,230,.9),0 0 18px rgba(255,120,200,.6),0 0 36px rgba(180,80,200,.4);
    letter-spacing:.04em;
  }
  .compliment.show{opacity:.95}

  /* ===== Pantalla inicial ===== */
  #starter{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,#1a0033 0%,#000 80%);
    z-index:100;cursor:pointer;
    transition:opacity 1s ease;
  }
  #starter.gone{opacity:0;pointer-events:none}
  #starter .pulse{text-align:center;animation:breathe 2.4s ease-in-out infinite}
  #starter h1{
    font-family:'Brush Script MT','Lucida Handwriting',cursive;
    font-size:clamp(36px,7vw,80px);
    background:linear-gradient(45deg,#ff9ec7,#ffc8e8,#ff9ec7);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:20px;
    filter:drop-shadow(0 0 20px rgba(255,150,200,.7));
  }
  #starter p{font-size:clamp(14px,2vw,20px);color:#ffc8e8;font-style:italic;letter-spacing:.1em}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.05);opacity:1}}
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div id="ui"></div>

<div id="starter">
  <div class="pulse">
    <h1>Para ti, Rossysita</h1>
    <p>— toca o haz clic para comenzar —</p>
  </div>
</div>

<script>
'use strict';

/* ================================================================
   PARA ROSSYSITA — Carta animada en 9 escenas
   ----------------------------------------------------------------
   Una sola página. Sin librerías. Canvas + DOM (texto en CSS para
   GPU). Cada frase tiene su propia escena visual.
   Optimización: DPR clamp, fondo pre-renderizado, partículas con
   pooling, culling por opacidad, galaxia con posiciones normalizadas.
================================================================ */

/* -------- CONFIG -------- */
const CFG = {
  DPR_MAX: 2,
  STARS_BG: 240,
  GALAXY_STARS: 4200,
  GALAXY_ARMS: 4,
  GALAXY_TWIST: 0.46,
  HEARTS_MAX: 80,
  SPARKLES_MAX: 220,
  CONFETTI_MAX: 180,
};

/* -------- CANVAS -------- */
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { alpha: true });
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, CFG.DPR_MAX);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width  = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', () => { resize(); regenStaticLayers(); });

const rand   = (a, b) => a + Math.random() * (b - a);
const lerp   = (a, b, t) => a + (b - a) * t;
const clamp  = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU    = Math.PI * 2;

/* ================================================================
   FONDO ESTRELLADO (pre-renderizado a un canvas)
================================================================ */
const bgCanvas = document.createElement('canvas');
const bgCtx = bgCanvas.getContext('2d');

function makeBackgroundStars(){
  bgCanvas.width = Math.floor(W * DPR);
  bgCanvas.height = Math.floor(H * DPR);
  bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgCtx.clearRect(0, 0, W, H);

  // base oscura
  const base = bgCtx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H));
  base.addColorStop(0, '#10001f');
  base.addColorStop(0.6, '#06000f');
  base.addColorStop(1, '#000');
  bgCtx.fillStyle = base;
  bgCtx.fillRect(0, 0, W, H);

  // nebulosas suaves
  const nebulae = [
    { x: W*.18, y: H*.22, r: Math.max(W,H)*.45, c1:'rgba(140,40,160,0.16)', c2:'rgba(0,0,0,0)' },
    { x: W*.82, y: H*.78, r: Math.max(W,H)*.50, c1:'rgba(60,30,140,0.14)',  c2:'rgba(0,0,0,0)' },
    { x: W*.50, y: H*.50, r: Math.max(W,H)*.55, c1:'rgba(200,80,140,0.10)', c2:'rgba(0,0,0,0)' },
    { x: W*.05, y: H*.95, r: Math.max(W,H)*.35, c1:'rgba(80,180,220,0.08)', c2:'rgba(0,0,0,0)' },
  ];
  for (const n of nebulae){
    const g = bgCtx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    g.addColorStop(0, n.c1); g.addColorStop(1, n.c2);
    bgCtx.fillStyle = g;
    bgCtx.fillRect(0, 0, W, H);
  }

  // estrellas dispersas
  for (let i = 0; i < CFG.STARS_BG; i++){
    const x = Math.random() * W;
    const y = Math.random() * H;
    const r = Math.random() < 0.92 ? rand(0.3, 1.2) : rand(1.4, 2.4);
    const a = rand(0.3, 1);
    bgCtx.fillStyle = `rgba(255,255,255,${a})`;
    bgCtx.beginPath(); bgCtx.arc(x, y, r, 0, TAU); bgCtx.fill();
    if (r > 1.3){
      const g = bgCtx.createRadialGradient(x, y, 0, x, y, r * 4);
      g.addColorStop(0, `rgba(255,220,255,${a*0.5})`);
      g.addColorStop(1, 'rgba(255,220,255,0)');
      bgCtx.fillStyle = g;
      bgCtx.beginPath(); bgCtx.arc(x, y, r * 4, 0, TAU); bgCtx.fill();
    }
  }
}

/* ================================================================
   GALAXIA MEJORADA — espiral logarítmica con dust lanes
================================================================ */
let galaxyStars = [];

function makeGalaxy(){
  galaxyStars = [];
  const arms = CFG.GALAXY_ARMS;
  const twist = CFG.GALAXY_TWIST;
  for (let i = 0; i < CFG.GALAXY_STARS; i++){
    const t = Math.pow(Math.random(), 0.55); // densidad al centro
    const dist = t * 1.0;
    const armIndex = i % arms;
    const baseAngle = (TAU / arms) * armIndex;
    const spiralAngle = baseAngle + dist * twist * TAU;
    const spread = (1 - t) * 0.16 + 0.035;
    const a = spiralAngle + rand(-spread, spread);
    const rJitter = dist + rand(-0.035, 0.035);

    // paleta romántica por temperatura
    let r, g, b;
    if (t < 0.16){            // núcleo cálido
      r = 255; g = rand(225, 248); b = rand(175, 215);
    } else if (t < 0.42){     // anillo rosado
      r = 255; g = rand(180, 220); b = rand(215, 245);
    } else if (t < 0.72){     // medio lila
      r = rand(220, 255); g = rand(160, 210); b = rand(230, 255);
    } else {                  // bordes azul/violeta
      r = rand(150, 215); g = rand(170, 220); b = 255;
    }

    const size = (1 - t) * 1.7 + rand(0.3, 1.0);
    const bright = (1 - t) * 0.5 + rand(0.4, 0.95);

    galaxyStars.push({
      a, r: rJitter, size,
      r8: r|0, g8: g|0, b8: b|0,
      bright,
      twinkleSpeed: rand(1, 3),
      twinklePhase: Math.random() * TAU,
    });
  }
}

function drawGalaxy(t, alpha){
  if (alpha <= 0) return;
  const cx = W / 2, cy = H / 2;
  const radius = Math.min(W, H) * 0.44;
  const rot = t * 0.06;

  // Núcleo brillante
  const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 0.6);
  core.addColorStop(0,    `rgba(255,245,220,${0.62 * alpha})`);
  core.addColorStop(0.12, `rgba(255,210,190,${0.50 * alpha})`);
  core.addColorStop(0.35, `rgba(220,140,200,${0.20 * alpha})`);
  core.addColorStop(1,    'rgba(40,0,60,0)');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(cx, cy, radius * 1.15, 0, TAU); ctx.fill();

  // Polvo cósmico (brazos)
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot * 0.7);
  for (let arm = 0; arm < CFG.GALAXY_ARMS; arm++){
    ctx.save();
    ctx.rotate((TAU / CFG.GALAXY_ARMS) * arm);
    const g = ctx.createLinearGradient(0, 0, radius, 0);
    g.addColorStop(0,  `rgba(255,160,210,${0.11 * alpha})`);
    g.addColorStop(.5, `rgba(180,120,220,${0.07 * alpha})`);
    g.addColorStop(1,  'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(radius*0.55, 0, radius*0.55, radius*0.14, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  // Dust lanes oscuras (mejora visual)
  ctx.globalCompositeOperation = 'multiply';
  for (let arm = 0; arm < CFG.GALAXY_ARMS; arm++){
    ctx.save();
    ctx.rotate((TAU / CFG.GALAXY_ARMS) * arm + 0.35);
    const g = ctx.createLinearGradient(0, 0, radius, 0);
    g.addColorStop(0,  `rgba(20,0,30,${0.30 * alpha})`);
    g.addColorStop(.5, `rgba(20,0,30,${0.20 * alpha})`);
    g.addColorStop(1,  'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(radius*0.55, 0, radius*0.55, radius*0.05, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  // Estrellas
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  const stars = galaxyStars;
  const len = stars.length;
  for (let i = 0; i < len; i++){
    const s = stars[i];
    const r = s.r * radius;
    const x = Math.cos(s.a) * r;
    const y = Math.sin(s.a) * r * 0.93;
    const tw = 0.7 + 0.3 * Math.sin(t * s.twinkleSpeed + s.twinklePhase);
    const al = s.bright * tw * alpha;
    ctx.fillStyle = `rgba(${s.r8},${s.g8},${s.b8},${al})`;
    ctx.fillRect(x, y, s.size, s.size);
  }
  ctx.restore();

  // Halo central palpitante
  const pulse = 0.85 + 0.15 * Math.sin(t * 1.6);
  const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 0.20 * pulse);
  halo.addColorStop(0, `rgba(255,255,240,${0.60 * alpha})`);
  halo.addColorStop(1, 'rgba(255,255,240,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(cx, cy, radius * 0.20 * pulse, 0, TAU); ctx.fill();
}

/* ================================================================
   PARTÍCULAS — corazones, chispas, confeti, fugaces
================================================================ */
class HeartPool {
  constructor(max){ this.max = max; this.list = []; }
  spawn(x, y, opt = {}){
    if (this.list.length >= this.max) this.list.shift();
    this.list.push({
      x, y,
      vx: opt.vx ?? rand(-12, 12),
      vy: opt.vy ?? rand(-30, -55),
      life: 0, ttl: opt.ttl ?? rand(4, 7),
      size: opt.size ?? rand(10, 22),
      sway: rand(0.5, 1.4),
      phase: Math.random() * TAU,
      hue: opt.hue ?? rand(330, 360),
      gravity: opt.gravity ?? 4,
    });
  }
  update(dt){
    for (let i = this.list.length - 1; i >= 0; i--){
      const h = this.list[i];
      h.life += dt;
      h.x += h.vx * dt + Math.sin(h.life * h.sway + h.phase) * 8 * dt;
      h.y += h.vy * dt;
      h.vy += h.gravity * dt;
      if (h.life > h.ttl) this.list.splice(i, 1);
    }
  }
  draw(ctx){
    for (const h of this.list){
      const k = h.life / h.ttl;
      const a = k < 0.15 ? k/0.15 : (1 - (k - 0.15)/0.85);
      drawHeart(ctx, h.x, h.y, h.size, `hsla(${h.hue},85%,70%,${a})`);
    }
  }
  clear(){ this.list.length = 0; }
}

function drawHeart(ctx, x, y, s, color){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s/20, s/20);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, 6);
  ctx.bezierCurveTo(0, -2, -10, -2, -10, 6);
  ctx.bezierCurveTo(-10, 12, 0, 16, 0, 22);
  ctx.bezierCurveTo(0, 16, 10, 12, 10, 6);
  ctx.bezierCurveTo(10, -2, 0, -2, 0, 6);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath();
  ctx.ellipse(-4, 4, 2.5, 1.6, -0.4, 0, TAU);
  ctx.fill();
  ctx.restore();
}

class SparklePool {
  constructor(max){ this.max = max; this.list = []; }
  burst(x, y, n, hueA = 300, hueB = 360){
    for (let i = 0; i < n; i++){
      if (this.list.length >= this.max) break;
      const ang = Math.random() * TAU;
      const sp = rand(80, 380);
      this.list.push({
        x, y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: 0, ttl: rand(0.7, 1.6),
        size: rand(1.4, 3.2),
        hue: rand(hueA, hueB),
      });
    }
  }
  update(dt){
    for (let i = this.list.length - 1; i >= 0; i--){
      const p = this.list[i];
      p.life += dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.94; p.vy *= 0.94;
      p.vy += 60 * dt;
      if (p.life > p.ttl) this.list.splice(i, 1);
    }
  }
  draw(ctx){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of this.list){
      const k = 1 - p.life / p.ttl;
      ctx.fillStyle = `hsla(${p.hue},90%,75%,${k})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * k, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
  clear(){ this.list.length = 0; }
}

class ConfettiPool {
  constructor(max){ this.max = max; this.list = []; }
  rain(n){
    for (let i = 0; i < n; i++){
      if (this.list.length >= this.max) break;
      this.list.push({
        x: rand(0, W), y: rand(-H, 0),
        vx: rand(-30, 30), vy: rand(80, 180),
        rot: Math.random() * TAU,
        vrot: rand(-4, 4),
        size: rand(5, 11),
        hue: rand(310, 360),
        life: 0, ttl: rand(5, 9),
      });
    }
  }
  update(dt){
    for (let i = this.list.length - 1; i >= 0; i--){
      const c = this.list[i];
      c.life += dt;
      c.x += c.vx * dt; c.y += c.vy * dt;
      c.vy += 30 * dt;
      c.rot += c.vrot * dt;
      if (c.y > H + 30 || c.life > c.ttl) this.list.splice(i, 1);
    }
  }
  draw(ctx){
    for (const c of this.list){
      const k = 1 - clamp(c.life / c.ttl, 0, 1);
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.fillStyle = `hsla(${c.hue},80%,70%,${0.85 * k})`;
      ctx.fillRect(-c.size/2, -c.size/4, c.size, c.size/2);
      ctx.restore();
    }
  }
  clear(){ this.list.length = 0; }
}

class ShootingStars {
  constructor(){ this.list = []; this.timer = 0; this.rate = 0.9; }
  update(dt){
    this.timer += dt;
    if (this.timer > 1 / this.rate && this.list.length < 4){
      this.timer = 0;
      const fromTop = Math.random() < 0.5;
      this.list.push({
        x: rand(W * 0.1, W * 0.9),
        y: fromTop ? -20 : rand(0, H * 0.3),
        vx: rand(280, 520) * (Math.random() < 0.5 ? 1 : -1),
        vy: rand(280, 520),
        life: 0, ttl: rand(0.8, 1.4),
        len: rand(80, 180),
      });
    }
    for (let i = this.list.length - 1; i >= 0; i--){
      const s = this.list[i];
      s.life += dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.life > s.ttl || s.y > H + 50 || s.x < -200 || s.x > W + 200)
        this.list.splice(i, 1);
    }
  }
  draw(ctx, alpha){
    if (alpha <= 0) return;
    ctx.save();
    ctx.lineCap = 'round';
    for (const s of this.list){
      const k = 1 - s.life / s.ttl;
      const angle = Math.atan2(s.vy, s.vx);
      const tx = s.x - Math.cos(angle) * s.len;
      const ty = s.y - Math.sin(angle) * s.len;
      const grad = ctx.createLinearGradient(s.x, s.y, tx, ty);
      grad.addColorStop(0, `rgba(255,240,255,${k * alpha})`);
      grad.addColorStop(1, 'rgba(255,200,230,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${k * alpha})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.2, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

const hearts   = new HeartPool(CFG.HEARTS_MAX);
const sparkles = new SparklePool(CFG.SPARKLES_MAX);
const confetti = new ConfettiPool(CFG.CONFETTI_MAX);

/* ---- Escena 1: pensamientos (red neuronal) ---- */
const thoughtNodes = [];
function initThoughts(){
  thoughtNodes.length = 0;
  const N = 38;
  for (let i = 0; i < N; i++){
    thoughtNodes.push({
      x: rand(0, 1), y: rand(0, 1),
      vx: rand(-0.02, 0.02), vy: rand(-0.02, 0.02),
      r: rand(1.5, 3.0),
      hue: rand(245, 285),
      ph: Math.random() * TAU,
    });
  }
}
function drawThoughts(t, alpha){
  if (alpha <= 0) return;
  // veil violeta
  ctx.fillStyle = `rgba(40,10,80,${0.42 * alpha})`;
  ctx.fillRect(0, 0, W, H);

  // mover nodos (en coords normalizadas)
  for (const n of thoughtNodes){
    n.x += n.vx * 0.016;
    n.y += n.vy * 0.016;
    if (n.x < 0) n.x = 1; if (n.x > 1) n.x = 0;
    if (n.y < 0) n.y = 1; if (n.y > 1) n.y = 0;
  }

  // líneas entre nodos cercanos
  ctx.lineWidth = 1;
  for (let i = 0; i < thoughtNodes.length; i++){
    const a = thoughtNodes[i];
    for (let j = i + 1; j < thoughtNodes.length; j++){
      const b = thoughtNodes[j];
      const dx = (a.x - b.x) * W;
      const dy = (a.y - b.y) * H;
      const d = Math.hypot(dx, dy);
      const maxD = Math.min(W, H) * 0.22;
      if (d < maxD){
        const k = 1 - d / maxD;
        ctx.strokeStyle = `rgba(180,150,255,${0.18 * k * alpha})`;
        ctx.beginPath();
        ctx.moveTo(a.x * W, a.y * H);
        ctx.lineTo(b.x * W, b.y * H);
        ctx.stroke();
      }
    }
  }

  // nodos
  for (const n of thoughtNodes){
    const x = n.x * W, y = n.y * H;
    const pulse = 0.6 + 0.4 * Math.sin(t * 1.5 + n.ph);
    const glow = ctx.createRadialGradient(x, y, 0, x, y, n.r * 8);
    glow.addColorStop(0, `hsla(${n.hue},90%,80%,${0.7 * pulse * alpha})`);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y, n.r * 8, 0, TAU); ctx.fill();
    ctx.fillStyle = `hsla(${n.hue},95%,85%,${alpha})`;
    ctx.beginPath(); ctx.arc(x, y, n.r, 0, TAU); ctx.fill();
  }
}

/* ---- Escena 2: corazón gigante latiendo ---- */
function drawHeartScene(t, alpha){
  if (alpha <= 0) return;
  // tinte cálido
  const tint = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H) * 0.7);
  tint.addColorStop(0, `rgba(255,80,140,${0.18 * alpha})`);
  tint.addColorStop(1, 'rgba(60,0,30,0)');
  ctx.fillStyle = tint;
  ctx.fillRect(0, 0, W, H);

  // beat: dos pulsos por ciclo (lub-dub)
  const cycle = (t % 1.1) / 1.1;
  const lub = Math.exp(-Math.pow((cycle - 0.05) * 8, 2));
  const dub = Math.exp(-Math.pow((cycle - 0.30) * 8, 2)) * 0.6;
  const beat = lub + dub;
  const scl = 1 + beat * 0.10;

  const cx = W/2, cy = H/2;
  const size = Math.min(W, H) * 0.38 * scl;

  // halo
  const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 1.6);
  halo.addColorStop(0, `rgba(255,120,170,${(0.35 + beat*0.25) * alpha})`);
  halo.addColorStop(0.5, `rgba(255,80,140,${0.15 * alpha})`);
  halo.addColorStop(1, 'rgba(255,80,140,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(cx, cy, size * 1.6, 0, TAU); ctx.fill();

  // corazón con bezier (escalado)
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(size / 20, size / 20);
  // sombra exterior
  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 22);
  grad.addColorStop(0, `rgba(255,180,210,${0.95 * alpha})`);
  grad.addColorStop(0.5, `rgba(255,90,150,${0.95 * alpha})`);
  grad.addColorStop(1, `rgba(180,30,90,${0.9 * alpha})`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, 6);
  ctx.bezierCurveTo(0, -8, -16, -8, -16, 6);
  ctx.bezierCurveTo(-16, 14, 0, 18, 0, 26);
  ctx.bezierCurveTo(0, 18, 16, 14, 16, 6);
  ctx.bezierCurveTo(16, -8, 0, -8, 0, 6);
  ctx.fill();
  // brillo
  ctx.fillStyle = `rgba(255,255,255,${0.45 * alpha})`;
  ctx.beginPath();
  ctx.ellipse(-6, 2, 4, 2.4, -0.4, 0, TAU);
  ctx.fill();
  ctx.restore();
}

/* ---- Escena 3: amor que sigue ahí (corazones que suben) ---- */
function drawLoveScene(t, alpha){
  if (alpha <= 0) return;
  const tint = ctx.createLinearGradient(0, H, 0, 0);
  tint.addColorStop(0, `rgba(255,100,160,${0.20 * alpha})`);
  tint.addColorStop(1, `rgba(60,0,40,0)`);
  ctx.fillStyle = tint;
  ctx.fillRect(0, 0, W, H);
  // los corazones flotantes los maneja el HeartPool global.
}

/* ---- Escena 4: caja de regalo brillante ---- */
let boxOpenT = 0;
function drawBoxScene(t, alpha, sceneT){
  if (alpha <= 0) return;
  // tinte dorado/rosa
  const tint = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H));
  tint.addColorStop(0, `rgba(255,180,140,${0.16 * alpha})`);
  tint.addColorStop(1, 'rgba(40,10,30,0)');
  ctx.fillStyle = tint;
  ctx.fillRect(0, 0, W, H);

  const cx = W/2, cy = H/2;
  const s = Math.min(W, H) * 0.18;
  const bobY = Math.sin(t * 1.4) * s * 0.05;
  const wobble = Math.sin(t * 2.8) * 0.04;

  // halo bajo la caja
  const halo = ctx.createRadialGradient(cx, cy + s * 1.0, 0, cx, cy + s * 1.0, s * 2.2);
  halo.addColorStop(0, `rgba(255,200,160,${0.45 * alpha})`);
  halo.addColorStop(1, 'rgba(255,200,160,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.ellipse(cx, cy + s * 1.0, s * 2.2, s * 0.6, 0, 0, TAU); ctx.fill();

  // se abre al final de la escena
  boxOpenT = clamp((sceneT - 5.0) / 1.5, 0, 1);

  ctx.save();
  ctx.translate(cx, cy + bobY);
  ctx.rotate(wobble);

  // cuerpo de la caja
  const bw = s * 1.8, bh = s * 1.3;
  const bodyG = ctx.createLinearGradient(0, -bh/2, 0, bh/2);
  bodyG.addColorStop(0, `rgba(255,180,210,${alpha})`);
  bodyG.addColorStop(0.5, `rgba(255,120,170,${alpha})`);
  bodyG.addColorStop(1, `rgba(190,60,120,${alpha})`);
  ctx.fillStyle = bodyG;
  ctx.fillRect(-bw/2, -bh/2 + s * 0.2, bw, bh - s * 0.2);

  // cinta vertical
  ctx.fillStyle = `rgba(255,230,150,${0.95 * alpha})`;
  ctx.fillRect(-s * 0.15, -bh/2 + s * 0.2, s * 0.3, bh - s * 0.2);

  // tapa (se levanta cuando boxOpenT > 0)
  ctx.save();
  const lidLift = boxOpenT * s * 0.9;
  const lidTilt = boxOpenT * 0.35;
  ctx.translate(0, -bh/2 + s * 0.05 - lidLift);
  ctx.rotate(lidTilt);
  const lidG = ctx.createLinearGradient(0, -s * 0.25, 0, s * 0.25);
  lidG.addColorStop(0, `rgba(255,200,220,${alpha})`);
  lidG.addColorStop(1, `rgba(220,90,150,${alpha})`);
  ctx.fillStyle = lidG;
  ctx.fillRect(-bw/2 - s * 0.05, -s * 0.25, bw + s * 0.1, s * 0.5);
  // cinta horizontal en la tapa
  ctx.fillStyle = `rgba(255,230,150,${0.95 * alpha})`;
  ctx.fillRect(-s * 0.15, -s * 0.25, s * 0.3, s * 0.5);
  // moño
  ctx.translate(0, -s * 0.25);
  ctx.fillStyle = `rgba(255,240,170,${alpha})`;
  ctx.beginPath();
  ctx.ellipse(-s * 0.28, 0, s * 0.28, s * 0.18, -0.4, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(s * 0.28, 0, s * 0.28, s * 0.18, 0.4, 0, TAU);
  ctx.fill();
  ctx.fillStyle = `rgba(220,140,40,${alpha})`;
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.10, s * 0.10, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  // luz que sale de la caja al abrirse
  if (boxOpenT > 0){
    const beam = ctx.createRadialGradient(0, -bh/2 + s*0.2, 0, 0, -bh/2 + s*0.2, s * 2 * boxOpenT);
    beam.addColorStop(0, `rgba(255,250,220,${0.85 * boxOpenT * alpha})`);
    beam.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = beam;
    ctx.beginPath(); ctx.arc(0, -bh/2 + s * 0.2, s * 2 * boxOpenT, 0, TAU); ctx.fill();
  }

  ctx.restore();

  // Chispas constantes alrededor (delegamos a sparkle pool)
  if (Math.random() < 0.18){
    const ang = Math.random() * TAU;
    const r = s * rand(1.4, 2.2);
    sparkles.burst(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r, 1, 35, 60);
  }
}

/* ---- Escena 5: shy "bueno yo..." ---- */
function drawShyScene(t, alpha){
  if (alpha <= 0) return;
  ctx.fillStyle = `rgba(20,8,40,${0.38 * alpha})`;
  ctx.fillRect(0, 0, W, H);
  // partículas tímidas, lentas
  const cx = W/2, cy = H/2;
  for (let i = 0; i < 6; i++){
    const ang = t * 0.25 + i * (TAU / 6);
    const r = Math.min(W, H) * (0.20 + 0.05 * Math.sin(t + i));
    const x = cx + Math.cos(ang) * r;
    const y = cy + Math.sin(ang) * r;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 22);
    g.addColorStop(0, `rgba(200,180,255,${0.55 * alpha})`);
    g.addColorStop(1, 'rgba(200,180,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, 22, 0, TAU); ctx.fill();
  }
}

/* ---- Escena 6: te amo (estallido) ---- */
function drawTeAmoScene(t, alpha){
  if (alpha <= 0) return;
  // veil rosa pulsante
  const pulse = 0.5 + 0.5 * Math.sin(t * 4);
  ctx.fillStyle = `rgba(255,80,160,${(0.10 + 0.06 * pulse) * alpha})`;
  ctx.fillRect(0, 0, W, H);
}

/* ---- Escena 7: awkward (cálido naranja con gotitas) ---- */
const sweatDrops = [];
function drawAwkwardScene(t, alpha){
  if (alpha <= 0) return;
  const tint = ctx.createLinearGradient(0, 0, 0, H);
  tint.addColorStop(0, `rgba(80,30,10,${0.45 * alpha})`);
  tint.addColorStop(1, `rgba(120,50,20,${0.35 * alpha})`);
  ctx.fillStyle = tint;
  ctx.fillRect(0, 0, W, H);

  // gotitas tipo "^^;" cayendo lentamente
  if (Math.random() < 0.04 && sweatDrops.length < 30){
    sweatDrops.push({
      x: rand(W * 0.1, W * 0.9),
      y: rand(-30, H * 0.2),
      vy: rand(40, 80),
      r: rand(3, 6),
      life: 0, ttl: rand(2.5, 4),
    });
  }
  for (let i = sweatDrops.length - 1; i >= 0; i--){
    const d = sweatDrops[i];
    d.life += 0.016;
    d.y += d.vy * 0.016;
    if (d.life > d.ttl || d.y > H + 20){ sweatDrops.splice(i, 1); continue; }
    const k = 1 - d.life / d.ttl;
    ctx.fillStyle = `rgba(180,220,255,${0.7 * k * alpha})`;
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, d.r * 0.7, d.r, 0, 0, TAU);
    ctx.fill();
  }
}

/* ---- Escena 9: muak (labios) ---- */
function drawLips(cx, cy, scale, alpha){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  // sombra suave bajo los labios
  const sh = ctx.createRadialGradient(0, 0, 0, 0, 0, 80);
  sh.addColorStop(0, `rgba(255,80,140,${0.45 * alpha})`);
  sh.addColorStop(1, 'rgba(255,80,140,0)');
  ctx.fillStyle = sh;
  ctx.beginPath(); ctx.arc(0, 0, 80, 0, TAU); ctx.fill();

  // labio superior (forma de "M" suave)
  const lipG = ctx.createLinearGradient(0, -25, 0, 25);
  lipG.addColorStop(0, `rgba(255,140,180,${alpha})`);
  lipG.addColorStop(0.5, `rgba(230,40,90,${alpha})`);
  lipG.addColorStop(1, `rgba(160,20,60,${alpha})`);
  ctx.fillStyle = lipG;

  ctx.beginPath();
  // upper lip
  ctx.moveTo(-50, 0);
  ctx.bezierCurveTo(-45, -22, -25, -22, -10, -8);
  ctx.bezierCurveTo(-5, -2, 5, -2, 10, -8);
  ctx.bezierCurveTo(25, -22, 45, -22, 50, 0);
  // lower lip
  ctx.bezierCurveTo(45, 22, -45, 22, -50, 0);
  ctx.closePath();
  ctx.fill();

  // separación entre labios
  ctx.strokeStyle = `rgba(80,0,30,${0.7 * alpha})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-50, 0);
  ctx.bezierCurveTo(-25, 4, 25, 4, 50, 0);
  ctx.stroke();

  // brillo
  ctx.fillStyle = `rgba(255,220,235,${0.55 * alpha})`;
  ctx.beginPath();
  ctx.ellipse(-18, -8, 8, 2.4, -0.2, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(15, -8, 6, 2, 0.2, 0, TAU);
  ctx.fill();

  ctx.restore();
}

function drawMuakScene(t, alpha, sceneT){
  if (alpha <= 0) return;

  // tinte rosa profundo
  const tint = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H));
  tint.addColorStop(0, `rgba(255,80,160,${0.20 * alpha})`);
  tint.addColorStop(1, 'rgba(40,0,30,0)');
  ctx.fillStyle = tint;
  ctx.fillRect(0, 0, W, H);

  // Labios pulsantes
  const beat = 0.5 + 0.5 * Math.sin(t * 2.4);
  const baseScale = Math.min(W, H) * 0.005;
  const scale = baseScale * (1.6 + beat * 0.18);
  drawLips(W/2, H * 0.62, scale, alpha);

  // Corazones en órbita estable alrededor del beso
  const cx = W/2, cy = H * 0.62;
  const orbitR = Math.min(W, H) * 0.22;
  const N = 14;
  for (let i = 0; i < N; i++){
    const a = (TAU / N) * i + t * 0.6;
    const x = cx + Math.cos(a) * orbitR;
    const y = cy + Math.sin(a) * orbitR * 0.55;
    const s = 16 + 6 * Math.sin(t * 2 + i);
    drawHeart(ctx, x, y, s, `hsla(${340 + (i*3)%20},85%,${65 + Math.sin(t+i)*8}%,${0.85 * alpha})`);
  }

  // Marcas de beso ocasionales (kiss prints flotantes)
  if (Math.random() < 0.02){
    sparkles.burst(W/2 + rand(-W*0.3, W*0.3), H * 0.4 + rand(-40, 40), 8, 330, 360);
  }
}

/* ================================================================
   TEXTOS DOM
================================================================ */
const ui = document.getElementById('ui');
const activeLines = [];

function showLine(html, sizeClass, posClass){
  const el = document.createElement('div');
  el.className = 'line ' + (posClass || '');
  el.innerHTML = `<span class="${sizeClass}">${html}</span>`;
  ui.appendChild(el);
  el.offsetWidth; // reflow
  requestAnimationFrame(() => el.classList.add('show', 'in'));
  activeLines.push(el);
  return el;
}
function hideLine(el){
  if (!el) return;
  el.classList.remove('show', 'in');
  el.classList.add('out');
  setTimeout(() => el.remove(), 1800);
}
function hideLastLine(){
  const el = activeLines.pop();
  hideLine(el);
}

  const dx = Math.cos(driftAng) * drift;
  const dy = Math.sin(driftAng) * drift;
  el.style.transition = 'opacity 1.6s ease, transform 7s linear';
  el.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  requestAnimationFrame(() => {
    el.classList.add('show');
    el.style.transform = `translate(calc(-50% + ${x+dx}px), calc(-50% + ${y+dy}px))`;
  });
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 1700);
  }, 5200);
}

/* ================================================================
   ESTADO + LOOP
================================================================ */
const state = {
  started: false,
  t: 0,
  scriptIdx: 0,
  galaxyAlpha: 0,
  galaxyTarget: 0,
  showCompliments: false,
  heartTimer: 0,
};

function update(dt){
  if (!state.started) return;
  state.t += dt;

  // Avanzar timeline
  while (state.scriptIdx < TIMELINE.length && TIMELINE[state.scriptIdx].t <= state.t){
    const evt = TIMELINE[state.scriptIdx++];
    try { evt.do(); } catch(e) { console.error(e); }
  }

  // Transición entre escenas
  if (prevScene){
    transitionT += dt / TRANSITION_DUR;
    if (transitionT >= 1){ transitionT = 1; prevScene = null; }
  }

  // Galaxia fade
  const speed = 0.55;
  if (state.galaxyAlpha < state.galaxyTarget){
    state.galaxyAlpha = Math.min(state.galaxyTarget, state.galaxyAlpha + speed * dt);
  } else if (state.galaxyAlpha > state.galaxyTarget){
    state.galaxyAlpha = Math.max(state.galaxyTarget, state.galaxyAlpha - speed * dt);
  }

  // Spawning de partículas según escena
  spawnByScene(dt);

  // Update todos los pools
  hearts.update(dt);
  sparkles.update(dt);
  confetti.update(dt);
  shooting.update(dt);

  // Cumplidos
  if (state.showCompliments){
    complimentTimer -= dt;
    if (complimentTimer <= 0){
      complimentTimer = rand(1.4, 2.2);
      spawnCompliment();
    }
  }
}

function spawnByScene(dt){
  state.heartTimer -= dt;
  if (state.heartTimer > 0) return;

  switch (currentScene){
    case 'love':
      state.heartTimer = 0.18;
      hearts.spawn(rand(0, W), H + 20, { ttl: rand(5, 8), size: rand(12, 22) });
      break;
    case 'heart':
      state.heartTimer = 0.4;
      hearts.spawn(rand(0, W), H + 20, { ttl: rand(4, 6), size: rand(8, 16) });
      break;
    case 'happyday':
      state.heartTimer = 0.6;
      hearts.spawn(rand(0, W), H + 20, { ttl: rand(4, 7), size: rand(10, 20) });
      break;
    case 'box':
      state.heartTimer = 1.0;
      // chispas continuas alrededor de la caja
      break;
    case 'muak':
      state.heartTimer = 0.5;
      hearts.spawn(W/2 + rand(-W*0.3, W*0.3), H + 20, { vy: rand(-60, -30), ttl: rand(4, 7) });
      break;
    default:
      state.heartTimer = 1.5;
  }
}

function render(){
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bgCanvas, 0, 0, W, H);

  // Render escena con cross-fade si estamos en transición
  const sceneT = state.t - sceneStartT;
  if (prevScene){
    const k = transitionT;
    const prev = SCENES[prevScene]?.render;
    const curr = SCENES[currentScene]?.render;
    if (prev) prev(state.t, 1 - k, sceneT);
    if (curr) curr(state.t, k, sceneT);
  } else {
    const curr = SCENES[currentScene]?.render;
    if (curr) curr(state.t, 1, sceneT);
  }

  // Galaxia (alpha controlado por estado)
  drawGalaxy(state.t, state.galaxyAlpha);

  // Estrellas fugaces (visibles en galaxia y muak)
  const shootAlpha =
    currentScene === 'happyday' ? 0.9 :
    currentScene === 'muak'     ? 0.5 :
    currentScene === 'thoughts' ? 0.25 :
    0.0;
  shooting.draw(ctx, shootAlpha);

  // Partículas
  hearts.draw(ctx);
  sparkles.draw(ctx);
  confetti.draw(ctx);
}

/* ================================================================
   LOOP
================================================================ */
let last = performance.now();
function frame(now){
  const dt = Math.min((now - last) / 1000, 1/30);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ================================================================
   INIT
================================================================ */
function regenStaticLayers(){ makeBackgroundStars(); }

function start(){
  if (state.started) return;
  state.started = true;
  document.getElementById('starter').classList.add('gone');
  last = performance.now();
}

resize();
makeGalaxy();
initThoughts();
regenStaticLayers();
requestAnimationFrame(frame);

document.getElementById('starter').addEventListener('click', start);
document.getElementById('starter').addEventListener('touchstart', e => { e.preventDefault(); start(); }, { passive:false });
setTimeout(() => start(), 3000);
</script>
