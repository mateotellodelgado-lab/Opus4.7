<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <title>Neo-Gravity: Elastic Escape</title>
  <style>
    /* =====================================================
       RESET + GLOBAL — block accidental scroll/zoom on mobile
       ===================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a12;
      color: #cfd5ff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    /* Canvas fills the viewport. We use a single <canvas> covering the
       full screen and letterbox the virtual world inside it. */
    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #0a0a12;
      touch-action: none;
      will-change: transform;
    }
    /* Overlay layer holds DOM-based UI (menu, panels, HUD chips). It is
       fixed on top of the canvas with `pointer-events: none` so taps
       pass through to the canvas unless re-enabled per child. */
    .overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      contain: strict;

    }
    .overlay > * { pointer-events: auto; }
    /* Full-screen panels (menu, level select, pause, etc.) — hardware
       compositing via opacity transitions to avoid layout thrash. */
    .panel {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center,
                  rgba(20,20,40,0.85) 0%,
                  rgba(10,10,18,0.95) 70%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      transition: opacity 220ms ease;
      will-change: opacity;
    }
    .panel.hidden { opacity: 0; pointer-events: none; }
    .title {
      font-size: clamp(28px, 6vw, 56px);
      font-weight: 800;
      letter-spacing: 0.18em;
      color: #7df9ff;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(125,249,255,0.6),
                   0 0 36px rgba(125,249,255,0.3);
    }
    .subtitle {
      font-size: clamp(12px, 2.4vw, 16px);
      color: #ff39b8;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255,57,184,0.55);
    }
    .btn {
      min-width: 220px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #0a0a12;

      background: #7df9ff;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(125,249,255,0.45),
                  inset 0 0 0 1px rgba(255,255,255,0.4);
      transition: transform 120ms ease, box-shadow 120ms ease;
      will-change: transform;
    }
    .btn:active { transform: translateY(1px) scale(0.98); }
    .btn.ghost {
      background: transparent;
      color: #cfd5ff;
      box-shadow: inset 0 0 0 1px rgba(207,213,255,0.35);
    }
    .btn.danger {
      background: #ff39b8;
      color: #0a0a12;
      box-shadow: 0 0 24px rgba(255,57,184,0.5);
    }
    /* Level selector grid — flexible, no media-query breakpoints. */
    .levels {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
      gap: 12px;
      max-width: min(520px, 90vw);
      width: 100%;
    }
    .level-tile {
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      background: rgba(125,249,255,0.06);
      box-shadow: inset 0 0 0 1px rgba(125,249,255,0.4);
      color: #7df9ff;
      font-size: 22px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }
    .level-tile.locked { opacity: 0.35; cursor: not-allowed; }
    .level-tile .best {
      position: absolute;
      bottom: 6px;
      font-size: 10px;
      color: #ff39b8;
      letter-spacing: 0.2em;

    }
    /* HUD: top bar with chips. Uses fixed positioning + transform-only
       updates from JS so no relayout occurs during gameplay. */
    #hud {
      position: fixed;
      top: env(safe-area-inset-top, 0);
      left: 0; right: 0;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #cfd5ff;
      gap: 8px;
    }
    #hud.hidden { display: none; }
    #hud .chip {
      background: rgba(10,10,18,0.55);
      box-shadow: inset 0 0 0 1px rgba(125,249,255,0.25);
      padding: 8px 12px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    #hud .actions { display: flex; gap: 8px; pointer-events: auto; }
    .icon-btn {
      width: 38px; height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(10,10,18,0.55);
      box-shadow: inset 0 0 0 1px rgba(125,249,255,0.35);
      color: #7df9ff;
      border-radius: 8px;
      border: 0;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .icon-btn:active { transform: scale(0.95); }
    /* Toast: transient bottom message. */
    .toast {
      position: fixed;
      bottom: 28px;

      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      background: rgba(10,10,18,0.7);
      box-shadow: inset 0 0 0 1px rgba(255,57,184,0.4);
      border-radius: 6px;
      color: #ff39b8;
      letter-spacing: 0.2em;
      font-size: 11px;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0;
      transition: opacity 200ms ease;
      will-change: opacity;
    }
    .toast.show { opacity: 1; }
    /* Ad overlay: opaque scrim shown while a CrazyGames ad request is
       in-flight. Physics + audio are paused via JS during this state. */
    #ad-scrim {
      position: fixed;
      inset: 0;
      background: rgba(5,5,10,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7df9ff;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
      z-index: 99;
    }
    #ad-scrim.show { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>
  <!-- Single rendering surface. Everything visual is drawn on this canvas. -->
  <canvas id="game" aria-label="Neo-Gravity game canvas"></canvas>

  <!-- DOM overlay for menus, HUD, and toasts. Pointer-events disabled
       at the root so taps reach the canvas; re-enabled per-child. -->
  <div id="overlay" class="overlay">

    <!-- HUD (only visible during PLAYING) -->
    <div id="hud" class="hidden">
      <div class="chip" id="hud-level">LV 01</div>
      <div class="chip" id="hud-shots">SHOTS 00</div>

      <div class="actions">
        <button class="icon-btn" id="btn-mute" aria-label="Mute">M</button>
        <button class="icon-btn" id="btn-pause" aria-label="Pause">II</button>
        <button class="icon-btn" id="btn-restart" aria-label="Restart">R</button>
      </div>
    </div>

    <!-- MAIN MENU -->
    <div class="panel" id="panel-menu">
      <div class="subtitle">// Neo-Gravity</div>
      <div class="title">Elastic Escape</div>
      <button class="btn" id="btn-play">Play</button>
      <button class="btn ghost" id="btn-levels">Level Select</button>
    </div>

    <!-- LEVEL SELECT -->
    <div class="panel hidden" id="panel-levels">
      <div class="title">Sectors</div>
      <div class="levels" id="levels-grid"></div>
      <button class="btn ghost" id="btn-back-menu">Back</button>
    </div>

    <!-- PAUSED -->
    <div class="panel hidden" id="panel-pause">
      <div class="title">Paused</div>
      <button class="btn" id="btn-resume">Resume</button>
      <button class="btn ghost" id="btn-restart-pause">Restart Sector</button>
      <button class="btn ghost" id="btn-quit">Main Menu</button>
    </div>

    <!-- GAME OVER -->
    <div class="panel hidden" id="panel-gameover">
      <div class="subtitle">// orbital decay</div>
      <div class="title">Failed</div>
      <button class="btn danger" id="btn-retry">Retry</button>
      <button class="btn ghost" id="btn-quit-go">Main Menu</button>
    </div>

    <!-- VICTORY -->
    <div class="panel hidden" id="panel-victory">
      <div class="subtitle">// vortex breached</div>
      <div class="title">Cleared</div>
      <div id="victory-stats" class="chip"></div>
      <button class="btn" id="btn-next">Next Sector</button>
      <button class="btn ghost" id="btn-quit-vic">Main Menu</button>
    </div>

    <!-- Toast & Ad scrim -->
    <div class="toast" id="toast"></div>
    <div id="ad-scrim">advertisement</div>
  </div>


  <script>
  /* ================================================================
   * Neo-Gravity: Elastic Escape
   * ----------------------------------------------------------------
   * A high-precision, single-file HTML5 Canvas physics puzzle game.
   * Pure vanilla JavaScript, zero external dependencies, custom 2D
   * vector physics, fixed-timestep game loop, full DPR scaling, and
   * a CrazyGames SDK v3 integration skeleton.
   *
   * Architecture (sections numbered below):
   *   1.  Configuration & color palette
   *   2.  Math utilities (Vec2 helpers, vector pool)
   *   3.  Generic Object Pool
   *   4.  Particle system (pooled, alpha-faded)
   *   5.  Physics primitives (gravity, attractors, collision math)
   *   6.  Entity factories
   *   7.  Level definitions
   *   8.  Audio (WebAudio synthesis with explicit freeze hook)
   *   9.  Input (unified Pointer/Touch/Mouse with delta predict)
   *   10. Viewport (DPR + letterbox + camera shake)
   *   11. Starfield cache (offscreen, drawn once)
   *   12. Renderer (neon glow via shadowBlur)
   *   13. UI / HUD bridge
   *   14. CrazyGames SDK v3 hooks
   *   15. Persistence (localStorage best-shots)
   *   16. Game core (state machine, loop, level lifecycle)
   *   17. Bootstrap
   *
   * Performance contract:
   *   - No object allocation in update/render loops.
   *   - All transient particles, vectors, and contacts are pooled.
   *   - Fixed-timestep physics decoupled from refresh rate.
   *   - Canvas scaled by devicePixelRatio (clamped at 3 for memory).
   * ================================================================ */
  'use strict';
  (function () {

  /* ================================================================
   * SECTION 1 — CONFIGURATION
   * ================================================================
   * All gameplay tuning lives here. WORLD_W/WORLD_H define a virtual
   * coordinate space (portrait 1080x1920) that is letterboxed into
   * the actual viewport, so physics is identical on every device.
   * FIXED_DT is the physics tick. The game loop accumulates real
   * frame time and consumes it in fixed slices to ensure 60Hz/90Hz/
   * 120Hz panels all produce identical simulation output.
   * ================================================================ */
  const CFG = Object.freeze({
    WORLD_W: 1080,
    WORLD_H: 1920,
    FIXED_DT: 1 / 120,        // physics step (s)
    MAX_ACCUM: 0.25,          // cap accumulator to prevent spiral of death

    GRAVITY_X: 0,
    GRAVITY_Y: 540,           // world units / s^2 (downward)
    AIR_DRAG: 0.00045,        // exponential velocity damping
    ORB_RADIUS: 22,
    ORB_MASS: 1,
    ORB_RESTITUTION: 0.78,    // wall bounce elasticity
    BUMPER_RESTITUTION: 1.18, // neon bumpers boost the orb
    MAX_LAUNCH_SPEED: 1700,
    MIN_LAUNCH_DRAG: 6,       // below this, drag is treated as a tap-cancel
    LAUNCH_DRAG_SCALE: 6,     // multiplier from drag-distance to speed
    AIM_LOOKAHEAD_STEPS: 30,  // trajectory pre-simulation length
    AIM_LOOKAHEAD_DT: 1 / 60, // dt used inside pre-sim
    AIM_DOT_SPACING: 1,       // every Nth sample becomes a visible dot
    PARTICLE_POOL_SIZE: 720,
    VECTOR_POOL_SIZE: 256,
    MIN_REST_SPEED: 6,        // below this, orb counts as "settled"
    REST_TIME: 1.4,           // seconds settled before failure
    AUDIO_GAIN: 0.18,
    SHAKE_DECAY: 6,           // per-second decay of camera shake magnitude
    AD_COOLDOWN_MS: 60_000,   // throttle interstitial ads
  });

  /* ----------------------------------------------------------------
   * Color palette — a curated cyber-minimalist neon vocabulary.
   * Glow is rendered with shadowBlur in the canvas renderer.
   * ---------------------------------------------------------------- */
  const COL = Object.freeze({
    BG: '#0a0a12',
    GRID: 'rgba(120,140,200,0.045)',
    ORB: '#7df9ff',
    ORB_GLOW: '#7df9ff',
    WALL_FILL: '#171726',
    WALL_EDGE: '#5b5be6',
    BUMPER: '#ff39b8',
    BLACKHOLE: '#000000',
    BLACKHOLE_RING: '#9b59ff',
    KILL: '#ff3a3a',
    PORTAL: '#39ff88',
    VORTEX: '#ffd84d',
    AIM: '#7df9ff',
    STAR: 'rgba(180,200,255,0.55)',
  });

  /* Finite state machine identifiers. */
  const STATE = Object.freeze({
    BOOT: 'BOOT',
    MENU: 'MENU',
    LEVEL_SELECT: 'LEVEL_SELECT',
    PLAYING: 'PLAYING',

    PAUSED: 'PAUSED',
    GAME_OVER: 'GAME_OVER',
    VICTORY: 'VICTORY',
  });

  /* ================================================================
   * SECTION 2 — MATH UTILITIES
   * ================================================================
   * To keep the GC silent during gameplay we avoid `new` in hot paths.
   * Vectors are plain `{x, y}` records; transient ones come from the
   * VEC_POOL. All helpers are pure functions on numeric components.
   * ================================================================ */
  const PI2 = Math.PI * 2;
  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function lerp(a, b, t)    { return a + (b - a) * t; }
  function len(x, y)        { return Math.sqrt(x * x + y * y); }
  function len2(x, y)       { return x * x + y * y; }
  function rand(a, b)       { return a + Math.random() * (b - a); }
  function sign(v)          { return v < 0 ? -1 : v > 0 ? 1 : 0; }

  /* Lightweight vector pool. Use { x, y } records, never `new`. */
  function makeVecPool(size) {
    const free = new Array(size);
    for (let i = 0; i < size; i++) free[i] = { x: 0, y: 0 };
    let n = size;
    return {
      acquire() {
        if (n === 0) return { x: 0, y: 0 };
        const v = free[--n];
        v.x = 0; v.y = 0;
        return v;
      },
      release(v) { if (n < free.length) free[n++] = v; },
    };
  }
  const VEC_POOL = makeVecPool(CFG.VECTOR_POOL_SIZE);

  /* ================================================================
   * SECTION 3 — GENERIC OBJECT POOL
   * ================================================================
   * Used by particles. Active objects are kept in a plain array
   * (cheap iteration); the free list is a stack. Swap-remove is used
   * on release to avoid array.shift() costs.
   * ================================================================ */
  class ObjectPool {
    constructor(factory, resetFn, size) {
      this._factory = factory;
      this._reset = resetFn || null;
      this._free = new Array(size);
      this._active = [];

      for (let i = 0; i < size; i++) this._free[i] = factory();
    }
    acquire() {
      const o = this._free.length > 0 ? this._free.pop() : this._factory();
      this._active.push(o);
      return o;
    }
    release(obj) {
      const i = this._active.indexOf(obj);
      if (i === -1) return;
      const last = this._active.length - 1;
      this._active[i] = this._active[last];
      this._active.pop();
      if (this._reset) this._reset(obj);
      this._free.push(obj);
    }
    releaseAll() {
      for (let i = 0; i < this._active.length; i++) {
        if (this._reset) this._reset(this._active[i]);
        this._free.push(this._active[i]);
      }
      this._active.length = 0;
    }
    get active() { return this._active; }
    get activeCount() { return this._active.length; }
  }

  /* ================================================================
   * SECTION 4 — PARTICLE SYSTEM
   * ================================================================
   * Particles are drawn as small filled rectangles for batch speed.
   * Each particle has a per-frame `life` countdown which drives both
   * alpha and culling. The pool is sized at PARTICLE_POOL_SIZE so we
   * never allocate during play.
   * ================================================================ */
  const particlePool = new ObjectPool(
    () => ({ x:0, y:0, vx:0, vy:0, life:0, maxLife:1, size:2, hue:'#7df9ff', drag:0.92 }),
    (p) => { p.life = 0; },
    CFG.PARTICLE_POOL_SIZE
  );

  /** Emits an omnidirectional burst of `count` particles. */
  function emitBurst(x, y, color, count, speed, sizeRange, lifeRange) {
    for (let i = 0; i < count; i++) {
      if (particlePool.activeCount >= CFG.PARTICLE_POOL_SIZE) break;
      const p = particlePool.acquire();
      const a = Math.random() * PI2;
      const s = rand(speed * 0.4, speed);
      p.x = x; p.y = y;
      p.vx = Math.cos(a) * s;

      p.vy = Math.sin(a) * s;
      p.maxLife = rand(lifeRange[0], lifeRange[1]);
      p.life = p.maxLife;
      p.size = rand(sizeRange[0], sizeRange[1]);
      p.hue = color;
      p.drag = 0.94;
    }
  }

  /** Emits a single short-lived trail particle behind the orb. */
  function emitTrail(x, y, vx, vy, color) {
    if (particlePool.activeCount >= CFG.PARTICLE_POOL_SIZE) return;
    const p = particlePool.acquire();
    p.x = x; p.y = y;
    p.vx = -vx * 0.05 + rand(-12, 12);
    p.vy = -vy * 0.05 + rand(-12, 12);
    p.maxLife = 0.45;
    p.life = p.maxLife;
    p.size = rand(1.6, 3.2);
    p.hue = color;
    p.drag = 0.88;
  }

  /** Per-tick particle update. Releases dead particles to the pool. */
  function updateParticles(dt) {
    const arr = particlePool.active;
    for (let i = arr.length - 1; i >= 0; i--) {
      const p = arr[i];
      p.life -= dt;
      if (p.life <= 0) { particlePool.release(p); continue; }
      p.vx *= p.drag;
      p.vy *= p.drag;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  /** Particle render pass — single fillStyle batches per color. */
  function renderParticles(ctx) {
    const arr = particlePool.active;
    for (let i = 0, n = arr.length; i < n; i++) {
      const p = arr[i];
      const a = clamp(p.life / p.maxLife, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.hue;
      ctx.fillRect(p.x - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }


  /* ================================================================
   * SECTION 5 — PHYSICS ENGINE
   * ================================================================
   * Custom 2D solver. Integration is semi-implicit Euler (most stable
   * for arcade physics with restitution-based collisions). Collisions
   * are circle-vs-AABB and circle-vs-thickened-segment. Penetration
   * is resolved positionally first, then velocity is reflected with
   * a configurable restitution coefficient.
   * ================================================================ */

  /** Apply gravity, black-hole attraction, drag, and integrate. */
  function integrateOrb(orb, blackholes, dt) {
    // (1) World gravity
    orb.vel.x += CFG.GRAVITY_X * dt;
    orb.vel.y += CFG.GRAVITY_Y * dt;

    // (2) Black-hole attraction (clamped inverse-square; the radius
    //     is capped so the orb never tunnels through with infinite a).
    for (let i = 0; i < blackholes.length; i++) {
      const bh = blackholes[i];
      const dx = bh.x - orb.pos.x;
      const dy = bh.y - orb.pos.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 4) continue;
      const d = Math.sqrt(d2);
      const r = Math.max(d, bh.radius * 0.6);
      const a = bh.strength / (r * r);
      orb.vel.x += (dx / d) * a * dt;
      orb.vel.y += (dy / d) * a * dt;
    }

    // (3) Air drag (frame-rate independent exponential)
    const damp = Math.pow(1 - CFG.AIR_DRAG, dt * 60);
    orb.vel.x *= damp;
    orb.vel.y *= damp;

    // (4) Position update
    orb.pos.x += orb.vel.x * dt;
    orb.pos.y += orb.vel.y * dt;
  }

  /** Resolve a circle penetration along normal (nx,ny) with given depth. */
  function resolveCircleCollision(orb, nx, ny, pen, restitution) {
    // Positional correction so the orb is no longer overlapping.
    orb.pos.x += nx * pen;
    orb.pos.y += ny * pen;
    // Reflect velocity along the normal with restitution coefficient.
    const vn = orb.vel.x * nx + orb.vel.y * ny;
    if (vn < 0) {
      const j = -(1 + restitution) * vn;

      orb.vel.x += j * nx;
      orb.vel.y += j * ny;
    }
  }

  /** Circle vs axis-aligned bounding box. Returns true on collision. */
  function circleVsAABB(orb, rect) {
    const cx = clamp(orb.pos.x, rect.x, rect.x + rect.w);
    const cy = clamp(orb.pos.y, rect.y, rect.y + rect.h);
    const dx = orb.pos.x - cx;
    const dy = orb.pos.y - cy;
    const d2 = dx * dx + dy * dy;
    const r = orb.radius;
    if (d2 > r * r) return false;
    let nx, ny, pen;
    if (d2 > 1e-6) {
      const d = Math.sqrt(d2);
      nx = dx / d; ny = dy / d;
      pen = r - d;
    } else {
      // Center is inside the rect — push out along the smallest axis.
      const lx = orb.pos.x - rect.x;
      const rx = (rect.x + rect.w) - orb.pos.x;
      const ty = orb.pos.y - rect.y;
      const by = (rect.y + rect.h) - orb.pos.y;
      const m = Math.min(lx, rx, ty, by);
      if (m === lx)      { nx = -1; ny = 0; pen = r + lx; }
      else if (m === rx) { nx =  1; ny = 0; pen = r + rx; }
      else if (m === ty) { nx = 0; ny = -1; pen = r + ty; }
      else               { nx = 0; ny =  1; pen = r + by; }
    }
    resolveCircleCollision(orb, nx, ny, pen, orb.restitution);
    return true;
  }

  /** Circle vs thickened segment (used for neon bumper barriers). */
  function circleVsSegment(orb, ax, ay, bx, by, thickness, restitution) {
    const ex = bx - ax;
    const ey = by - ay;
    const lenSq = ex * ex + ey * ey || 1;
    let t = ((orb.pos.x - ax) * ex + (orb.pos.y - ay) * ey) / lenSq;
    t = clamp(t, 0, 1);
    const cx = ax + ex * t;
    const cy = ay + ey * t;
    const dx = orb.pos.x - cx;
    const dy = orb.pos.y - cy;
    const d2 = dx * dx + dy * dy;
    const radius = orb.radius + thickness * 0.5;
    if (d2 > radius * radius) return false;
    const d = Math.sqrt(d2) || 0.0001;

    const nx = dx / d, ny = dy / d;
    const pen = radius - d;
    resolveCircleCollision(orb, nx, ny, pen, restitution);
    return true;
  }

  /* ================================================================
   * SECTION 6 — ENTITY FACTORIES
   * ================================================================
   * Plain-object factories. We never use class instances for level
   * geometry — the data is small, dense, and avoids prototype lookup
   * overhead in tight collision loops.
   * ================================================================ */
  function makeOrb(x, y) {
    return {
      pos: { x: x, y: y },
      vel: { x: 0, y: 0 },
      radius: CFG.ORB_RADIUS,
      mass: CFG.ORB_MASS,
      restitution: CFG.ORB_RESTITUTION,
      launched: false,
      alive: true,
      restTimer: 0,
      trailCooldown: 0,
    };
  }
  function makeWall(x, y, w, h)  { return { type: 'wall', x, y, w, h }; }
  function makeKill(x, y, w, h)  { return { type: 'kill', x, y, w, h }; }
  function makeBumper(ax, ay, bx, by) {
    return {
      type: 'bumper',
      ax, ay, bx, by,
      thickness: 8,
      restitution: CFG.BUMPER_RESTITUTION,
      flash: 0,
    };
  }
  function makeBlackHole(x, y, strength, radius) {
    return {
      type: 'blackhole',
      x, y, strength, radius,
      eventHorizon: radius * 0.42,
      phase: Math.random() * PI2,
    };
  }
  function makePortal(x, y) { return { x, y, radius: 38, phase: 0 }; }
  function makeVortex(x, y) { return { x, y, radius: 46, phase: 0 }; }

  /* ================================================================
   * SECTION 8 — AUDIO
   * ================================================================

   * Procedural WebAudio — no external samples needed. Lazy-init on
   * the first user gesture (mobile autoplay policy). Exposes an
   * explicit `freeze` hook used during ad playback so the audio
   * context is suspended while a CrazyGames ad is on screen.
   * ================================================================ */
  const Audio = (() => {
    let ctx = null;
    let master = null;
    let muted = false;
    let frozen = false;

    function ensure() {
      if (ctx) return ctx;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = CFG.AUDIO_GAIN;
        master.connect(ctx.destination);
      } catch (e) { ctx = null; }
      return ctx;
    }

    function tone(freq, dur, type, gain) {
      if (muted || frozen) return;
      const c = ensure(); if (!c) return;
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.value = 0;
      g.gain.linearRampToValueAtTime(gain || 0.6, c.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      o.connect(g).connect(master);
      o.start();
      o.stop(c.currentTime + dur + 0.02);
    }

    return {
      unlock()   { ensure(); if (ctx && ctx.state === 'suspended') ctx.resume(); },
      launch()   { tone(220, 0.18, 'sawtooth', 0.4); tone(440, 0.12, 'sine', 0.3); },
      bounce()   { tone(660, 0.08, 'square', 0.25); },
      bumper()   { tone(880, 0.10, 'triangle', 0.4); tone(1320, 0.06, 'sine', 0.3); },
      kill()     { tone(120, 0.40, 'sawtooth', 0.5); },
      victory()  {
        tone(660, 0.15, 'sine', 0.5);
        setTimeout(() => tone(880, 0.18, 'sine', 0.5), 120);
        setTimeout(() => tone(1320, 0.30, 'triangle', 0.5), 260);
      },
      click()    { tone(540, 0.05, 'square', 0.18); },

      setMuted(m){ muted = !!m; if (master) master.gain.value = muted ? 0 : CFG.AUDIO_GAIN; },
      freeze(f)  { frozen = !!f; if (ctx) { if (f) ctx.suspend(); else ctx.resume(); } },
      get isMuted() { return muted; },
    };
  })();

  /* ================================================================
   * SECTION 9 — INPUT
   * ================================================================
   * Unified pointer: touch-first with mouse fallback. We always call
   * preventDefault() to block iOS Safari rubber-banding and accidental
   * page reloads when the user swipes hard. Coordinates are converted
   * from CSS pixels to world units via the Viewport.cssToWorld helper.
   * ================================================================ */
  const Input = {
    down: false,
    sx: 0, sy: 0,        // anchor in world coords (where the drag started)
    x: 0,  y: 0,         // current pointer in world coords
    onAimStart: null,
    onAimMove: null,
    onAimEnd: null,
    bind(canvas, viewport) {
      const toWorld = (cx, cy) => {
        const r = canvas.getBoundingClientRect();
        return viewport.cssToWorld(cx - r.left, cy - r.top);
      };
      const onDown = (e) => {
        e.preventDefault();
        const t = e.touches ? e.touches[0] : e;
        const w = toWorld(t.clientX, t.clientY);
        Input.down = true;
        Input.sx = w.x; Input.sy = w.y;
        Input.x  = w.x; Input.y  = w.y;
        Audio.unlock();
        if (Input.onAimStart) Input.onAimStart(w.x, w.y);
      };
      const onMove = (e) => {
        if (!Input.down) return;
        e.preventDefault();
        const t = e.touches ? e.touches[0] : e;
        const w = toWorld(t.clientX, t.clientY);
        Input.x = w.x; Input.y = w.y;
        if (Input.onAimMove) Input.onAimMove(w.x, w.y);
      };
      const onUp = (e) => {
        if (!Input.down) return;
        e.preventDefault();
        Input.down = false;
        if (Input.onAimEnd) Input.onAimEnd(Input.x, Input.y);
      };
      // Touch (priority on mobile)
      canvas.addEventListener('touchstart',  onDown, { passive: false });
      canvas.addEventListener('touchmove',   onMove, { passive: false });

      canvas.addEventListener('touchend',    onUp,   { passive: false });
      canvas.addEventListener('touchcancel', onUp,   { passive: false });
      // Mouse fallback for desktop
      canvas.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup',   onUp);
      // Suppress browser gesture defaults that would otherwise zoom or
      // navigate the page on mobile.
      window.addEventListener('gesturestart', (e) => e.preventDefault());
      window.addEventListener('contextmenu',  (e) => e.preventDefault());
    },
  };

  /* ================================================================
   * SECTION 10 — VIEWPORT (DPR + LETTERBOX + CAMERA SHAKE)
   * ================================================================
   * Recalculates the canvas backing-store size on resize so output
   * is sharp on Retina/AMOLED screens. Then computes a single fit
   * scale + offset to letterbox the virtual world inside the actual
   * viewport. Camera shake is injected in `apply` as an additional
   * translation, decaying every frame.
   * ================================================================ */
  const Viewport = {
    canvas: null,
    ctx: null,
    cssW: 0, cssH: 0,
    scale: 1, offX: 0, offY: 0,
    dpr: 1,
    shakeX: 0, shakeY: 0, shakeMag: 0,
    attach(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      this.resize();
      window.addEventListener('resize',         () => this.resize(), { passive: true });
      window.addEventListener('orientationchange', () => this.resize(), { passive: true });
    },
    resize() {
      // Cap DPR at 3 to keep memory in check on very high-density panels.
      const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
      const cssW = window.innerWidth;
      const cssH = window.innerHeight;
      this.cssW = cssW; this.cssH = cssH; this.dpr = dpr;
      this.canvas.width  = Math.round(cssW * dpr);
      this.canvas.height = Math.round(cssH * dpr);
      this.canvas.style.width  = cssW + 'px';
      this.canvas.style.height = cssH + 'px';
      // Fit world inside viewport with letterboxing.
      const sx = cssW / CFG.WORLD_W;
      const sy = cssH / CFG.WORLD_H;
      this.scale = Math.min(sx, sy);
      this.offX = (cssW - CFG.WORLD_W * this.scale) * 0.5;
      this.offY = (cssH - CFG.WORLD_H * this.scale) * 0.5;

    },
    addShake(mag) { if (mag > this.shakeMag) this.shakeMag = mag; },
    updateShake(dt) {
      if (this.shakeMag > 0.01) {
        const a = Math.random() * PI2;
        this.shakeX = Math.cos(a) * this.shakeMag;
        this.shakeY = Math.sin(a) * this.shakeMag;
        this.shakeMag *= Math.max(0, 1 - CFG.SHAKE_DECAY * dt);
      } else {
        this.shakeX = this.shakeY = 0;
        this.shakeMag = 0;
      }
    },
    apply(ctx) {
      // Reset transform stack and apply DPR + letterbox + world scale
      // in a single setTransform call (faster than save/restore).
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.fillStyle = COL.BG;
      ctx.fillRect(0, 0, this.cssW, this.cssH);
      ctx.translate(this.offX + this.shakeX, this.offY + this.shakeY);
      ctx.scale(this.scale, this.scale);
    },
    cssToWorld(cssX, cssY) {
      // Note: this allocates a fresh small object on every pointer
      // event. Pointer events are infrequent (vs frame loops) so
      // this is acceptable and simpler than thread-stable pooling.
      return {
        x: (cssX - this.offX) / this.scale,
        y: (cssY - this.offY) / this.scale,
      };
    },
  };

  /* ================================================================
   * SECTION 11 — STARFIELD CACHE
   * ================================================================
   * Drawn once into an offscreen canvas, then blitted as a single
   * drawImage call per frame. This keeps the static background out
   * of the per-frame allocation budget entirely.
   * ================================================================ */
  const Stars = (() => {
    let canvas = null;
    function build() {
      canvas = document.createElement('canvas');
      canvas.width = CFG.WORLD_W;
      canvas.height = CFG.WORLD_H;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = COL.BG;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // Faint grid (8x grid spacing, single Path2D).
      ctx.strokeStyle = COL.GRID;

      ctx.lineWidth = 1;
      const gs = 80;
      ctx.beginPath();
      for (let x = 0; x <= CFG.WORLD_W; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, CFG.WORLD_H); }
      for (let y = 0; y <= CFG.WORLD_H; y += gs) { ctx.moveTo(0, y); ctx.lineTo(CFG.WORLD_W, y); }
      ctx.stroke();
      // Stars (mostly 1x1, occasional 2x2 for parallax depth).
      for (let i = 0; i < 220; i++) {
        ctx.fillStyle = COL.STAR;
        const x = Math.random() * CFG.WORLD_W;
        const y = Math.random() * CFG.WORLD_H;
        const s = Math.random() < 0.85 ? 1 : 2;
        ctx.fillRect(x, y, s, s);
      }
    }
    return { get image() { if (!canvas) build(); return canvas; } };
  })();

  /* ================================================================
   * SECTION 12 — RENDERER
   * ================================================================
   * Single-pass renderer. Drawing order:
   *   (a) Cached starfield blit
   *   (b) Walls (filled + neon edge)
   *   (c) Kill zones (hatched red hazards)
   *   (d) Bumpers (line segment with flash boost)
   *   (e) Black holes (rings + core + swirl)
   *   (f) Portal & vortex (animated rings)
   *   (g) Trajectory dots (during aim)
   *   (h) Particles
   *   (i) Orb
   *   (j) Vignette
   * ================================================================ */
  const Renderer = {
    drawFrame(ctx, game) {
      Viewport.apply(ctx);
      ctx.drawImage(Stars.image, 0, 0);

      const lvl = game.level;
      if (!lvl) { return; }

      // ---- Walls ----
      for (let i = 0; i < lvl.walls.length; i++) {
        const w = lvl.walls[i];
        ctx.fillStyle = COL.WALL_FILL;
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeStyle = COL.WALL_EDGE;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 18;
        ctx.shadowColor = COL.WALL_EDGE;
        ctx.strokeRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);
        ctx.shadowBlur = 0;
      }


      // ---- Kill zones ----
      for (let i = 0; i < lvl.kills.length; i++) {
        const k = lvl.kills[i];
        ctx.fillStyle = 'rgba(255,58,58,0.15)';
        ctx.fillRect(k.x, k.y, k.w, k.h);
        ctx.strokeStyle = COL.KILL;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 16;
        ctx.shadowColor = COL.KILL;
        // Diagonal hazard hatching
        const stripeGap = 18;
        ctx.beginPath();
        for (let s = -k.h; s < k.w; s += stripeGap) {
          ctx.moveTo(k.x + s, k.y + k.h);
          ctx.lineTo(k.x + s + k.h, k.y);
        }
        ctx.stroke();
        ctx.strokeRect(k.x, k.y, k.w, k.h);
        ctx.shadowBlur = 0;
      }

      // ---- Bumpers ----
      for (let i = 0; i < lvl.bumpers.length; i++) {
        const b = lvl.bumpers[i];
        const flashBoost = b.flash * 22;
        ctx.strokeStyle = COL.BUMPER;
        ctx.lineCap = 'round';
        ctx.lineWidth = b.thickness + flashBoost * 0.2;
        ctx.shadowBlur = 22 + flashBoost;
        ctx.shadowColor = COL.BUMPER;
        ctx.beginPath();
        ctx.moveTo(b.ax, b.ay);
        ctx.lineTo(b.bx, b.by);
        ctx.stroke();
        ctx.shadowBlur = 0;
        if (b.flash > 0) b.flash = Math.max(0, b.flash - 0.06);
      }

      // ---- Black holes ----
      for (let i = 0; i < lvl.blackholes.length; i++) {
        const bh = lvl.blackholes[i];
        ctx.strokeStyle = COL.BLACKHOLE_RING;
        ctx.lineWidth = 3;
        ctx.shadowBlur = 26;
        ctx.shadowColor = COL.BLACKHOLE_RING;
        ctx.beginPath();
        ctx.arc(bh.x, bh.y, bh.radius, 0, PI2);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Inner core (event horizon)
        ctx.fillStyle = COL.BLACKHOLE;
        ctx.beginPath();
        ctx.arc(bh.x, bh.y, bh.radius * 0.62, 0, PI2);
        ctx.fill();
        // Accretion swirl
        ctx.strokeStyle = 'rgba(155,89,255,0.45)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let k = 0; k < 3; k++) {
          const r  = bh.radius * (0.78 + k * 0.06);
          const a0 = bh.phase + k * 0.7;
          ctx.moveTo(bh.x + Math.cos(a0) * r, bh.y + Math.sin(a0) * r);
          ctx.arc(bh.x, bh.y, r, a0, a0 + 1.2);
        }
        ctx.stroke();
      }

      // ---- Portal ----
      const p = lvl.portal;
      ctx.strokeStyle = COL.PORTAL;
      ctx.lineWidth = 2.5;
      ctx.shadowBlur = 22;
      ctx.shadowColor = COL.PORTAL;
      for (let r = 0; r < 3; r++) {
        ctx.globalAlpha = 0.7 - r * 0.2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius - r * 6 + Math.sin(p.phase + r) * 1.6, 0, PI2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      // ---- Vortex ----
      const v = lvl.vortex;
      ctx.strokeStyle = COL.VORTEX;
      ctx.lineWidth = 3;
      ctx.shadowBlur = 28;
      ctx.shadowColor = COL.VORTEX;
      ctx.beginPath();
      ctx.arc(v.x, v.y, v.radius, 0, PI2);
      ctx.stroke();
      ctx.lineWidth = 1.5;
      for (let r = 1; r <= 3; r++) {
        ctx.globalAlpha = 0.55 - r * 0.12;
        ctx.beginPath();
        ctx.arc(v.x, v.y, v.radius - r * 7 + Math.sin(v.phase * 1.4 + r) * 2, 0, PI2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      ctx.shadowBlur = 0;

      // ---- Trajectory dots (slingshot prediction) ----
      if (game.aim.active && !game.orb.launched) {
        const traj = game.aim.trajectory;
        ctx.fillStyle = COL.AIM;
        for (let i = 0; i < traj.length; i++) {
          const t = traj[i];
          ctx.globalAlpha = clamp(1 - i / traj.length, 0.05, 1);
          ctx.beginPath();
          ctx.arc(t.x, t.y, 3, 0, PI2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        // Slingshot direction line
        const o = game.orb;
        ctx.strokeStyle = COL.AIM;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.shadowBlur = 14;
        ctx.shadowColor = COL.AIM;
        ctx.beginPath();
        ctx.moveTo(o.pos.x, o.pos.y);
        ctx.lineTo(o.pos.x + game.aim.dx, o.pos.y + game.aim.dy);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.shadowBlur = 0;
      }

      // ---- Particles ----
      renderParticles(ctx);

      // ---- Orb ----
      if (game.orb.alive) {
        const o = game.orb;
        ctx.fillStyle = COL.ORB;
        ctx.shadowBlur = 28;
        ctx.shadowColor = COL.ORB_GLOW;
        ctx.beginPath();
        ctx.arc(o.pos.x, o.pos.y, o.radius, 0, PI2);
        ctx.fill();
        ctx.shadowBlur = 0;
        // Inner highlight gives the orb depth.
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(o.pos.x - o.radius * 0.3, o.pos.y - o.radius * 0.3,
                o.radius * 0.3, 0, PI2);
        ctx.fill();
      }
    },
  };


  /* ================================================================
   * SECTION 13 — UI / HUD BRIDGE
   * ================================================================
   * Thin layer over the DOM overlay. We only mutate textContent and
   * a single class for show/hide — no innerHTML rewrites in hot paths
   * to avoid layout thrash during gameplay.
   * ================================================================ */
  const UI = {
    panels: {},
    hud: null,
    hudLevel: null,
    hudShots: null,
    toast: null,
    adScrim: null,
    _toastTimer: 0,
    init() {
      this.panels.menu     = document.getElementById('panel-menu');
      this.panels.levels   = document.getElementById('panel-levels');
      this.panels.pause    = document.getElementById('panel-pause');
      this.panels.gameover = document.getElementById('panel-gameover');
      this.panels.victory  = document.getElementById('panel-victory');
      this.hud      = document.getElementById('hud');
      this.hudLevel = document.getElementById('hud-level');
      this.hudShots = document.getElementById('hud-shots');
      this.toast    = document.getElementById('toast');
      this.adScrim  = document.getElementById('ad-scrim');
    },
    show(name) {
      for (const k in this.panels) {
        this.panels[k].classList.toggle('hidden', k !== name);
      }
    },
    hideAll() { for (const k in this.panels) this.panels[k].classList.add('hidden'); },
    hudVisible(v) { this.hud.classList.toggle('hidden', !v); },
    setLevel(n) { this.hudLevel.textContent = 'LV ' + String(n + 1).padStart(2, '0'); },
    setShots(n) { this.hudShots.textContent = 'SHOTS ' + String(n).padStart(2, '0'); },
    setVictoryStats(level, shots, best) {
      const el = document.getElementById('victory-stats');
      if (!el) return;
      const bestStr = (best != null) ? ' • BEST ' + String(best).padStart(2,'0') : '';
      el.textContent = 'LV ' + String(level + 1).padStart(2,'0') +
                       ' • SHOTS ' + String(shots).padStart(2,'0') + bestStr;
    },
    flash(msg, ms) {
      this.toast.textContent = msg;
      this.toast.classList.add('show');
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(
        () => this.toast.classList.remove('show'), ms || 1300);
    },
    showAdScrim(v) { this.adScrim.classList.toggle('show', !!v); },

    buildLevelGrid(unlocked, bestPerLevel, onSelect) {
      const grid = document.getElementById('levels-grid');
      grid.innerHTML = '';
      for (let i = 0; i < LEVELS.length; i++) {
        const tile = document.createElement('div');
        const locked = i > unlocked;
        tile.className = 'level-tile' + (locked ? ' locked' : '');
        const num = document.createElement('span');
        num.textContent = String(i + 1).padStart(2, '0');
        tile.appendChild(num);
        const best = bestPerLevel && bestPerLevel[i];
        if (best && !locked) {
          const tag = document.createElement('span');
          tag.className = 'best';
          tag.textContent = 'B ' + String(best).padStart(2, '0');
          tile.appendChild(tag);
        }
        if (!locked) tile.addEventListener('click', () => onSelect(i));
        grid.appendChild(tile);
      }
    },
  };

  /* ================================================================
   * SECTION 14 — CRAZYGAMES SDK v3 INTEGRATION
   * ================================================================
   * Defensive skeleton. If the SDK is not loaded the shims are
   * no-ops so the game runs anywhere unchanged. Hooks used:
   *   sdk.game.gameplayStart()   — entering PLAYING fresh
   *   sdk.game.gameplayStop()    — leaving PLAYING
   *   sdk.game.happytime()       — on victory
   *   sdk.ad.requestAd('midgame')— between levels / on restart
   * Audio + physics are explicitly frozen during ad callbacks.
   * ================================================================ */
  const SDK = (() => {
    let sdk = null;
    let inited = false;
    let lastAd = 0;
    function tryGet() {
      if (window.CrazyGames && window.CrazyGames.SDK) return window.CrazyGames.SDK;
      return null;
    }
    async function init() {
      if (inited) return;
      inited = true;
      sdk = tryGet();
      if (!sdk) return;
      try { if (typeof sdk.init === 'function') await sdk.init(); } catch (e) {}
    }
    function gameplayStart() { try { sdk?.game?.gameplayStart?.(); } catch (e) {} }
    function gameplayStop()  { try { sdk?.game?.gameplayStop?.();  } catch (e) {} }

    function happytime()     { try { sdk?.game?.happytime?.();     } catch (e) {} }
    function requestMidgameAd(onStart, onComplete) {
      const now = Date.now();
      // No SDK or in cooldown → fast-path complete
      if (!sdk || !sdk.ad || typeof sdk.ad.requestAd !== 'function') {
        onComplete && onComplete(); return;
      }
      if (now - lastAd < CFG.AD_COOLDOWN_MS) {
        onComplete && onComplete(); return;
      }
      lastAd = now;
      const callbacks = {
        adStarted:  () => { onStart    && onStart(); },
        adFinished: () => { onComplete && onComplete(); },
        adError:    () => { onComplete && onComplete(); },
      };
      try {
        const r = sdk.ad.requestAd('midgame', callbacks);
        // Some SDK versions return a Promise instead of using callbacks.
        if (r && typeof r.then === 'function') {
          onStart && onStart();
          r.then(() => onComplete && onComplete())
           .catch(() => onComplete && onComplete());
        }
      } catch (e) { onComplete && onComplete(); }
    }
    return { init, gameplayStart, gameplayStop, happytime, requestMidgameAd };
  })();

  /* ================================================================
   * SECTION 15 — PERSISTENCE
   * ================================================================
   * Tiny localStorage wrapper for unlock progress and per-level best
   * shots. Failure is swallowed — saves are best-effort, never block.
   * ================================================================ */
  const Save = {
    KEY: 'neoGravity.save.v1',
    data: { unlocked: 0, best: {} },
    load() {
      try {
        const raw = localStorage.getItem(this.KEY);
        if (!raw) return;
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') {
          this.data.unlocked = clamp(obj.unlocked|0, 0, LEVELS.length - 1);
          this.data.best = obj.best && typeof obj.best === 'object' ? obj.best : {};
        }
      } catch (e) { /* ignore */ }
    },
    persist() {
      try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {}
    },

    recordVictory(levelIndex, shots) {
      if (levelIndex + 1 < LEVELS.length && this.data.unlocked < levelIndex + 1) {
        this.data.unlocked = levelIndex + 1;
      }
      const cur = this.data.best[levelIndex];
      if (cur == null || shots < cur) this.data.best[levelIndex] = shots;
      this.persist();
    },
  };

  /* ================================================================
   * SECTION 16 — GAME CORE
   * ================================================================
   * Owns the state machine, the fixed-timestep accumulator, the
   * per-attempt level instance, and the orchestration of audio/SDK
   * during transitions.
   *
   * State transitions:
   *   MENU         ─Play/LevelSelect→ LEVEL_SELECT ─tile→ PLAYING
   *   PLAYING      ─pause→ PAUSED ─resume→ PLAYING
   *   PLAYING      ─orb dies→ GAME_OVER ─retry→ PLAYING (with ad)
   *   PLAYING      ─vortex→ VICTORY ─next→ PLAYING (with ad)
   *   any panel    ─quit→ MENU
   * ================================================================ */
  const Game = {
    state: STATE.BOOT,
    prevState: null,
    levelIndex: 0,
    level: null,
    orb: null,
    shots: 0,
    frozen: false,           // hard freeze during ad playback
    aim: {
      active: false,
      dx: 0, dy: 0,
      trajectory: [],
      _buffer: null,         // pre-allocated trajectory points
    },
    _accum: 0,
    _last: 0,

    init() {
      // Pre-allocate trajectory buffer (no allocation in the aim loop).
      const buf = new Array(CFG.AIM_LOOKAHEAD_STEPS);
      for (let i = 0; i < CFG.AIM_LOOKAHEAD_STEPS; i++) buf[i] = { x: 0, y: 0 };
      this.aim._buffer = buf;
      this.aim.trajectory = [];

      // Persistence
      Save.load();

      // UI
      UI.init();
      this.bindUI();


      // Canvas + viewport
      const canvas = document.getElementById('game');
      Viewport.attach(canvas);

      // Input
      Input.bind(canvas, Viewport);
      Input.onAimStart = (x, y) => this.onAimStart(x, y);
      Input.onAimMove  = (x, y) => this.onAimMove(x, y);
      Input.onAimEnd   = (x, y) => this.onAimEnd(x, y);

      // Visibility → auto-pause to save battery & avoid runaway accum.
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && this.state === STATE.PLAYING) {
          this.setState(STATE.PAUSED);
        }
      });

      // Keyboard shortcuts (desktop QoL)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') { if (this.state === STATE.PLAYING) this.restartLevel(); }
        else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
          if (this.state === STATE.PLAYING) this.setState(STATE.PAUSED);
          else if (this.state === STATE.PAUSED) this.setState(STATE.PLAYING);
        } else if (e.key === 'm' || e.key === 'M') {
          Audio.setMuted(!Audio.isMuted);
          UI.flash(Audio.isMuted ? 'AUDIO MUTED' : 'AUDIO ON', 900);
        }
      });

      // Boot SDK (async, non-blocking)
      SDK.init();

      // Start at menu
      this.setState(STATE.MENU);

      // Begin loop
      this._last = performance.now();
      const loop = (t) => {
        const now = t;
        let dt = (now - this._last) / 1000;
        this._last = now;
        if (dt > CFG.MAX_ACCUM) dt = CFG.MAX_ACCUM;
        if (!this.frozen) this.update(dt);
        Viewport.updateShake(dt);
        this.render();
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    },


    /* ----- UI bindings (one-time at boot) ----- */
    bindUI() {
      const $ = (id) => document.getElementById(id);
      const click = (id, fn) => { const el = $(id); if (el) el.onclick = (e) => { e.preventDefault(); Audio.unlock(); Audio.click(); fn(); }; };
      click('btn-play',         () => this.startLevel(0));
      click('btn-levels',       () => {
        UI.buildLevelGrid(Save.data.unlocked, Save.data.best, (i) => this.startLevel(i));
        this.setState(STATE.LEVEL_SELECT);
      });
      click('btn-back-menu',    () => this.setState(STATE.MENU));
      click('btn-pause',        () => { if (this.state === STATE.PLAYING) this.setState(STATE.PAUSED); });
      click('btn-restart',      () => this.restartLevel());
      click('btn-resume',       () => this.setState(STATE.PLAYING));
      click('btn-restart-pause',() => this.restartLevel());
      click('btn-quit',         () => this.setState(STATE.MENU));
      click('btn-retry',        () => this.restartLevel());
      click('btn-quit-go',      () => this.setState(STATE.MENU));
      click('btn-next',         () => {
        const next = this.levelIndex + 1;
        if (next >= LEVELS.length) {
          UI.flash('All sectors cleared', 1600);
          this.setState(STATE.MENU);
          return;
        }
        this.requestAdAndThen(() => this.startLevel(next));
      });
      click('btn-quit-vic',     () => this.setState(STATE.MENU));
      click('btn-mute',         () => {
        Audio.setMuted(!Audio.isMuted);
        UI.flash(Audio.isMuted ? 'AUDIO MUTED' : 'AUDIO ON', 900);
      });
    },

    /* ----- Ad gating helper ----- */
    requestAdAndThen(fn) {
      this.frozen = true;
      Audio.freeze(true);
      UI.showAdScrim(true);
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        Audio.freeze(false);
        this.frozen = false;
        UI.showAdScrim(false);
        fn && fn();
      };
      SDK.requestMidgameAd(() => {/* started */}, finish);
      // Safety timeout — if the SDK silently fails, never strand the player.
      setTimeout(finish, 6000);
    },


    /* ----- State transitions ----- */
    setState(next) {
      if (this.state === next) return;
      this.prevState = this.state;
      // onExit hooks
      if (this.state === STATE.PLAYING && next !== STATE.PAUSED) SDK.gameplayStop();
      // transition
      this.state = next;
      // onEnter hooks
      switch (next) {
        case STATE.MENU:
          UI.show('menu'); UI.hudVisible(false); break;
        case STATE.LEVEL_SELECT:
          UI.show('levels'); UI.hudVisible(false); break;
        case STATE.PLAYING:
          UI.hideAll(); UI.hudVisible(true); SDK.gameplayStart(); break;
        case STATE.PAUSED:
          UI.show('pause'); break;
        case STATE.GAME_OVER:
          UI.show('gameover'); break;
        case STATE.VICTORY:
          {
            const best = Save.data.best[this.levelIndex];
            UI.setVictoryStats(this.levelIndex, this.shots, best);
          }
          UI.show('victory');
          SDK.happytime();
          break;
      }
    },

    /* ----- Level lifecycle ----- */
    startLevel(index) {
      this.levelIndex = clamp(index, 0, LEVELS.length - 1);
      const src = LEVELS[this.levelIndex];
      // Deep-clone mutable parts so per-attempt fields can't leak.
      this.level = {
        name: src.name,
        portal: makePortal(src.portal.x, src.portal.y),
        vortex: makeVortex(src.vortex.x, src.vortex.y),
        walls:   src.walls.map(w => ({ ...w })),
        bumpers: src.bumpers.map(b => ({ ...b, flash: 0 })),
        blackholes: src.blackholes.map(b => ({ ...b, phase: Math.random() * PI2 })),
        kills:   src.kills.map(k => ({ ...k })),
      };
      this.orb = makeOrb(this.level.portal.x, this.level.portal.y);
      this.shots = 0;
      this.aim.active = false;
      this.aim.dx = 0; this.aim.dy = 0;
      this.aim.trajectory = [];
      particlePool.releaseAll();

      Viewport.shakeMag = 0;
      UI.setLevel(this.levelIndex);
      UI.setShots(0);
      this.setState(STATE.PLAYING);
      UI.flash(
        'SECTOR ' + String(this.levelIndex + 1).padStart(2,'0') +
        ' • ' + this.level.name, 1500);
    },

    restartLevel() {
      // Restart triggers an ad slot (subject to cooldown).
      this.requestAdAndThen(() => this.startLevel(this.levelIndex));
    },

    /* ----- Aim / Launch ----- */
    onAimStart(x, y) {
      if (this.state !== STATE.PLAYING) return;
      if (!this.orb || !this.orb.alive) return;
      if (this.orb.launched) return;
      this.aim.active = true;
      this.aim.dx = 0; this.aim.dy = 0;
    },
    onAimMove(x, y) {
      if (!this.aim.active) return;
      // Slingshot: pull-direction is from pointer back to orb.
      const o = this.orb;
      let dx = o.pos.x - x;
      let dy = o.pos.y - y;
      const m = Math.sqrt(dx * dx + dy * dy);
      const maxDrag = 280;
      if (m > maxDrag) { dx = (dx / m) * maxDrag; dy = (dy / m) * maxDrag; }
      this.aim.dx = dx; this.aim.dy = dy;
      this.computeTrajectory();
    },
    onAimEnd(x, y) {
      if (!this.aim.active) return;
      this.aim.active = false;
      const m = Math.sqrt(this.aim.dx * this.aim.dx + this.aim.dy * this.aim.dy);
      if (m < CFG.MIN_LAUNCH_DRAG) { this.aim.trajectory = []; return; }
      const speed = clamp(m * CFG.LAUNCH_DRAG_SCALE, 0, CFG.MAX_LAUNCH_SPEED);
      const inv = 1 / m;
      this.orb.vel.x = this.aim.dx * inv * speed;
      this.orb.vel.y = this.aim.dy * inv * speed;
      this.orb.launched = true;
      this.shots++;
      UI.setShots(this.shots);
      Audio.launch();
      this.aim.trajectory = [];
    },

    /* ----- Trajectory pre-simulation (look-ahead) ----- */

    computeTrajectory() {
      const buf = this.aim._buffer;
      const sx = this.orb.pos.x, sy = this.orb.pos.y;
      const m = Math.sqrt(this.aim.dx * this.aim.dx + this.aim.dy * this.aim.dy);
      const speed = clamp(m * CFG.LAUNCH_DRAG_SCALE, 0, CFG.MAX_LAUNCH_SPEED);
      let vx = 0, vy = 0;
      if (m > 0) {
        const inv = 1 / m;
        vx = this.aim.dx * inv * speed;
        vy = this.aim.dy * inv * speed;
      }
      let px = sx, py = sy;
      const dt = CFG.AIM_LOOKAHEAD_DT;
      const steps = CFG.AIM_LOOKAHEAD_STEPS;
      const blackholes = this.level.blackholes;
      const drag = Math.pow(1 - CFG.AIR_DRAG, dt * 60);
      const traj = this.aim.trajectory;
      traj.length = 0;
      for (let i = 0; i < steps; i++) {
        // Gravity
        vy += CFG.GRAVITY_Y * dt;
        // Black holes
        for (let k = 0; k < blackholes.length; k++) {
          const bh = blackholes[k];
          const dx2 = bh.x - px, dy2 = bh.y - py;
          const d2 = dx2 * dx2 + dy2 * dy2;
          if (d2 < 4) continue;
          const d = Math.sqrt(d2);
          const r = Math.max(d, bh.radius * 0.6);
          const a = bh.strength / (r * r);
          vx += (dx2 / d) * a * dt;
          vy += (dy2 / d) * a * dt;
        }
        vx *= drag; vy *= drag;
        px += vx * dt; py += vy * dt;
        if (i % CFG.AIM_DOT_SPACING === 0) {
          buf[i].x = px; buf[i].y = py;
          traj.push(buf[i]);
        }
        // Stop the prediction at world boundary
        if (px < 0 || py < 0 || px > CFG.WORLD_W || py > CFG.WORLD_H) break;
      }
    },

    /* ----- Per-frame update ----- */
    update(dt) {
      // Animate ambient ring/swirl phases regardless of state so the
      // menu still feels alive when the player is looking at it.
      if (this.level) {
        this.level.portal.phase += dt * 1.6;
        this.level.vortex.phase += dt * 2.0;

        for (let i = 0; i < this.level.blackholes.length; i++) {
          this.level.blackholes[i].phase += dt * 0.9;
        }
      }
      // Particles always tick (even on game-over panel, for the death
      // burst to play out under the overlay).
      updateParticles(dt);

      if (this.state !== STATE.PLAYING) return;

      // Fixed-timestep accumulator decouples physics from frame rate.
      this._accum += dt;
      if (this._accum > CFG.MAX_ACCUM) this._accum = CFG.MAX_ACCUM;
      const step = CFG.FIXED_DT;
      let safety = 8;
      while (this._accum >= step && safety-- > 0) {
        this.fixedStep(step);
        this._accum -= step;
      }

      // Live-recompute trajectory while dragging so it stays accurate
      // even though the orb itself does not move during aim.
      if (this.aim.active && !this.orb.launched) this.computeTrajectory();
    },

    /* ----- Fixed-timestep physics step ----- */
    fixedStep(dt) {
      const orb = this.orb;
      if (!orb || !orb.alive) return;
      if (!orb.launched) return;

      // Black-hole event horizon → instant death (orb is consumed).
      for (let i = 0; i < this.level.blackholes.length; i++) {
        const bh = this.level.blackholes[i];
        const dx = bh.x - orb.pos.x;
        const dy = bh.y - orb.pos.y;
        if (dx * dx + dy * dy < bh.eventHorizon * bh.eventHorizon) {
          this.killOrb(orb.pos.x, orb.pos.y);
          return;
        }
      }

      // Integrate kinematics
      integrateOrb(orb, this.level.blackholes, dt);

      // Trail emission
      orb.trailCooldown -= dt;
      if (orb.trailCooldown <= 0) {
        emitTrail(orb.pos.x, orb.pos.y, orb.vel.x, orb.vel.y, COL.ORB);
        orb.trailCooldown = 0.02;
      }


      const lvl = this.level;

      // Wall collisions
      for (let i = 0; i < lvl.walls.length; i++) {
        if (circleVsAABB(orb, lvl.walls[i])) {
          Audio.bounce();
          Viewport.addShake(2);
        }
      }

      // Bumper collisions (with flash + boost + particles)
      for (let i = 0; i < lvl.bumpers.length; i++) {
        const b = lvl.bumpers[i];
        if (circleVsSegment(orb, b.ax, b.ay, b.bx, b.by, b.thickness, b.restitution)) {
          b.flash = 1;
          Audio.bumper();
          Viewport.addShake(5);
          emitBurst(orb.pos.x, orb.pos.y, COL.BUMPER, 12, 240, [1.2, 2.6], [0.25, 0.55]);
        }
      }

      // Kill zones (cheap circle-vs-AABB overlap test)
      for (let i = 0; i < lvl.kills.length; i++) {
        const k = lvl.kills[i];
        const cx = clamp(orb.pos.x, k.x, k.x + k.w);
        const cy = clamp(orb.pos.y, k.y, k.y + k.h);
        const dx = orb.pos.x - cx, dy = orb.pos.y - cy;
        if (dx * dx + dy * dy <= orb.radius * orb.radius) {
          this.killOrb(orb.pos.x, orb.pos.y);
          return;
        }
      }

      // Vortex (victory) — stricter than rendered radius for fairness.
      const v = lvl.vortex;
      const dvx = v.x - orb.pos.x, dvy = v.y - orb.pos.y;
      if (dvx * dvx + dvy * dvy <= (v.radius - 4) * (v.radius - 4)) {
        this.victory();
        return;
      }

      // Out-of-bounds safety net
      if (orb.pos.y > CFG.WORLD_H + 200 ||
          orb.pos.x < -200 || orb.pos.x > CFG.WORLD_W + 200) {
        this.killOrb(orb.pos.x, clamp(orb.pos.y, 0, CFG.WORLD_H));
        return;
      }

      // Rest detection — if the orb is barely moving for too long,
      // we fail the attempt rather than let the player wait forever.
      const speed2 = orb.vel.x * orb.vel.x + orb.vel.y * orb.vel.y;

      if (speed2 < CFG.MIN_REST_SPEED * CFG.MIN_REST_SPEED) {
        orb.restTimer += dt;
        if (orb.restTimer >= CFG.REST_TIME) {
          this.killOrb(orb.pos.x, orb.pos.y);
          return;
        }
      } else {
        orb.restTimer = 0;
      }
    },

    /* ----- Result transitions ----- */
    killOrb(x, y) {
      if (!this.orb || !this.orb.alive) return;
      this.orb.alive = false;
      emitBurst(x, y, COL.KILL, 40, 360, [1.4, 3.4], [0.4, 1.0]);
      Audio.kill();
      Viewport.addShake(12);
      // Brief delay so the burst is visible before the panel covers it.
      setTimeout(() => {
        if (this.state === STATE.PLAYING) this.setState(STATE.GAME_OVER);
      }, 380);
    },

    victory() {
      if (!this.orb || !this.orb.alive) return;
      this.orb.alive = false;
      emitBurst(this.level.vortex.x, this.level.vortex.y,
                COL.VORTEX, 40, 420, [1.4, 3.6], [0.5, 1.1]);
      emitBurst(this.level.vortex.x, this.level.vortex.y,
                COL.ORB,    24, 280, [1.0, 2.4], [0.3, 0.8]);
      Audio.victory();
      Viewport.addShake(8);
      Save.recordVictory(this.levelIndex, this.shots);
      setTimeout(() => {
        if (this.state === STATE.PLAYING) this.setState(STATE.VICTORY);
      }, 480);
    },

    /* ----- Render dispatcher ----- */
    render() { Renderer.drawFrame(Viewport.ctx, this); },
  };

  /* ================================================================
   * SECTION 17 — BOOTSTRAP
   * ================================================================
   * Defer until DOM is ready so all overlay elements exist before we
   * wire up listeners.
   * ================================================================ */
  function boot() { Game.init(); }
  if (document.readyState === 'complete' || document.readyState === 'interactive') {

    setTimeout(boot, 0);
  } else {
    document.addEventListener('DOMContentLoaded', boot);
  }

  })();
  </script>
</body>
</html>
