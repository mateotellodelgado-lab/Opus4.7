<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Mía: La Mochila Robada</title>
<style>
:root{--bg-0:#0e0b1f;--bg-1:#1c1338;--accent:#ff4fa3;--accent-2:#6cf0ff;--text:#f4eefb;--muted:#b3a8d1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html,body{margin:0;padding:0;background:radial-gradient(ellipse at top,var(--bg-1),var(--bg-0) 60%);color:var(--text);font-family:"Inter","Segoe UI",system-ui,sans-serif;min-height:100vh;overflow:hidden;position:fixed;inset:0}
#app{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
#stage{position:relative;width:100%;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;max-height:62vh;border-radius:4px}
.overlay{position:absolute;inset:0;background:rgba(8,5,22,0.88);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:5;transition:opacity .25s ease;line-height:1.5;padding:16px}
.overlay.hidden{opacity:0;pointer-events:none}
.panel{max-width:420px;padding:20px;background:rgba(28,19,56,0.95);border:1px solid rgba(108,240,255,0.25);border-radius:12px;text-align:center;color:var(--text)}
.panel h2{margin:0 0 8px;font-size:20px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.panel p{margin:4px 0 12px;color:var(--muted);font-size:13px}
button{display:inline-block;padding:14px 28px;font-size:17px;font-weight:700;color:#0e0b1f;background:linear-gradient(90deg,var(--accent),var(--accent-2));border:0;border-radius:8px;cursor:pointer}
button:active{transform:translateY(2px)}
#touch-controls{position:fixed;bottom:0;left:0;right:0;height:36vh;display:none;z-index:10;pointer-events:none}
.touch-active #touch-controls{display:flex;justify-content:space-between;align-items:flex-end;padding:14px}
.touch-zone{pointer-events:auto;display:flex;gap:10px;align-items:flex-end}
.touch-btn{width:62px;height:62px;border-radius:50%;background:rgba(108,240,255,0.18);border:2px solid rgba(108,240,255,0.4);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;transition:background .08s,transform .05s;font-weight:bold}
.touch-btn:active,.touch-btn.active{background:rgba(255,79,163,0.5);border-color:var(--accent);transform:scale(0.92)}
.touch-btn.big{width:80px;height:80px;font-size:28px}
.touch-btn.sword{background:rgba(255,209,79,0.2);border-color:rgba(255,209,79,0.5);font-size:24px}
.touch-btn.sword:active,.touch-btn.sword.active{background:rgba(255,209,79,0.5);border-color:#ffd14f}
.touch-btn.note{background:rgba(108,240,255,0.18);border-color:rgba(108,240,255,0.5);font-size:20px}
#dpad{display:flex;gap:8px;align-items:center}
.action-stack{display:flex;flex-direction:column;gap:8px;align-items:center}
@media(hover:hover)and(pointer:fine){#touch-controls{display:none!important}}
</style>
</head>
<body>
<div id="app">
<div id="stage">
<canvas id="game" width="960" height="540"></canvas>
<div id="overlay" class="overlay">
<div class="panel">
<h2>Mía: La Mochila Robada</h2>
<p>Recupera tu mochila de diseños del Mapache Gigante Mutante.<br>4 mundos · espada · 3 enemigos únicos · jefe final</p>
<button id="startBtn" type="button">Comenzar aventura</button>
</div>
</div>
</div>
</div>

<div id="touch-controls">
<div class="touch-zone" id="dpad">
<div class="touch-btn" data-action="left">◀</div>
<div class="touch-btn" data-action="right">▶</div>
</div>
<div class="touch-zone">
<div class="action-stack">
<div class="touch-btn note" data-action="shoot">♪</div>
<div class="touch-btn sword" data-action="attack">⚔</div>
</div>
<div class="touch-btn big" data-action="jump">▲</div>
</div>
</div>

<script>
// ============================================================
// SINGLE-FILE: Mía: La Mochila Robada
// Espada · Canvas 960×540 · Controles táctiles · Screen shake
// ============================================================

// Sonidos sintetizados con Web Audio (sin assets externos, estilo retro).
// Inicialización perezosa porque los navegadores requieren un gesto del
// usuario antes de permitir audio.

let audioCtx = null;

function ensureCtx() {
  if (audioCtx) return audioCtx;
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return null;
  audioCtx = new Ctor();
  return audioCtx;
}

function unlockAudio() {
  const c = ensureCtx();
  if (c && c.state === 'suspended') c.resume();
}

function blip({ freq = 440, dur = 0.1, type = 'square', vol = 0.18, slide = 0 }) {
  const c = ensureCtx();
  if (!c) return;
  const t0 = c.currentTime;
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(c.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

const SFX = {
  jump:    () => blip({ freq: 520, dur: 0.12, type: 'square', slide: 280 }),
  coin:    () => { blip({ freq: 880, dur: 0.06, type: 'square' }); setTimeout(() => blip({ freq: 1320, dur: 0.1, type: 'square' }), 50); },
  stomp:   () => blip({ freq: 180, dur: 0.1, type: 'sawtooth', slide: -100 }),
  hit:     () => blip({ freq: 220, dur: 0.18, type: 'sawtooth', slide: -180 }),
  break:   () => blip({ freq: 320, dur: 0.12, type: 'triangle', slide: -200 }),
  power:   () => { blip({ freq: 440, dur: 0.08, type: 'square' }); setTimeout(() => blip({ freq: 660, dur: 0.08, type: 'square' }), 80); setTimeout(() => blip({ freq: 880, dur: 0.16, type: 'square' }), 160); },
  shoot:   () => blip({ freq: 720, dur: 0.08, type: 'triangle', slide: 220 }),
  death:   () => { blip({ freq: 440, dur: 0.18, type: 'square', slide: -380 }); setTimeout(() => blip({ freq: 220, dur: 0.3, type: 'sawtooth', slide: -180 }), 200); },
  goal:    () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => blip({ freq: f, dur: 0.12, type: 'square' }), i * 100)); },
  bossHit: () => blip({ freq: 110, dur: 0.2, type: 'sawtooth', slide: -50 }),
  win:     () => { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => blip({ freq: f, dur: 0.18, type: 'square', vol: 0.22 }), i * 140)); },
};
// Pixel-art programático: cada función pinta un sprite con fillRect.
// La rejilla está pensada en celdas de 2px sobre el canvas para un look retro.

function px(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

// ---------- Mía ----------

const PALETTE = {
  skin: '#ffd9b8',
  skinShade: '#e6b894',
  skinDark: '#c69675',
  blush: '#ff9eb5',
  hair: '#ffffff',
  hairShade: '#dfe5f2',
  hairDeep: '#b9c1d6',
  hoodie: '#ff4fa3',
  hoodieMid: '#e0357e',
  hoodieShade: '#a8276c',
  hoodieDark: '#6f1746',
  hoodieHighlight: '#ff85c5',
  jeans: '#3a6cd8',
  jeansShade: '#23499a',
  jeansDark: '#142d6a',
  jeansSeam: '#5a8df0',
  shoe: '#f4f4f4',
  shoeStripe: '#ff4fa3',
  shoeSole: '#1a1a1a',
  shoeShade: '#bdbdbd',
  eye: '#1d1338',
  eyeShine: '#ffffff',
  brow: '#3a2a55',
  mouth: '#a83b6b',
  headphones: '#ffd14f',
  headphonesPad: '#ff8a3b',
  swordBlade: '#cfd8ec',
  swordEdge: '#7c8eb5',
  swordHilt: '#4a3585',
  swordGuard: '#ffd14f',
  swordPommel: '#ff4fa3',
};

/**
 * Dibuja a Mía mirando a la derecha en una caja de tamaño w×h, usando
 * una rejilla 24×36 (mucho más detalle que la versión 16×24 anterior).
 */
function drawMia(ctx, x, y, w, h, opts = {}) {
  const facing = opts.facing ?? 1;
  const walk = opts.walkPhase ?? 0;
  const jumping = !!opts.isJumping;
  const falling = !!opts.isFalling;
  const hp = !!opts.hasHeadphones;
  const blink = !!opts.blink;
  const showSword = opts.showSword !== false; // por defecto sí
  const swinging = !!opts.swinging;
  const swingT = opts.swingT ?? 0; // 0..1 progreso del swing
  const stretchY = opts.stretchY ?? 1;
  const stretchX = opts.stretchX ?? 1;

  ctx.save();
  // Squash & stretch desde el pie
  const cx = x + w / 2;
  const baseY = y + h;
  ctx.translate(cx, baseY);
  ctx.scale(stretchX, stretchY);
  ctx.translate(-cx, -baseY);

  if (facing < 0) {
    ctx.translate(x + w, y);
    ctx.scale(-1, 1);
  } else {
    ctx.translate(x, y);
  }

  // Rejilla relativa 24×36 escalada a w×h.
  const sx = w / 24, sy = h / 36;
  const u = (cx, cy, cw, ch, color) =>
    px(ctx, cx * sx, cy * sy, cw * sx, ch * sy, color);

  // ---------- Cabello (parte trasera) ----------
  u(4, 1, 16, 5, PALETTE.hair);
  u(3, 2, 1, 7, PALETTE.hair);
  u(20, 2, 1, 7, PALETTE.hair);
  u(2, 4, 1, 5, PALETTE.hairShade);
  u(21, 4, 1, 5, PALETTE.hairShade);
  // Mechones laterales largos
  u(3, 9, 2, 5, PALETTE.hair);
  u(19, 9, 2, 5, PALETTE.hair);
  u(3, 13, 2, 1, PALETTE.hairShade);
  u(19, 13, 2, 1, PALETTE.hairShade);
  // Sombra superior del cabello
  u(5, 6, 14, 1, PALETTE.hairShade);
  // Highlight del cabello
  u(7, 2, 4, 1, PALETTE.hair);
  u(13, 3, 3, 1, '#ffffff');
  // Flequillo asimétrico
  u(6, 5, 8, 3, PALETTE.hair);
  u(7, 7, 4, 1, PALETTE.hairShade);
  u(13, 6, 5, 2, PALETTE.hair);
  u(13, 7, 4, 1, PALETTE.hairShade);

  // ---------- Cara ----------
  u(6, 7, 12, 7, PALETTE.skin);
  u(6, 13, 12, 1, PALETTE.skinShade);
  u(6, 7, 1, 1, PALETTE.skinShade);
  u(17, 7, 1, 1, PALETTE.skinShade);
  // Mejillas
  u(7, 11, 2, 1, PALETTE.blush);
  u(15, 11, 2, 1, PALETTE.blush);

  // ---------- Cejas ----------
  u(8, 8, 2, 1, PALETTE.brow);
  u(14, 8, 2, 1, PALETTE.brow);

  // ---------- Ojos ----------
  if (!blink) {
    u(8, 9, 2, 3, PALETTE.eye);
    u(14, 9, 2, 3, PALETTE.eye);
    // Brillo en los ojos (vida!)
    u(9, 9, 1, 1, PALETTE.eyeShine);
    u(15, 9, 1, 1, PALETTE.eyeShine);
  } else {
    u(8, 11, 2, 1, PALETTE.eye);
    u(14, 11, 2, 1, PALETTE.eye);
  }

  // ---------- Boca ----------
  u(11, 12, 2, 1, PALETTE.mouth);
  u(10, 12, 1, 1, PALETTE.mouth);
  u(13, 12, 1, 1, PALETTE.mouth);

  // ---------- Capucha (asoma por detrás de la cabeza) ----------
  u(2, 9, 1, 6, PALETTE.hoodie);
  u(21, 9, 1, 6, PALETTE.hoodie);
  u(3, 14, 18, 1, PALETTE.hoodieShade);

  // ---------- Cuerpo / sudadera ----------
  u(5, 14, 14, 9, PALETTE.hoodie);
  // Highlight superior
  u(5, 14, 14, 1, PALETTE.hoodieHighlight);
  // Sombra inferior
  u(5, 21, 14, 2, PALETTE.hoodieMid);
  u(5, 22, 14, 1, PALETTE.hoodieShade);
  // Bolsillo central canguro
  u(8, 18, 8, 4, PALETTE.hoodieShade);
  u(8, 18, 8, 1, PALETTE.hoodieDark);
  u(9, 19, 1, 2, PALETTE.hoodieDark);
  u(14, 19, 1, 2, PALETTE.hoodieDark);
  // Cordones de la capucha
  u(10, 14, 1, 4, PALETTE.hairShade);
  u(13, 14, 1, 4, PALETTE.hairShade);
  // Remates de cordón
  u(10, 18, 1, 1, PALETTE.swordGuard);
  u(13, 18, 1, 1, PALETTE.swordGuard);
  // Pequeño detalle (corazón) en pecho
  u(15, 16, 1, 1, PALETTE.hoodieHighlight);
  u(16, 17, 1, 1, PALETTE.hoodieHighlight);
  u(15, 17, 1, 1, PALETTE.hoodieHighlight);

  // ---------- Brazos ----------
  const armSwing = swinging ? 1 : (jumping ? -1 : (walk === 1 ? 1 : walk === 3 ? -1 : 0));
  // Brazo izquierdo (desde nuestra perspectiva)
  u(4, 15, 1, 7 + (armSwing > 0 ? 1 : 0), PALETTE.hoodie);
  u(4, 15, 1, 1, PALETTE.hoodieHighlight);
  // Manga (cuff)
  u(3, 21 + (armSwing > 0 ? 1 : 0), 2, 1, PALETTE.hoodieDark);
  // Mano izquierda
  u(3, 22 + (armSwing > 0 ? 1 : 0), 2, 1, PALETTE.skin);

  // Brazo derecho
  u(19, 15, 1, 7 + (armSwing < 0 ? 1 : 0), PALETTE.hoodie);
  u(19, 15, 1, 1, PALETTE.hoodieHighlight);
  u(19, 21 + (armSwing < 0 ? 1 : 0), 2, 1, PALETTE.hoodieDark);
  u(19, 22 + (armSwing < 0 ? 1 : 0), 2, 1, PALETTE.skin);

  // ---------- Cinturón ----------
  u(5, 23, 14, 1, PALETTE.jeansDark);
  u(11, 23, 2, 1, PALETTE.swordGuard); // hebilla

  // ---------- Jeans ----------
  u(5, 24, 14, 6, PALETTE.jeans);
  u(5, 24, 14, 1, PALETTE.jeansSeam);
  // División de piernas
  u(11, 24, 2, 6, PALETTE.jeansShade);
  // Bolsillo trasero (lado)
  u(6, 26, 3, 2, PALETTE.jeansShade);
  u(15, 26, 3, 2, PALETTE.jeansShade);
  u(6, 26, 3, 1, PALETTE.jeansDark);
  u(15, 26, 3, 1, PALETTE.jeansDark);

  // ---------- Piernas ----------
  let legL = 0, legR = 0;
  if (jumping) { legL = -1; legR = 1; }
  else if (falling) { legL = 1; legR = -1; }
  else if (walk === 1) { legL = -1; legR = 1; }
  else if (walk === 3) { legL = 1; legR = -1; }

  // Pantorrillas
  u(6, 30 + legL, 4, 3, PALETTE.jeans);
  u(14, 30 + legR, 4, 3, PALETTE.jeans);
  u(6, 32 + legL, 4, 1, PALETTE.jeansShade);
  u(14, 32 + legR, 4, 1, PALETTE.jeansShade);

  // ---------- Zapatillas ----------
  // Pie izquierdo
  u(5, 33 + legL, 5, 2, PALETTE.shoe);
  u(5, 33 + legL, 5, 1, '#ffffff');
  u(5, 34 + legL, 5, 1, PALETTE.shoeShade);
  u(5, 35 + legL, 5, 1, PALETTE.shoeSole);
  u(5, 33 + legL, 1, 2, PALETTE.shoeStripe); // raya lateral
  u(8, 34 + legL, 1, 1, PALETTE.shoeStripe);

  // Pie derecho
  u(14, 33 + legR, 5, 2, PALETTE.shoe);
  u(14, 33 + legR, 5, 1, '#ffffff');
  u(14, 34 + legR, 5, 1, PALETTE.shoeShade);
  u(14, 35 + legR, 5, 1, PALETTE.shoeSole);
  u(18, 33 + legR, 1, 2, PALETTE.shoeStripe);
  u(15, 34 + legR, 1, 1, PALETTE.shoeStripe);

  // ---------- Auriculares mágicos (overlay sobre cabello) ----------
  if (hp) {
    u(4, 1, 16, 1, PALETTE.headphones);
    u(3, 1, 1, 3, PALETTE.headphones);
    u(20, 1, 1, 3, PALETTE.headphones);
    u(2, 4, 3, 5, PALETTE.headphonesPad);
    u(19, 4, 3, 5, PALETTE.headphonesPad);
    u(2, 4, 3, 1, PALETTE.headphones);
    u(19, 4, 3, 1, PALETTE.headphones);
  }

  // ---------- Espada en la mano derecha ----------
  if (showSword) {
    if (swinging) {
      // Arco de swing visible: la espada pivota frente a Mía (~135°)
      ctx.restore();
      ctx.save();
      // Re-aplicar transforms para el arco
      const cx2 = x + w / 2;
      const baseY2 = y + h;
      ctx.translate(cx2, baseY2);
      ctx.scale(stretchX, stretchY);
      ctx.translate(-cx2, -baseY2);
      if (facing < 0) {
        ctx.translate(x + w, y);
        ctx.scale(-1, 1);
      } else {
        ctx.translate(x, y);
      }
      _drawSwordSwing(ctx, sx, sy, swingT);
    } else {
      // En reposo: empuñada al costado
      _drawSwordIdle(ctx, sx, sy, walk, jumping);
    }
  }

  ctx.restore();
}

// Espada en reposo (empuñada al costado/derecha)
function _drawSwordIdle(ctx, sx, sy, walk, jumping) {
  const u = (cx, cy, cw, ch, color) =>
    px(ctx, cx * sx, cy * sy, cw * sx, ch * sy, color);

  // Mango (lo agarra la mano derecha, x≈19-20, y≈22-23)
  // La espada cuelga hacia abajo
  const ox = 21;
  const oy = 19;
  // Hoja
  u(ox, oy, 2, 8, PALETTE.swordBlade);
  u(ox, oy, 1, 8, '#ffffff');
  u(ox + 1, oy, 1, 8, PALETTE.swordEdge);
  u(ox, oy, 2, 1, '#ffffff');
  // Guarda
  u(ox - 1, oy + 8, 4, 1, PALETTE.swordGuard);
  // Mango
  u(ox, oy + 9, 2, 2, PALETTE.swordHilt);
  // Pomo
  u(ox - 1, oy + 11, 4, 1, PALETTE.swordPommel);
}

// Espada haciendo swing (arco frente a Mía)
function _drawSwordSwing(ctx, sx, sy, swingT) {
  // swingT va de 0 (inicio) a 1 (fin). El ángulo va de -45° a +90° aprox.
  // La espada pivota desde el hombro derecho (~20, 16).
  const angle = -Math.PI / 4 + swingT * (Math.PI * 0.85);
  const px0 = 18 * sx;
  const py0 = 17 * sy;
  ctx.save();
  ctx.translate(px0, py0);
  ctx.rotate(angle);

  // Hoja extendida
  const bladeLen = 14 * sx;
  const bladeW = 3 * sy;
  ctx.fillStyle = PALETTE.swordBlade;
  ctx.fillRect(0, -bladeW / 2, bladeLen, bladeW);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, -bladeW / 2, bladeLen, 1);
  ctx.fillStyle = PALETTE.swordEdge;
  ctx.fillRect(0, bladeW / 2 - 1, bladeLen, 1);
  // Punta
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(bladeLen - 2, -bladeW / 2 + 1, 2, bladeW - 2);
  // Guarda (cruz)
  ctx.fillStyle = PALETTE.swordGuard;
  ctx.fillRect(-2, -bladeW / 2 - 1, 4, bladeW + 2);
  // Mango
  ctx.fillStyle = PALETTE.swordHilt;
  ctx.fillRect(-5 * sx, -1, 5 * sx, 2);
  // Pomo
  ctx.fillStyle = PALETTE.swordPommel;
  ctx.fillRect(-6 * sx, -2, 2, 4);

  ctx.restore();

  // Estela del swing (arco translúcido)
  ctx.save();
  ctx.translate(px0, py0);
  ctx.fillStyle = `rgba(255,255,255,${0.4 * (1 - swingT)})`;
  ctx.beginPath();
  const r = 16 * sx;
  ctx.arc(0, 0, r, -Math.PI / 4, angle, false);
  ctx.lineTo(0, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ---------- Slime de Basura ----------
function drawSlime(ctx, x, y, w, h, opts = {}) {
  const sx = w / 16, sy = h / 16;
  const u = (cx, cy, cw, ch, color) =>
    px(ctx, x + cx * sx, y + cy * sy, cw * sx, ch * sy, color);

  // cuerpo gelatinoso
  u(3, 6, 10, 8, '#7aa845');
  u(2, 7, 1, 5, '#7aa845');
  u(13, 7, 1, 5, '#7aa845');
  u(4, 5, 8, 1, '#7aa845');
  // brillo
  u(5, 7, 2, 1, '#c0e074');
  // sombra inferior
  u(3, 13, 10, 1, '#4d6d28');
  // cáscara de plátano encima
  u(6, 3, 4, 2, '#f7d34a');
  u(6, 5, 4, 1, '#d2a51d');
  u(7, 1, 2, 2, '#a87b16');
  // ojos
  const blink = opts.blink;
  if (!blink) {
    u(6, 9, 1, 2, '#1a1a1a');
    u(10, 9, 1, 2, '#1a1a1a');
    u(6, 9, 1, 1, '#fff');
    u(10, 9, 1, 1, '#fff');
  } else {
    u(6, 10, 1, 1, '#1a1a1a');
    u(10, 10, 1, 1, '#1a1a1a');
  }
  // boca
  u(7, 12, 3, 1, '#1a1a1a');
}

// ---------- Cuervo Robacarteras ----------
function drawCrow(ctx, x, y, w, h, opts = {}) {
  const sx = w / 16, sy = h / 16;
  const u = (cx, cy, cw, ch, color) =>
    px(ctx, x + cx * sx, y + cy * sy, cw * sx, ch * sy, color);

  if (opts.shellMode) {
    // Forma "concha": el cuervo escondido en sus alas, tipo bolita.
    u(3, 6, 10, 7, '#3b2a55');
    u(4, 5, 8, 1, '#3b2a55');
    u(2, 7, 1, 5, '#3b2a55');
    u(13, 7, 1, 5, '#3b2a55');
    u(3, 13, 10, 1, '#1d1133');
    // pluma destacada
    u(6, 8, 4, 1, '#6c3df0');
    u(7, 9, 2, 1, '#6c3df0');
    if (!opts.blink) {
      u(6, 10, 1, 1, '#ff4fa3');
      u(9, 10, 1, 1, '#ff4fa3');
    }
    return;
  }

  const facing = opts.facing ?? 1;
  ctx.save();
  if (facing < 0) {
    ctx.translate(x + w, y);
    ctx.scale(-1, 1);
  } else {
    ctx.translate(x, y);
  }
  const v = (cx, cy, cw, ch, color) =>
    px(ctx, cx * sx, cy * sy, cw * sx, ch * sy, color);

  // cuerpo
  v(4, 7, 7, 5, '#1d1133');
  v(3, 8, 1, 3, '#1d1133');
  v(11, 8, 1, 3, '#1d1133');
  // ala batiendo (si vuela)
  const flap = opts.flap ?? 0;
  if (opts.flying) {
    if (flap < 2) {
      v(2, 5, 4, 2, '#3b2a55');
    } else {
      v(2, 9, 4, 2, '#3b2a55');
    }
  } else {
    v(4, 8, 3, 1, '#3b2a55');
  }
  // cabeza
  v(9, 4, 4, 4, '#1d1133');
  // ojo
  v(11, 5, 1, 1, '#ff4fa3');
  // pico
  v(13, 6, 2, 1, '#ffae3b');
  v(13, 7, 1, 1, '#d2891f');
  // patas (si camina)
  if (!opts.flying) {
    v(6, 12, 1, 2, '#ffae3b');
    v(9, 12, 1, 2, '#ffae3b');
  }
  ctx.restore();
}

// ---------- Cactus Rodante ----------

  const u = (cx, cy, cw, ch, color) =>
    px(ctx, x + cx * sx, y + cy * sy, cw * sx, ch * sy, color);

  // bola espinosa rotando
  const rot = opts.rot ?? 0;
  u(3, 3, 10, 10, '#3aa84a');
  u(2, 4, 1, 8, '#3aa84a');
  u(13, 4, 1, 8, '#3aa84a');
  u(4, 2, 8, 1, '#3aa84a');
  u(4, 13, 8, 1, '#3aa84a');
  u(3, 12, 10, 1, '#1f6e2f');

  // espinas que rotan
  const spikes = [
    [4, 1], [11, 1], [1, 5], [1, 10], [14, 5], [14, 10], [4, 14], [11, 14],
  ];
  for (let i = 0; i < spikes.length; i++) {
    if ((i + Math.floor(rot)) % 2 === 0) {
      u(spikes[i][0], spikes[i][1], 1, 1, '#e9f7c3');
    } else {
      u(spikes[i][0], spikes[i][1], 1, 1, '#9be07a');
    }
  }
  // cara enojada
  u(6, 7, 1, 2, '#1a1a1a');
  u(9, 7, 1, 2, '#1a1a1a');
  u(7, 10, 2, 1, '#1a1a1a');
}

// ---------- Moneda de plata ----------
function drawCoin(ctx, x, y, size, t = 0) {
  const s = size / 16;
  const u = (cx, cy, cw, ch, color) =>
    px(ctx, x + cx * s, y + cy * s, cw * s, ch * s, color);
  // animación de spin: anchura horizontal cambia con seno
  const spin = Math.abs(Math.sin(t * 6));
  const w = 2 + spin * 6;
  const cx = 8 - w / 2;
  u(cx, 4, w, 8, '#dfe5f2');
  u(cx + 1, 5, w - 2, 1, '#ffffff');
  u(cx + 1, 10, w - 2, 1, '#9aa3b8');
  if (w > 4) {
    u(cx + 2, 6, 1, 4, '#9aa3b8');
    u(cx + w - 3, 6, 1, 4, '#9aa3b8');
  }
}

// Tipos y constantes de tilemap, fondos parallax y render de tiles.

const TILE = 40; // px por celda (era 32 — 25% más grande para mejor legibilidad)

// Tipos de tile
const T = {
  EMPTY: 0,
  GROUND: 1,
  PLATFORM: 2,
  BRICK: 3,
  MYSTERY: 4,        // con moneda
  MYSTERY_POWER: 5,  // con bebida o auriculares (según estado de Mía)
  MYSTERY_HP: 6,     // siempre auriculares
  EMPTY_BOX: 7,      // caja golpeada
};

const SOLID = new Set([T.GROUND, T.PLATFORM, T.BRICK, T.MYSTERY, T.MYSTERY_POWER, T.MYSTERY_HP, T.EMPTY_BOX]);

class World {
  constructor(level) {
    this.level = level;
    this.world = level.world;
    this.cols = level.cols;
    this.rows = level.rowsCount;
    this.timeLimit = level.timeLimit;
    this.tiles = new Uint8Array(this.cols * this.rows);
    this.bumpAnim = new Map(); // key="col,row" -> {t, dir} para animación al golpear

    // Listas para spawnear entidades (se procesan desde main al cargar)
    this.entitySeeds = [];

    for (let r = 0; r < this.rows; r++) {
      const row = level.rows[r];
      for (let c = 0; c < this.cols; c++) {
        const ch = row[c];
        switch (ch) {
          case '#': this.set(c, r, T.GROUND); break;
          case '=': this.set(c, r, T.PLATFORM); break;
          case 'B': this.set(c, r, T.BRICK); break;
          case '?': this.set(c, r, T.MYSTERY); break;
          case '$': this.set(c, r, T.MYSTERY_POWER); break;
          case '*': this.set(c, r, T.MYSTERY_HP); break;
          case 'C': this.entitySeeds.push({ kind: 'coin', col: c, row: r }); break;
          case 'S': this.entitySeeds.push({ kind: 'slime', col: c, row: r }); break;
          case 'K': this.entitySeeds.push({ kind: 'crow', col: c, row: r, flying: false }); break;
          case 'F': this.entitySeeds.push({ kind: 'crow', col: c, row: r, flying: true }); break;
          case 'X': this.entitySeeds.push({ kind: 'cactus', col: c, row: r }); break;
          case 'G': this.entitySeeds.push({ kind: 'goal', col: c, row: r }); break;
          default: /* vacío */ break;
        }
      }
    }

    this.widthPx = this.cols * TILE;
    this.heightPx = this.rows * TILE;

    // Cache de parallax: pre-renderizamos las capas estáticas
    // (edificios, colinas, árboles) a un offscreen canvas. Solo la
    // capa más cercana se redibuja en tiempo real con offset.
    this._parallaxCache = null;
    this._parallaxCacheW = 0;
    this._parallaxCacheH = 0;
  }

  idx(c, r) { return r * this.cols + c; }
  inBounds(c, r) { return c >= 0 && c < this.cols && r >= 0 && r < this.rows; }
  get(c, r) { return this.inBounds(c, r) ? this.tiles[this.idx(c, r)] : T.EMPTY; }
  set(c, r, v) { if (this.inBounds(c, r)) this.tiles[this.idx(c, r)] = v; }

  isSolid(c, r) {
    const v = this.get(c, r);
    return SOLID.has(v);
  }

  // Plataformas son sólidas solo desde arriba — útil para "saltar a través".
  isOneWay(c, r) { return this.get(c, r) === T.PLATFORM; }

  // Devuelve {x, y, w, h} del rectángulo del tile en píxeles.
  tileRect(c, r) { return { x: c * TILE, y: r * TILE, w: TILE, h: TILE }; }

  /**
   * Maneja un golpe de cabeza desde abajo en (col,row).
   * Devuelve un objeto describiendo qué pasó:
   *   { kind: 'coin'|'powerup'|'headphones'|'brick'|'none', x, y }
   */
  bump(col, row, mia) {
    const v = this.get(col, row);
    if (v === T.MYSTERY) {
      this.set(col, row, T.EMPTY_BOX);
      this.bumpAnim.set(`${col},${row}`, { t: 0.0 });
      return { kind: 'coin', x: col * TILE + TILE / 2, y: row * TILE };
    }
    if (v === T.MYSTERY_POWER) {
      this.set(col, row, T.EMPTY_BOX);
      this.bumpAnim.set(`${col},${row}`, { t: 0.0 });
      // Si Mía es pequeña: bebida. Si ya es grande: auriculares.
      const item = mia && mia.size === 'big' ? 'headphones' : 'energy';
      return { kind: 'powerup', item, x: col * TILE + TILE / 2, y: row * TILE };
    }
    if (v === T.MYSTERY_HP) {
      this.set(col, row, T.EMPTY_BOX);
      this.bumpAnim.set(`${col},${row}`, { t: 0.0 });
      return { kind: 'powerup', item: 'headphones', x: col * TILE + TILE / 2, y: row * TILE };
    }
    if (v === T.BRICK) {
      this.bumpAnim.set(`${col},${row}`, { t: 0.0 });
      if (mia && mia.size !== 'small') {
        // Mía grande rompe el ladrillo
        this.set(col, row, T.EMPTY);
        return { kind: 'brick-break', x: col * TILE + TILE / 2, y: row * TILE + TILE / 2 };
      }
      return { kind: 'brick-bump', x: col * TILE + TILE / 2, y: row * TILE };
    }
    return { kind: 'none' };
  }

  update(dt) {
    for (const [k, v] of this.bumpAnim) {
      v.t += dt;
      if (v.t > 0.25) this.bumpAnim.delete(k);
    }
  }

  // ----- render -----
  drawBackground(ctx, cam, viewW, viewH, t) {
    // Gradiente de cielo (rápido, lo redibujamos cada frame).
    const [c1, c2] = this.level.bgColor;
    const grad = ctx.createLinearGradient(0, 0, 0, viewH);
    grad.addColorStop(0, c1);
    grad.addColorStop(1, c2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, viewW, viewH);

    // Cache de parallax: una sola tira ancha (3× viewW) que se repite
    // según offset. Lo creamos una vez por nivel.
    this._ensureParallaxCache(viewW, viewH);

    // Pintamos el cache con offset wrap-around horizontal según cam.x.
    const cacheW = this._parallaxCache.width;
    const offset = -((cam.x * 0.3) % cacheW);
    ctx.drawImage(this._parallaxCache, offset, 0);
    if (offset + cacheW < viewW) {
      ctx.drawImage(this._parallaxCache, offset + cacheW, 0);
    }

    // Capa "viva" de detalles (estrellas titilando, gotas) — barata.
    if (this.world === 'roof') {
      this._drawRoofStars(ctx, viewW, viewH, t);
    } else if (this.world === 'sewer') {
      this._drawSewerDrips(ctx, cam, viewW, viewH);
    }
  }

  _ensureParallaxCache(viewW, viewH) {
    if (this._parallaxCache &&
        this._parallaxCacheW === viewW &&
        this._parallaxCacheH === viewH) return;

    // Tira de 2× viewW para que el wrap sea suave.
    const W = viewW * 2;
    const off = document.createElement('canvas');
    off.width = W;
    off.height = viewH;
    const c = off.getContext('2d');

    if (this.world === 'city') this._renderCityToCache(c, W, viewH);
    else if (this.world === 'park') this._renderParkToCache(c, W, viewH);
    else if (this.world === 'sewer') this._renderSewerToCache(c, W, viewH);
    else if (this.world === 'roof') this._renderRoofToCache(c, W, viewH);

    this._parallaxCache = off;
    this._parallaxCacheW = viewW;
    this._parallaxCacheH = viewH;
  }

  _renderCityToCache(ctx, W, H) {
    // Luna
    ctx.fillStyle = '#fff7d6';
    ctx.beginPath();
    ctx.arc(W * 0.18, 90, 32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.beginPath();
    ctx.arc(W * 0.18, 90, 56, 0, Math.PI * 2);
    ctx.fill();

    // Edificios lejanos (capa profunda)
    for (let i = 0; i < W / 160 + 1; i++) {
      const bx = i * 160;
      const bh = 240 + ((i * 53) % 130);
      ctx.fillStyle = '#1c1338';
      ctx.fillRect(bx, H - bh, 140, bh);
      ctx.fillStyle = '#ffd14f';
      for (let wy = H - bh + 20; wy < H - 30; wy += 28) {
        for (let wx = bx + 12; wx < bx + 130; wx += 24) {
          if (((wx + wy + i) % 5) < 2) ctx.fillRect(wx, wy, 8, 12);
        }
      }
    }
    // Edificios cercanos (encima)
    for (let i = 0; i < W / 220 + 1; i++) {
      const bx = i * 220 + 30;
      const bh = 340 + ((i * 71) % 90);
      ctx.fillStyle = '#0e0820';
      ctx.fillRect(bx, H - bh, 160, bh);
      ctx.fillStyle = '#3a2a8a';
      for (let wy = H - bh + 30; wy < H - 60; wy += 36) {
        for (let wx = bx + 20; wx < bx + 150; wx += 32) {
          if (((wx * 3 + wy + i) % 7) < 3) ctx.fillRect(wx, wy, 12, 16);
        }
      }
      // Antena
      ctx.fillStyle = '#444';
      ctx.fillRect(bx + 80, H - bh - 18, 2, 18);
      ctx.fillStyle = '#ff4fa3';
      ctx.fillRect(bx + 78, H - bh - 20, 6, 4);
    }
  }

  _renderParkToCache(ctx, W, H) {
    // Colinas
    ctx.fillStyle = '#1a3d2a';
    for (let i = 0; i < W / 320 + 1; i++) {
      const bx = i * 320;
      ctx.beginPath();
      ctx.moveTo(bx, H);
      ctx.quadraticCurveTo(bx + 160, H - 220, bx + 320, H);
      ctx.fill();
    }
    // Árboles oscuros
    ctx.fillStyle = '#0e2418';
    for (let i = 0; i < W / 180 + 1; i++) {
      const bx = i * 180;
      ctx.fillRect(bx + 60, H - 170, 12, 170);
      ctx.beginPath();
      ctx.arc(bx + 66, H - 180, 54, 0, Math.PI * 2);
      ctx.fill();
    }
    // Luna pálida
    ctx.fillStyle = '#e9f0d6';
    ctx.beginPath();
    ctx.arc(W * 0.7, 70, 28, 0, Math.PI * 2);
    ctx.fill();
  }

  _renderSewerToCache(ctx, W, H) {
    // Tuberías verticales
    ctx.fillStyle = '#241a3a';
    for (let i = 0; i < W / 80 + 1; i++) {
      ctx.fillRect(i * 80, 0, 60, H);
    }
    // Arcos
    ctx.fillStyle = '#0c0820';
    for (let i = 0; i < W / 200 + 1; i++) {
      const bx = i * 200;
      ctx.beginPath();
      ctx.arc(bx + 100, H - 60, 95, Math.PI, Math.PI * 2);
      ctx.fill();
    }
    // Brillos
    ctx.fillStyle = '#3a2c5c';
    for (let i = 0; i < W / 40; i++) {
      const x = (i * 137) % W;
      const y = (i * 53) % (H - 80) + 40;
      ctx.fillRect(x, y, 3, 3);
    }
  }

  _renderRoofToCache(ctx, W, H) {
    // Skyline lejanísima
    ctx.fillStyle = '#0a061a';
    for (let i = 0; i < W / 240 + 1; i++) {
      const bx = i * 240;
      const bh = 180 + ((i * 41) % 90);
      ctx.fillRect(bx, H - bh, 130, bh);
      ctx.fillStyle = '#a36ad8';
      for (let wy = H - bh + 20; wy < H - 20; wy += 30) {
        for (let wx = bx + 10; wx < bx + 120; wx += 18) {
          if ((wx + wy + i) % 4 < 2) ctx.fillRect(wx, wy, 6, 10);
        }
      }
      ctx.fillStyle = '#0a061a';
    }
  }

  _drawRoofStars(ctx, viewW, viewH, t) {
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 60; i++) {
      const x = (i * 137) % viewW;
      const y = (i * 53) % (viewH * 0.6);
      const tw = 0.5 + 0.5 * Math.sin(t * 4 + i);
      ctx.globalAlpha = 0.3 + tw * 0.6;
      ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  _drawSewerDrips(ctx, cam, viewW, viewH) {
    ctx.fillStyle = 'rgba(108,240,255,0.25)';
    const tt = Date.now() * 0.05;
    for (let i = 0; i < 18; i++) {
      const x = (i * 73 + cam.x * 0.1) % viewW;
      const y = (i * 131 + tt) % viewH;
      ctx.fillRect(x, y, 2, 5);
    }
  }

  drawTiles(ctx, cam, viewW, viewH, t) {
    const c0 = Math.max(0, Math.floor(cam.x / TILE) - 1);
    const c1 = Math.min(this.cols, Math.ceil((cam.x + viewW) / TILE) + 1);
    const r0 = Math.max(0, Math.floor(cam.y / TILE) - 1);
    const r1 = Math.min(this.rows, Math.ceil((cam.y + viewH) / TILE) + 1);

    for (let r = r0; r < r1; r++) {
      for (let c = c0; c < c1; c++) {
        const v = this.get(c, r);
        if (v === T.EMPTY) continue;

        // bump animation offset
        const bump = this.bumpAnim.get(`${c},${r}`);
        const oy = bump ? -Math.sin((bump.t / 0.25) * Math.PI) * 8 : 0;

        const px = c * TILE - cam.x;
        const py = r * TILE - cam.y + oy;

        switch (v) {
          case T.GROUND: drawGround(ctx, px, py, TILE, this.world); break;
          case T.PLATFORM: drawPlatform(ctx, px, py, TILE, this.world); break;
          case T.BRICK: drawBrick(ctx, px, py, TILE); break;
          case T.MYSTERY:
          case T.MYSTERY_POWER:
          case T.MYSTERY_HP: {
            const blink = (Math.floor(t * 4) % 2) === 0;
            drawMysteryBox(ctx, px, py, TILE, { blink });
            break;
          }
          case T.EMPTY_BOX: drawMysteryBox(ctx, px, py, TILE, { empty: true }); break;
        }
      }
    }
  }
}
// Mía: jugadora con física de plataformas, salto variable, espada y power-ups.
// Constantes de física escaladas por 1.25 para acompañar TILE=40 (era 32).

// Constantes de física (px/seg).
const GRAVITY = 2250;            // 1800 * 1.25
const MAX_FALL = 1125;           // 900 * 1.25
const WALK_ACCEL = 1125;         // 900 * 1.25
const RUN_ACCEL  = 1750;         // 1400 * 1.25
const WALK_MAX   = 225;          // 180 * 1.25
const RUN_MAX    = 400;          // 320 * 1.25
const FRICTION   = 1625;         // 1300 * 1.25
const JUMP_VEL   = -700;         // -560 * 1.25
const JUMP_HOLD_FORCE = -1375;   // -1100 * 1.25
const JUMP_HOLD_TIME  = 0.22;
const COYOTE_TIME = 0.08;
const JUMP_BUFFER = 0.10;

// Espada
const SWORD_DURATION = 0.22;     // duración del swing visible
const SWORD_COOLDOWN = 0.32;     // tiempo mínimo entre swings
const SWORD_REACH = 38;          // alcance horizontal del hitbox

class Player {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.facing = 1;
    this.size = 'small';   // 'small' | 'big'
    this.hasHeadphones = false;
    this.onGround = false;
    this.onPlatform = false;
    this.coyote = 0;
    this.jumpBuffer = 0;
    this.jumpHold = 0;
    this.jumping = false;
    this.invuln = 0;
    this.dead = false;
    this.deathTimer = 0;
    this.walkPhase = 0;
    this.walkTimer = 0;
    this.shootCooldown = 0;
    this.justBumped = null;
    this.justHit = null;
    this.spawnX = x; this.spawnY = y;
    this.completed = false;
    this.win = false;

    // Espada
    this.swordTimer = 0;       // > 0 mientras está activa
    this.swordCooldown = 0;
    this.swordHits = new Set(); // ids ya golpeados en este swing
    this.swordSwingId = 0;

    // Squash & stretch
    this.landSquash = 0;       // > 0 brevemente al aterrizar
    this._wasOnGround = false;
  }

  // Ligeramente más grandes que antes para acompañar TILE=40
  get width()  { return 30; }
  get height() { return this.size === 'big' ? 60 : 36; }

  get aabb() {
    return { x: this.x, y: this.y, w: this.width, h: this.height };
  }

  // Hitbox del swing de espada (frente a Mía mientras swordTimer > 0)
  get swordHitbox() {
    if (this.swordTimer <= 0) return null;
    const hx = this.facing > 0 ? (this.x + this.width - 4) : (this.x - SWORD_REACH + 4);
    return {
      x: hx,
      y: this.y + 6,
      w: SWORD_REACH,
      h: this.height - 10,
    };
  }

  get isSwinging() { return this.swordTimer > 0; }
  get swingProgress() {
    return this.swordTimer > 0 ? 1 - (this.swordTimer / SWORD_DURATION) : 0;
  }

  reset(x, y) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.size = 'small';
    this.hasHeadphones = false;
    this.onGround = false;
    this.invuln = 0;
    this.dead = false;
    this.deathTimer = 0;
    this.completed = false;
    this.swordTimer = 0;
    this.swordCooldown = 0;
  }

  attack() {
    if (this.swordCooldown > 0 || this.dead) return false;
    this.swordTimer = SWORD_DURATION;
    this.swordCooldown = SWORD_COOLDOWN;
    this.swordHits = new Set();
    this.swordSwingId++;
    SFX.shoot();
    return true;
  }

  takeDamage() {
    if (this.invuln > 0 || this.dead) return false;
    if (this.hasHeadphones) {
      this.hasHeadphones = false;
      this.invuln = 1.5;
      SFX.hit();
      return false;
    }
    if (this.size === 'big') {
      this.size = 'small';
      this.invuln = 1.5;
      SFX.hit();
      return false;
    }
    this.dead = true;
    this.deathTimer = 0;
    this.vx = 0;
    this.vy = -560;
    SFX.death();
    return true;
  }

  grow() {
    if (this.size === 'small') {
      this.size = 'big';
      this.y -= 24;
      SFX.power();
    }
  }

  giveHeadphones() {
    this.hasHeadphones = true;
    if (this.size === 'small') {
      this.size = 'big';
      this.y -= 24;
    }
    SFX.power();
  }

  bounce(small = false) {
    this.vy = small ? -380 : -600;
    this.jumping = false;
    this.jumpHold = 0;
  }

  update(dt, input, world) {
    if (this.dead) {
      this.deathTimer += dt;
      this.vy += GRAVITY * dt;
      this.y += this.vy * dt;
      return;
    }

    // Timers de espada
    if (this.swordTimer > 0) this.swordTimer -= dt;
    if (this.swordCooldown > 0) this.swordCooldown -= dt;

    // Trigger de ataque
    if (input.wasPressed('attack')) {
      this.attack();
    }

    // Squash & stretch: aterrizaje
    if (this.landSquash > 0) this.landSquash -= dt;

    // Entrada horizontal
    const left = input.isDown('left');
    const right = input.isDown('right');
    const running = input.isDown('run');
    const dir = (right ? 1 : 0) - (left ? 1 : 0);
    const maxSpeed = running ? RUN_MAX : WALK_MAX;
    const accel = running ? RUN_ACCEL : WALK_ACCEL;

    if (dir !== 0) {
      this.vx += dir * accel * dt;
      this.facing = dir;
      if (Math.abs(this.vx) > maxSpeed) {
        const sign = Math.sign(this.vx);
        this.vx = sign * Math.max(maxSpeed, Math.abs(this.vx) - FRICTION * 0.5 * dt);
      }
    } else {
      const sign = Math.sign(this.vx);
      this.vx -= sign * FRICTION * dt;
      if (Math.sign(this.vx) !== sign) this.vx = 0;
    }
    this.vx = Math.max(-RUN_MAX, Math.min(RUN_MAX, this.vx));

    // Coyote / buffer
    this.coyote = this.onGround ? COYOTE_TIME : Math.max(0, this.coyote - dt);
    if (input.wasPressed('jump')) this.jumpBuffer = JUMP_BUFFER;
    else this.jumpBuffer = Math.max(0, this.jumpBuffer - dt);

    if (this.jumpBuffer > 0 && this.coyote > 0) {
      this.vy = JUMP_VEL;
      this.jumping = true;
      this.jumpHold = JUMP_HOLD_TIME;
      this.jumpBuffer = 0;
      this.coyote = 0;
      this.onGround = false;
      SFX.jump();
    }

    if (this.jumping && input.isDown('jump') && this.jumpHold > 0 && this.vy < 0) {
      this.vy += JUMP_HOLD_FORCE * dt;
      this.jumpHold -= dt;
    } else {
      this.jumping = false;
      this.jumpHold = 0;
    }

    if (this.shootCooldown > 0) this.shootCooldown -= dt;

    this.vy += GRAVITY * dt;
    if (this.vy > MAX_FALL) this.vy = MAX_FALL;

    this.justBumped = null;
    this.moveAndCollide(dt, world);

    // Detectar aterrizaje para squash
    if (this.onGround && !this._wasOnGround) {
      this.landSquash = 0.12;
    }
    this._wasOnGround = this.onGround;

    // Animación de caminar
    if (this.onGround && Math.abs(this.vx) > 10) {
      this.walkTimer += Math.abs(this.vx) * dt * 0.04;
      this.walkPhase = Math.floor(this.walkTimer) % 4;
    } else {
      this.walkPhase = 0;
    }

    if (this.invuln > 0) this.invuln -= dt;

    if (this.y > world.heightPx + 200) {
      if (!this.dead) {
        this.dead = true;
        this.deathTimer = 0;
        SFX.death();
      }
    }
  }

  moveAndCollide(dt, world) {
    // X axis
    let dx = this.vx * dt;
    this.x += dx;
    this.collideAxis(world, 'x');

    // Y axis
    let dy = this.vy * dt;
    const wasOnGround = this.onGround;
    this.onGround = false;
    this.onPlatform = false;
    this.y += dy;
    this.collideAxis(world, 'y');

    if (this.onGround && !wasOnGround) {
      this.jumping = false;
    }
  }

  collideAxis(world, axis) {
    const left = Math.floor(this.x / TILE);
    const right = Math.floor((this.x + this.width - 1) / TILE);
    const top = Math.floor(this.y / TILE);
    const bottom = Math.floor((this.y + this.height - 1) / TILE);

    for (let r = top; r <= bottom; r++) {
      for (let c = left; c <= right; c++) {
        if (!world.isSolid(c, r)) continue;
        const tile = world.tileRect(c, r);
        const isOneWay = world.isOneWay(c, r);

        if (axis === 'x') {
          if (isOneWay) continue; // las plataformas no bloquean lateralmente
          if (this.vx > 0) {
            this.x = tile.x - this.width;
          } else if (this.vx < 0) {
            this.x = tile.x + tile.w;
          }
          this.vx = 0;
        } else {
          if (this.vy > 0) {
            // cayendo: aterrizamos sobre tile
            if (isOneWay) {
              // plataforma: solo si el pie estaba por encima en el frame anterior
              const prevBottom = (this.y - this.vy * (1 / 60)) + this.height;
              if (prevBottom > tile.y + 1) continue;
            }
            this.y = tile.y - this.height;
            this.vy = 0;
            this.onGround = true;
            if (isOneWay) this.onPlatform = true;
          } else if (this.vy < 0) {
            if (isOneWay) continue; // plataformas se atraviesan hacia arriba
            this.y = tile.y + tile.h;
            this.vy = 0;
            // golpe de cabeza con el bloque c,r — registrar
            this.justBumped = { col: c, row: r };
            this.jumping = false;
            this.jumpHold = 0;
          }
        }
      }
    }
  }

  draw(ctx, cam, t) {
    if (this.invuln > 0 && Math.floor(this.invuln * 12) % 2 === 0) return;

    // Sprite displays más grandes (1.5x el grid 24x36)
    const w = this.size === 'big' ? 48 : 36;
    const h = this.size === 'big' ? 72 : 54;

    const drawX = this.x - cam.x + (this.width - w) / 2;
    const drawY = this.y - cam.y - (h - this.height);

    // Squash & stretch
    let stretchY = 1, stretchX = 1;
    if (this.landSquash > 0) {
      // Aplastarse al aterrizar
      const k = this.landSquash / 0.12;
      stretchY = 1 - 0.18 * k;
      stretchX = 1 + 0.14 * k;
    } else if (!this.onGround) {
      if (this.vy < -50) {
        // Subiendo: estirar verticalmente
        const k = Math.min(1, -this.vy / 700);
        stretchY = 1 + 0.18 * k;
        stretchX = 1 - 0.10 * k;
      } else if (this.vy > 100) {
        // Cayendo: levemente alargar pero menos
        stretchY = 1.06;
        stretchX = 0.96;
      }
    }

    const blink = (Math.floor(t * 2) % 8) === 0;
    drawMia(ctx, drawX, drawY, w, h, {
      facing: this.facing,
      walkPhase: this.walkPhase,
      isJumping: !this.onGround && this.vy < 0,
      isFalling: !this.onGround && this.vy >= 0,
      hasHeadphones: this.hasHeadphones,
      blink,
      swinging: this.isSwinging,
      swingT: this.swingProgress,
      stretchX, stretchY,
    });
  }
}
// Enemigos: Slime de Basura, Cuervo Robacarteras, Cactus Rodante, Mapache jefe.

// Helper: colisión vertical contra el world. Se usa para que enemies caigan
// y caminen sobre tiles sólidos. (Versión simple, no tan estricta como la
// del jugador.)
function collideTiles(ent, world) {
  // ejes separados
  // X
  ent.x += ent.vx * ent.dt;
  let l = Math.floor(ent.x / TILE);
  let r = Math.floor((ent.x + ent.w - 1) / TILE);
  let t = Math.floor(ent.y / TILE);
  let b = Math.floor((ent.y + ent.h - 1) / TILE);
  for (let row = t; row <= b; row++) {
    for (let col = l; col <= r; col++) {
      if (!world.isSolid(col, row) || world.isOneWay(col, row)) continue;
      const tile = world.tileRect(col, row);
      if (ent.vx > 0) ent.x = tile.x - ent.w;
      else if (ent.vx < 0) ent.x = tile.x + tile.w;
      ent.vx = -ent.vx;
      ent.facing = -ent.facing;
    }
  }

  // Y
  ent.y += ent.vy * ent.dt;
  ent.onGround = false;
  l = Math.floor(ent.x / TILE);
  r = Math.floor((ent.x + ent.w - 1) / TILE);
  t = Math.floor(ent.y / TILE);
  b = Math.floor((ent.y + ent.h - 1) / TILE);
  for (let row = t; row <= b; row++) {
    for (let col = l; col <= r; col++) {
      if (!world.isSolid(col, row)) continue;
      const tile = world.tileRect(col, row);
      const isOneWay = world.isOneWay(col, row);
      if (ent.vy > 0) {
        if (isOneWay) {
          const prevBottom = ent.y + ent.h - ent.vy * ent.dt;
          if (prevBottom > tile.y + 1) continue;
        }
        ent.y = tile.y - ent.h;
        ent.vy = 0;
        ent.onGround = true;
      } else if (ent.vy < 0) {
        if (isOneWay) continue;
        ent.y = tile.y + tile.h;
        ent.vy = 0;
      }
    }
  }
}

class Enemy {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.vx = 0; this.vy = 0;
    this.facing = -1;
    this.dead = false;
    this.deadTimer = 0;
    this.dt = 1 / 60;
    this.onGround = false;
    this.canStomp = true;
    this.kind = 'enemy';
  }
  get aabb() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  killByStomp() { this.dead = true; this.deadTimer = 0; this.vy = -200; this.canStomp = false; SFX.stomp(); }
  killByProjectile() { this.dead = true; this.deadTimer = 0; this.vy = -260; this.vx = this.facing * 80; SFX.stomp(); }
  // Por defecto, la espada se comporta como proyectil (mata si canBeStomped).
  // Cactus override este método para ser inmune.
  killBySword(fromDir) {
    this.dead = true;
    this.deadTimer = 0;
    this.vy = -320;
    this.vx = (fromDir || 1) * 220;
    SFX.stomp();
  }
}

// ---------- Slime de Basura ----------
class Slime extends Enemy {
  constructor(x, y) {
    super(x, y, 36, 36);
    this.kind = 'slime';
    this.vx = -65;
    this.canBeStomped = true;
    this.canBeProjectiled = true;
    this.canBeDeflected = true;
  }
  update(dt, world) {
    this.dt = dt;
    if (this.dead) {
      this.deadTimer += dt;
      this.vy += 1800 * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      return;
    }
    this.vy += 1800 * dt;
    if (this.vy > 600) this.vy = 600;
    // Detectar borde del piso para no caerse:
    if (this.onGround) {
      const aheadX = Math.floor((this.x + (this.vx > 0 ? this.w + 1 : -1)) / TILE);
      const belowR = Math.floor((this.y + this.h + 2) / TILE);
      if (!world.isSolid(aheadX, belowR)) {
        this.vx = -this.vx;
        this.facing = -this.facing;
      }
    }
    collideTiles(this, world);
  }
  draw(ctx, cam, t) {
    if (this.dead) {
      ctx.save();
      ctx.translate(this.x - cam.x + this.w / 2, this.y - cam.y + this.h / 2);
      ctx.scale(1, -1);
      drawSlime(ctx, -this.w / 2, -this.h / 2, this.w, this.h, {});
      ctx.restore();
      return;
    }
    const blink = (Math.floor(t * 6) % 7) === 0;
    drawSlime(ctx, this.x - cam.x, this.y - cam.y, this.w, this.h, { blink });
  }
}

// ---------- Cuervo Robacarteras ----------
class Crow extends Enemy {
  constructor(x, y, flying) {
    super(x, y, 36, 36);
    this.kind = 'crow';
    this.flying = flying;
    this.shellMode = false;
    this.shellTimer = 0;
    this.shellMoving = false;
    this.flap = 0;
    this.baseY = y;
    this.tParam = 0;
    this.vx = flying ? 100 : -75;
    this.canBeStomped = true;
    this.canBeProjectiled = true;
    this.canBeDeflected = true;
  }
  killByStomp() {
    if (!this.shellMode) {
      // primer pisotón: convertir en concha
      this.shellMode = true;
      this.shellTimer = 8;
      this.shellMoving = false;
      this.vx = 0;
      this.vy = -100;
      this.flying = false;
      SFX.stomp();
      return;
    }
    if (this.shellMoving) {
      // pisotón sobre concha en movimiento -> detener
      this.shellMoving = false;
      this.vx = 0;
      SFX.stomp();
      return;
    }
    // pisotón sobre concha quieta -> patear
    // dirección depende de quién pisó (la sets desde main)
    this.shellMoving = true;
    this.vx = this.kickDir > 0 ? 360 : -360;
    SFX.stomp();
  }
  // Espada sobre cuervo: si no está en concha, lo mata; si está, lo patea.
  killBySword(fromDir) {
    if (this.shellMode) {
      this.shellMoving = true;
      this.vx = (fromDir || 1) * 420;
      SFX.stomp();
    } else {
      this.dead = true;
      this.deadTimer = 0;
      this.vy = -320;
      this.vx = (fromDir || 1) * 220;
      SFX.stomp();
    }
  }
  update(dt, world) {
    this.dt = dt;
    this.tParam += dt;
    if (this.dead) {
      this.deadTimer += dt;
      this.vy += 1800 * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      return;
    }
    if (this.shellMode) {
      this.shellTimer -= dt;
      if (this.shellTimer < 0 && !this.shellMoving) {
        // sale del modo concha
        this.shellMode = false;
        this.flying = false;
        this.vx = -60;
      }
    }
    if (this.flying) {
      // patrón sinusoidal
      this.vy = Math.sin(this.tParam * 3) * 120;
      this.flap = Math.floor(this.tParam * 6) % 4;
      this.x += this.vx * dt;
      this.y = this.baseY + Math.sin(this.tParam * 2) * 20;
      // rebotar contra muros sólidos
      const l = Math.floor(this.x / TILE);
      const r = Math.floor((this.x + this.w) / TILE);
      const row = Math.floor((this.y + this.h / 2) / TILE);
      if (world.isSolid(l, row) || world.isSolid(r, row)) {
        this.vx = -this.vx;
        this.facing = -this.facing;
      }
    } else {
      this.vy += 1800 * dt;
      if (this.vy > 600) this.vy = 600;
      if (this.onGround && !this.shellMode) {
        const aheadX = Math.floor((this.x + (this.vx > 0 ? this.w + 1 : -1)) / TILE);
        const belowR = Math.floor((this.y + this.h + 2) / TILE);
        if (!world.isSolid(aheadX, belowR)) {
          this.vx = -this.vx;
          this.facing = -this.facing;
        }
      }
      collideTiles(this, world);
    }
  }
  draw(ctx, cam, t) {
    if (this.dead) {
      ctx.save();
      ctx.translate(this.x - cam.x + this.w / 2, this.y - cam.y + this.h / 2);
      ctx.scale(1, -1);
      drawCrow(ctx, -this.w / 2, -this.h / 2, this.w, this.h, { facing: this.facing, shellMode: this.shellMode });
      ctx.restore();
      return;
    }
    const blink = (Math.floor(t * 6) % 11) === 0;
    drawCrow(ctx, this.x - cam.x, this.y - cam.y, this.w, this.h, {
      facing: this.facing,
      flying: this.flying,
      shellMode: this.shellMode,
      flap: this.flap,
      blink,
    });
  }
}

// ---------- Cactus Rodante (invencible al salto Y a la espada) ----------
class Cactus extends Enemy {
  constructor(x, y) {
    super(x, y, 38, 38);
    this.kind = 'cactus';
    this.vx = -110;
    this.canBeStomped = false;
    this.canBeProjectiled = true; // se destruye con notas
    this.canBeDeflected = false;
    this.rot = 0;
  }
  // La espada NO daña al cactus (sus espinas paran el filo).
  killBySword() { /* ignored — solo notas musicales lo destruyen */ }
  update(dt, world) {
    this.dt = dt;
    this.rot += Math.abs(this.vx) * dt * 0.05;
    if (this.dead) {
      this.deadTimer += dt;
      this.vy += 1800 * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      return;
    }
    this.vy += 1800 * dt;
    if (this.vy > 600) this.vy = 600;
    if (this.onGround) {
      const aheadX = Math.floor((this.x + (this.vx > 0 ? this.w + 1 : -1)) / TILE);
      const belowR = Math.floor((this.y + this.h + 2) / TILE);
      if (!world.isSolid(aheadX, belowR)) {
        this.vx = -this.vx;
        this.facing = -this.facing;
      }
    }
    collideTiles(this, world);
  }
  draw(ctx, cam) {
    if (this.dead) {
      ctx.save();
      ctx.translate(this.x - cam.x + this.w / 2, this.y - cam.y + this.h / 2);
      ctx.scale(1, -1);
      drawCactus(ctx, -this.w / 2, -this.h / 2, this.w, this.h, { rot: this.rot });
      ctx.restore();
      return;
    }
    drawCactus(ctx, this.x - cam.x, this.y - cam.y, this.w, this.h, { rot: this.rot });
  }
}

// ---------- Mapache Gigante Mutante (jefe) ----------
class RaccoonBoss extends Enemy {
  constructor(x, y) {
    super(x, y, 120, 120);
    this.kind = 'boss';
    this.hp = 5;
    this.facing = -1;
    this.vx = -150;
    this.canBeStomped = true;
    this.canBeProjectiled = true;
    this.canBeDeflected = false;
    this.hurtTimer = 0;
    this.jumpTimer = 1.5;
  }
  hit() {
    this.hp -= 1;
    this.hurtTimer = 0.3;
    SFX.bossHit();
    if (this.hp <= 0) {
      this.dead = true;
      this.deadTimer = 0;
      this.vy = -300;
      this.vx = this.facing * 80;
    } else {
      // rebote
      this.vy = -500;
      this.vx *= 1.1;
    }
  }
  killByStomp() { this.hit(); }
  killByProjectile() { this.hit(); }
  killBySword() { this.hit(); }
  update(dt, world) {
    this.dt = dt;
    if (this.hurtTimer > 0) this.hurtTimer -= dt;
    if (this.dead) {
      this.deadTimer += dt;
      this.vy += 1800 * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      return;
    }
    this.vy += 1800 * dt;
    if (this.vy > 700) this.vy = 700;

    this.jumpTimer -= dt;
    if (this.onGround && this.jumpTimer < 0) {
      this.vy = -700;
      this.jumpTimer = 1.2 + Math.random() * 0.6;
    }

    // patrullaje en su zona (con gestion de bordes)
    if (this.onGround) {
      const aheadX = Math.floor((this.x + (this.vx > 0 ? this.w + 2 : -2)) / TILE);
      const belowR = Math.floor((this.y + this.h + 2) / TILE);
      if (!world.isSolid(aheadX, belowR)) {
        this.vx = -this.vx;
        this.facing = -this.facing;
      }
    }
    collideTiles(this, world);
  }
  draw(ctx, cam) {
    if (this.dead) {
      ctx.save();
      ctx.translate(this.x - cam.x + this.w / 2, this.y - cam.y + this.h / 2);
      ctx.scale(1, -1);
      drawRaccoonBoss(ctx, -this.w / 2, -this.h / 2, this.w, this.h, { facing: this.facing });
      ctx.restore();
      return;
    }
    drawRaccoonBoss(ctx, this.x - cam.x, this.y - cam.y, this.w, this.h, {
      facing: this.facing,
      hurt: this.hurtTimer > 0,
    });
  }
}
// Entidades del mundo: monedas, power-ups, notas musicales, meta y mochila.

class Coin {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.w = 24; this.h = 24;
    this.collected = false;
    this.t = 0;
  }
  get aabb() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  update(dt) { this.t += dt; }
  draw(ctx, cam) {
    drawCoin(ctx, this.x - cam.x + 4, this.y - cam.y + 4, 24, this.t);
  }
}

// Moneda volátil que aparece al golpear caja misteriosa.
class PopCoin {
  constructor(x, y) {
    this.x = x - 12; this.y = y - 24;
    this.vy = -360; this.vx = 0;
    this.w = 24; this.h = 24;
    this.t = 0;
    this.life = 0.7;
    this.collected = true; // no necesita ser recolectada — se cuenta al spawnear
  }
  update(dt) {
    this.t += dt;
    this.life -= dt;
    this.vy += 1400 * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }
  get done() { return this.life <= 0; }
  draw(ctx, cam) {
    drawCoin(ctx, this.x - cam.x, this.y - cam.y, 24, this.t);
  }
}

// Power-up que sube de la caja y luego camina horizontal cayendo por gravedad.
class PowerUp {
  constructor(x, y, kind) {
    this.kind = kind; // 'energy' | 'headphones'
    this.x = x - 14; this.y = y;
    this.w = 28; this.h = 28;
    this.vx = 0;
    this.vy = -120;
    this.t = 0;
    this.spawnPhase = 0.5; // tiempo subiendo de la caja
    this.collected = false;
  }
  get aabb() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  update(dt, world) {
    this.t += dt;
    if (this.spawnPhase > 0) {
      this.spawnPhase -= dt;
      this.y += this.vy * dt;
      if (this.spawnPhase <= 0) {
        this.vy = 0;
        this.vx = 90;
      }
      return;
    }
    this.vy += 1400 * dt;
    if (this.vy > 500) this.vy = 500;
    // X
    this.x += this.vx * dt;
    let l = Math.floor(this.x / TILE);
    let r = Math.floor((this.x + this.w - 1) / TILE);
    let tt = Math.floor(this.y / TILE);
    let bb = Math.floor((this.y + this.h - 1) / TILE);
    for (let row = tt; row <= bb; row++) {
      for (let col = l; col <= r; col++) {
        if (!world.isSolid(col, row) || world.isOneWay(col, row)) continue;
        const tile = world.tileRect(col, row);
        if (this.vx > 0) this.x = tile.x - this.w;
        else if (this.vx < 0) this.x = tile.x + tile.w;
        this.vx = -this.vx;
      }
    }
    // Y
    this.y += this.vy * dt;
    l = Math.floor(this.x / TILE);
    r = Math.floor((this.x + this.w - 1) / TILE);
    tt = Math.floor(this.y / TILE);
    bb = Math.floor((this.y + this.h - 1) / TILE);
    for (let row = tt; row <= bb; row++) {
      for (let col = l; col <= r; col++) {
        if (!world.isSolid(col, row)) continue;
        const tile = world.tileRect(col, row);
        const isOneWay = world.isOneWay(col, row);
        if (this.vy > 0) {
          if (isOneWay) {
            const prevBottom = this.y + this.h - this.vy * dt;
            if (prevBottom > tile.y + 1) continue;
          }
          this.y = tile.y - this.h; this.vy = 0;
        } else if (this.vy < 0) {
          if (isOneWay) continue;
          this.y = tile.y + tile.h; this.vy = 0;
        }
      }
    }
  }
  draw(ctx, cam) {
    if (this.kind === 'energy') {
      drawEnergyDrink(ctx, this.x - cam.x, this.y - cam.y, this.w);
    } else {
      drawHeadphonesItem(ctx, this.x - cam.x, this.y - cam.y, this.w);
    }
  }
}

// Proyectil "nota musical" — rebota en el suelo y puede destruir cactus.
class MusicNote {
  constructor(x, y, dir) {
    this.x = x; this.y = y;
    this.w = 20; this.h = 20;
    this.vx = dir * 460;
    this.vy = -80;
    this.life = 2.5;
    this.t = 0;
    this.dead = false;
  }
  get aabb() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  update(dt, world) {
    this.t += dt;
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    this.vy += 1400 * dt;
    if (this.vy > 600) this.vy = 600;
    // X
    this.x += this.vx * dt;
    let l = Math.floor(this.x / TILE);
    let r = Math.floor((this.x + this.w - 1) / TILE);
    let tt = Math.floor(this.y / TILE);
    let bb = Math.floor((this.y + this.h - 1) / TILE);
    for (let row = tt; row <= bb; row++) {
      for (let col = l; col <= r; col++) {
        if (!world.isSolid(col, row) || world.isOneWay(col, row)) continue;
        // contra muro: muere
        this.dead = true;
        return;
      }
    }
    // Y
    this.y += this.vy * dt;
    l = Math.floor(this.x / TILE);
    r = Math.floor((this.x + this.w - 1) / TILE);
    tt = Math.floor(this.y / TILE);
    bb = Math.floor((this.y + this.h - 1) / TILE);
    for (let row = tt; row <= bb; row++) {
      for (let col = l; col <= r; col++) {
        if (!world.isSolid(col, row)) continue;
        const tile = world.tileRect(col, row);
        const isOneWay = world.isOneWay(col, row);
        if (this.vy > 0) {
          if (isOneWay) {
            const prevBottom = this.y + this.h - this.vy * dt;
            if (prevBottom > tile.y + 1) continue;
          }
          this.y = tile.y - this.h;
          this.vy = -440; // rebote
        } else if (this.vy < 0) {
          if (isOneWay) continue;
          this.y = tile.y + tile.h;
          this.vy = 80;
        }
      }
    }
  }
  draw(ctx, cam) {
    drawMusicNote(ctx, this.x - cam.x, this.y - cam.y, this.w, this.t);
  }
}

// Meta — estación de tren / parada de autobús.
class Goal {
  constructor(col, row) {
    this.x = col * TILE - 16;
    this.y = row * TILE - TILE * 2;
    this.w = 64; this.h = 96;
    this.touched = false;
  }
  get aabb() { return { x: this.x + 12, y: this.y, w: 32, h: this.h }; }
  draw(ctx, cam) {
    drawGoal(ctx, this.x - cam.x, this.y - cam.y, 64, 128);
  }
}

// La mochila, recompensa final del jefe.
class Backpack {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.w = 32; this.h = 32;
    this.collected = false;
    this.t = 0;
  }
  get aabb() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  update(dt) { this.t += dt; this.y += Math.sin(this.t * 3) * 0.3; }
  draw(ctx, cam) {
    drawBackpack(ctx, this.x - cam.x, this.y - cam.y, this.w);
  }
}
// HUD, mensajes, pantallas de pausa/game-over/victoria.

function drawHUD(ctx, viewW, state) {
  // barra superior
  ctx.fillStyle = 'rgba(8,5,22,0.55)';
  ctx.fillRect(0, 0, viewW, 36);

  ctx.fillStyle = '#f4eefb';
  ctx.font = 'bold 14px "JetBrains Mono", monospace';
  ctx.textBaseline = 'middle';

  // Mía mini + vidas
  drawMia(ctx, 8, 4, 20, 28, { facing: 1, hasHeadphones: state.hasHeadphones });
  ctx.fillText(`× ${state.lives}`, 32, 18);

  // Monedas
  drawCoin(ctx, 88, 6, 24, 0.1);
  ctx.fillText(`× ${String(state.coins).padStart(2, '0')}`, 116, 18);

  // Score
  ctx.fillText(`SCORE ${String(state.score).padStart(6, '0')}`, 180, 18);

  // Nivel
  ctx.fillText(`MUNDO ${state.world}`, 340, 18);

  // Tiempo
  const time = Math.max(0, Math.ceil(state.timeLeft));
  ctx.fillStyle = time < 30 ? '#ff7676' : '#f4eefb';
  ctx.fillText(`TIEMPO ${String(time).padStart(3, '0')}`, 460, 18);

  // Mochila status (si la tiene tras vencer al jefe)
  if (state.hasBackpack) {
    drawBackpack(ctx, viewW - 36, 4, 28);
  }

  // Mensaje de centro (level start, level complete, etc.)
  if (state.bigMessage) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, state.bigMessageY ?? 180, viewW, 100);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(state.bigMessage, viewW / 2, (state.bigMessageY ?? 180) + 40);
    if (state.bigSubMessage) {
      ctx.font = '14px "JetBrains Mono", monospace';
      ctx.fillStyle = '#cfc8e3';
      ctx.fillText(state.bigSubMessage, viewW / 2, (state.bigMessageY ?? 180) + 70);
    }
    ctx.textAlign = 'left';
  }

  // Toast (notificaciones cortas)
  if (state.toast && state.toastTime > 0) {
    ctx.fillStyle = 'rgba(8,5,22,0.7)';
    const tw = ctx.measureText(state.toast).width + 24;
    ctx.fillRect((viewW - tw) / 2, 50, tw, 26);
    ctx.fillStyle = '#ffd14f';
    ctx.font = 'bold 13px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(state.toast, viewW / 2, 67);
    ctx.textAlign = 'left';
  }

  // Barra de vida del jefe
  if (state.bossHpMax) {
    const x = viewW / 2 - 120, y = 44;
    ctx.fillStyle = 'rgba(8,5,22,0.7)';
    ctx.fillRect(x - 4, y - 4, 248, 22);
    ctx.fillStyle = '#3a2a55';
    ctx.fillRect(x, y, 240, 14);
    const ratio = Math.max(0, state.bossHp / state.bossHpMax);
    const grad = ctx.createLinearGradient(x, y, x + 240, y);
    grad.addColorStop(0, '#ff4fa3');
    grad.addColorStop(1, '#6cf0ff');
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, 240 * ratio, 14);
    ctx.fillStyle = '#fff';
    ctx.font = '12px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('MAPACHE GIGANTE MUTANTE', viewW / 2, y - 8);
    ctx.textAlign = 'left';
  }
}

// Pantalla de pausa
function drawPause(ctx, viewW, viewH) {
  ctx.fillStyle = 'rgba(8,5,22,0.65)';
  ctx.fillRect(0, 0, viewW, viewH);
